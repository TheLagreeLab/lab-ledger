  // ---------- Help ----------
  function viewHelp() {
    const sec = (id, title, body, open) => `<details class="card help" id="h-${id}"${open ? ' open' : ''}><summary><h2>${title}</h2></summary><div class="hb">${body}</div></details>`;
    return `<div class="card"><h1 class="ht">How Lab Ledger works</h1><p>Lab Ledger shows how the studio is doing: money in the bank, what came in and went out each month, sales, instructors and the next three months. You don't type numbers in. You drop in a few files once a month and the app does the rest. Tap any <span class="q static">?</span> in the app for a short explanation.</p></div>
    ${sec('month', 'Every month (5 minutes)', `<ol class="steps">
      <li><b>Bank:</b> in George Business open the account → <i>Kontoauszüge</i> → download the PDF of last month.</li>
      <li><b>Eversports sales:</b> Financials → Reports → <i>Revenue report (based on income & expenses)</i> for last month.</li>
      <li><b>Gift vouchers:</b> Financials → Reports → <i>Voucher sales report</i>, same month.</li>
      <li><b>Classes:</b> Activities → Export activity & booking data → <i>Activity overview of all appointments</i>. Take last month and next month.</li>
      <li><b>For the Growth page</b> (optional, same drop): Products → Analysis → <i>Export activity & booking data</i>; Analytics → Reports → <i>Customers with bookings</i> (this year); and from Meta Ads Manager the report <i>by age and gender</i> as CSV.</li>
      <li>Open <b>Setup → Import</b> and drop all files in at once. Anything already there is skipped.</li>
      <li>Look at <b>Overview → Needs a look</b> and sort anything new.</li></ol>`, true)}
    ${sec('pages', 'What each page shows', `<p>The app has four sections (top on a computer, bottom bar on the phone): <b>Business</b> (Overview, Cash flow, Transactions), <b>Growth</b> (Clients, Sales), <b>Planning</b> (Schedule, Events, Team) and <b>Setup</b> (Import, Settings, Help).</p>
      <p><b>Boxes:</b> tap a box title to fold it away or open it again; the app remembers. <i>Arrange boxes</i> at the bottom of each page lets you move boxes up or down; tap <i>Done arranging</i> when finished.</p>
      <p><b>Overview:</b> cash in the bank, last month's result, how long the cash lasts, <i>Open money</i> (invoices to pay, money owed to you), and the next 3 months.</p>
      <p><b>Cash flow:</b> every month by category, like your spreadsheet. The shaded columns on the right are the forecast. Tap an amount to see the payments behind it.</p>
      <p><b>Sales:</b> what you sold by product, compared with what reached the bank.</p>
      <p><b>Clients:</b> the short version, the numbers to watch against your targets, and five sections (trials, returning clients, how full classes are, discounts & recurring income, ads). <i>Export report</i> makes the monthly report as a PDF.</p>
      <p><b>Events:</b> a calendar of events and room rentals (this month and 3 ahead), each event's budget, one-off classes found in Eversports, and ideas.</p>
      <p><b>Team:</b> classes per instructor, how full they were, expected pay vs what was paid. This month and the next 3 always show; classes without an instructor yet are estimated with whoever usually teaches them.</p>
      <p><b>Schedule:</b> one week at a time, times on the left: real classes from Eversports, then your standard week. Change classes, add classes, fill instructors, export for the team.</p>
      <p><b>Transactions:</b> every bank payment. Change a category if it's wrong.</p>`)}
    ${sec('result', 'Result, runway, buffer: what they mean', `<p><b>Result</b> = money in from classes minus running costs (rent, instructors, fees…). One-off build-out, certification, VAT refunds and loan money are left out, so you see how the studio itself is doing.</p>
      <p><b>Runway</b> = how many months the cash lasts at the expected pace, loan repayment included.</p>
      <p><b>Safety buffer</b> = the cash you'd like to keep (3 months of running costs) compared with what's in the bank.</p>
      <p><b>Forecast</b>, built line by line:</p><ul>
        <li><b>Sales</b>: your Eversports sales pace of the last 6 weeks, minus the Eversports fee. The <i>range</i> shows sales 15% lower or higher.</li>
        <li><b>Fixed costs</b> (rent, loan, insurance, software, bank, licence …): their real amount in the month they are usually due. Yearly bills only appear in their month. The list is under <i>Regular payments the forecast uses</i>.</li>
        <li><b>Variable costs</b> (supplies, marketing, accounting …): average of recent months.</li>
        <li><b>Instructors</b>: the classes of the month before × rate, plus social security at the rate you actually paid.</li>
        <li><b>VAT</b> (filed monthly): 20% of sales and rent income minus the VAT on costs, due on the 15th of the second month after. Change this in Settings.</li>
        <li><b>Events</b>: tickets and costs from each event's budget, in the event's month.</li>
        <li><b>Room rentals and tenants</b>: their agreed payments in the month they are due (a tenant only once a payment date is agreed).</li>
        <li><b>Open invoices</b> (Overview → Open money): in the month they are due, overdue ones this month. When the payment is in the bank, they are ticked off and drop out.</li></ul>`)}
    ${sec('categories', 'Categories explained', `<table class="t"><tbody>${Object.entries(CATS).map(([k, c]) => `<tr><td><b>${c.label}</b></td><td>${esc(CAT_HELP[k] || '')}</td></tr>`).join('')}</tbody></table>
      <p class="muted small mt">To change a payment: Transactions → choose another category → tap “Always sort … as …” so it happens automatically next time.</p>`)}
    ${sec('schedule', 'Schedule: how it works', `<ol class="steps">
      <li><b>One week at a time</b>, times on the left in Morning, Midday and Afternoon & evening. Arrows go week by week; the month buttons jump ahead (4 months). On the phone, pick the day at the top.</li>
      <li><b>Weeks already in Eversports</b> show the real classes with their instructors. Later weeks show your standard week without instructors. Import the activity export again whenever Eversports changes.</li>
      <li><b>Change a class:</b> tap it. Change the name, time, room or instructor, then choose <i>only this day</i> or <i>every week from this day on</i>. Delete works the same way.</li>
      <li><b>Add a class:</b> <i>+ Add class</i> at the top. Choose the day, name, time and room.</li>
      <li><b>Instructors:</b> pick them by tapping a class, or More → <b>Fill open classes from availability</b>. The app uses only people who are free and teach that class: unpaid instructors first, then whoever usually has the slot, within each person's max per week. Without answers, More → <i>Copy usual instructors</i> puts everyone on their usual slots (it asks first). <i>Remove planned instructors</i> clears them again.</li>
      <li><b>Specialist classes:</b> A format like Latino Burn has one specialist. If someone else gets the slot, it becomes Lagree Burn automatically (Settings → Class types & rooms).</li>
      <li><b>Export for team</b> → Print / save as PDF, or copy the text for WhatsApp. Then create the classes in Eversports.</li></ol>
      <p><b>Availability form:</b> Schedule → More → <i>Google Form script</i>. It builds a form with a grid: days down the side, six time windows across (Early 6:30–8:00, Morning 8–10, Late morning 10–12:30, Afternoon 12:30–17, Evening 17–18:30, Late evening 18:30–21), plus max classes per week and <i>Dates I'm away</i>. A class counts as possible if it <b>starts</b> inside a ticked window. Run the script once in script.google.com and send the link to the team. Each month: in the answers sheet File → Download → CSV, then <b>Import availability</b> on the Schedule page (pick the month first).</p>
      <p><b>Rooms:</b> red = ${esc(LLS.rooms(state)[0])}, blue = ${esc(LLS.rooms(state)[1] || '')}. An orange ring means two things are booked in the same room at the same time.</p>`)}
    ${sec('events', 'Events & room rentals', `<p><b>Events</b> (Planning → Events): add workshops, parties, get-togethers with date, time, room and notes. They appear in the Schedule. <b>＋ Add to Google Calendar</b> in an event opens Google Calendar with everything filled in.</p>
      <p><b>Budget:</b> ticket price and people, catering (per person and/or fixed), the Lagree class (the instructor's rate, €0 if unpaid), other costs and other income. The app shows the result, costs per person and how many people you need to break even, live while you type. The money goes into the forecast in the event's month; after the event the real numbers from Eversports and the bank take over. Link the Eversports ticket to see how many were actually sold.</p>
      <p><b>Found in Eversports:</b> one-off classes (pop-ups, specials) that aren't a regular class type. <i>Add</i> puts them in your events with tickets and revenue; <i>Ignore</i> hides them.</p>
      <p><b>Room rentals</b> (e.g. a teacher renting a room on Saturdays) block the room on each booked date, and the agreed payments appear in the forecast in the month they're due.</p>
      <p><b>Calendar:</b> the month at a glance; the arrows go up to 3 months ahead. Gold = event, purple = internal, blue = room rental. Tap one to edit it.</p>
      <p><b>Ideas:</b> keep your own list, and see suggestions from your numbers with the reason behind them. <i>Plan it</i> turns an idea into an event.</p>`)}
    ${sec('growth', 'Growth: what the numbers mean', `<p><b>The short version</b> sums up the month in a few sentences and says where to focus. <b>The numbers to watch</b> compare the latest month with the month before and your target (green = on target). Targets are in Settings.</p>
      <p><b>Trial → bought within 30 days</b>: of the people whose first class was a trial, how many bought anything else within 30 days. <b>Active clients</b>: people with at least one booking that month, split into new and returning. <b>Regulars</b>: 4+ bookings in the month. <b>Classes full</b>: bookings ÷ places.</p>
      <p>For this page, export two extra files from Eversports once a month (Products → Analysis → Export activity & booking data; Analytics → Reports → Customers with bookings) and drop them into Import. The <b>win-back list</b> shows people with 2+ visits who haven't booked this month. Email only those with newsletter consent; reach the others personally.</p>
      <p><b>Ads</b> come from the Meta report by age and gender: spend, clicks, how many clicks actually load the page, and how much went outside your main audience (women 25–54).</p>
      <p><b>Export report</b> (top of the page): last month's report with the short version, the money, the numbers to watch and what to do next. Print it or save it as PDF.</p>`)}
    ${sec('open', 'Open money: invoices and tenants', `<p><b>Overview → Open money</b> lists invoices you still have to pay (<i>+ Invoice to pay</i>) and money others owe you. Each open invoice goes into the forecast in the month it is due. When the payment appears in an imported bank statement (same amount, matching name) it is ticked off automatically; you can also mark it paid by hand.</p>
      <p><b>Tenants</b> (Settings → Tenants): monthly rent, since when it is due, when regular payments start, and how the back rent is paid (in one go or in instalments). Until it is paid, the rent owed shows in Open money and as a grey line at the bottom of Cash flow. It goes into the forecast once a payment date is set.</p>`)}
    ${sec('team', 'Instructors: paid, unpaid, invoices', `<p>In <b>Settings → Instructors</b> set each person to <i>Paid</i>, <i>Unpaid</i> or <i>Not in tool</i> (hidden from the money, still schedulable). For paid instructors enter the rate per class and the name that appears on the bank statement. <i>Paid from</i> is for someone who starts unpaid and later sends invoices. <b>+ Add instructor</b> adds someone new.</p>`)}
    ${sec('share', 'Sharing with your co-owner', `<p>Both of you use the same app link. In <b>Settings → Sync</b>, each device connects with the same <b>token</b>, <b>Sync ID</b> and <b>passphrase</b>. Changes appear on the other devices within seconds. Share these three through a password manager, not one chat message.</p>`)}
    ${sec('lock', 'Face ID and PIN', `<p><b>Settings → App lock</b>: choose a PIN and tick Face ID / Touch ID. From then on the app asks every time you open it, and after 2 minutes away. Set it up on each device. Forgot the PIN? Remove the app from the device and connect sync again: your data comes back from the encrypted sync file.</p>`)}
    ${sec('safe', 'Is my data safe?', `<p>Your numbers are stored on your devices and, encrypted, in the studio's GitHub account. Without the passphrase nobody can read them, GitHub included. Files you import never leave your device. Customer names and emails are stored only from the Growth exports (for the win-back list), and only inside this encrypted data. Birthdays, phone numbers and other columns the app doesn't need are dropped on import. The app code on GitHub contains no data.</p>`)}
    ${sec('wrong', 'Something looks wrong?', `<p><b>A payment is in the wrong category:</b> Transactions → change it. <b>Cash doesn't match the bank:</b> import the latest statement PDF; each statement is checked against its own balance. <b>Instructor pay looks off:</b> check Settings → Instructors (status, rate, paid from, bank name). <b>Anything else:</b> take a screenshot and send it to whoever helps you with the app.</p>`)}`;
  }

  // ---------- events ----------
  function afterRender() {
    const fi = $('#file'); if (fi) fi.onchange = () => importFiles([...fi.files]);
    const rs = $('#restore'); if (rs) rs.onchange = () => importFiles([...rs.files]);
    const md = $('#modal'); if (md) md.onclick = (e) => { if (e.target === md) closeModal(); };
    const af = $('#availFile'); if (af) af.onchange = () => importFiles([...af.files]);
    const br = $('#bioRow'); if (br) Lock.bioAvailable().then((ok) => { br.hidden = !ok; });
    const pin = $('#pinIn'); if (pin) { pin.onkeydown = (e) => { if (e.key === 'Enter') ACT.unlockPin(); }; if (!Lock.hasBio()) setTimeout(() => pin.focus(), 50); }
    const q = $('#txQ'); if (q) q.oninput = () => { ui.txQ = q.value; saveUI(); const pos = q.selectionStart; render(); const n = $('#txQ'); n.focus(); n.setSelectionRange(pos, pos); };
  }
  document.addEventListener('dragover', (e) => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); });
  document.addEventListener('dragleave', () => { const d = $('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files.length) { ui.page = 'import'; saveUI(); render(); importFiles([...e.dataTransfer.files]); } });

  const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const ACT = {
    section: (el) => { const sec = SECTIONS.find((x) => x.k === el.dataset.v); const last = (ui.lastPage || {})[sec.k]; ui.page = last && sec.pages.some((p) => p[0] === last) ? last : sec.pages[0][0]; saveUI(); render(); window.scrollTo(0, 0); },
    fold: (el, e) => { if (e && e.target.closest('.q, a, button:not(.foldable)')) return; const id = el.dataset.v; ui.collapsed = ui.collapsed || {}; ui.collapsed[id] = !ui.collapsed[id]; if (!ui.collapsed[id]) delete ui.collapsed[id]; saveUI(); const c = document.querySelector(`[data-cid="${CSS.escape(id)}"]`); if (c) c.classList.toggle('collapsed', !!ui.collapsed[id]); },
    arrange: () => { ui.arrange = !ui.arrange; saveUI(); render(); },
    arrangeReset: () => { if (ui.order) delete ui.order[ui.page]; saveUI(); render(); },
    mvBox: (el) => {
      const ids = [...$('#main').children].filter((x) => x.dataset.bid).map((x) => x.dataset.bid);
      const i = ids.indexOf(el.dataset.v), j = i + +el.dataset.d; if (j < 0 || j >= ids.length) return;
      [ids[i], ids[j]] = [ids[j], ids[i]]; ui.order = ui.order || {}; ui.order[ui.page] = ids; saveUI(); render();
    },
    theme: () => { ui.theme = { auto: 'light', light: 'dark', dark: 'auto' }[ui.theme] || 'auto'; saveUI(); render(); toast('Appearance: ' + ({ auto: 'automatic (follows your device)', light: 'light', dark: 'dark' }[ui.theme]), 1800); },
    schedMonth: (el) => { ui.schedMonth = el.dataset.v; ui.schedWeek = weekStartFor(el.dataset.v); ui.schedDay = ''; saveUI(); render(); },
    slotsFromEv: (el) => {
      state.settings.slots = LLS.slotsFromClasses(state, el.dataset.v); state.settings.updatedAt = Date.now();
      for (const m of schedMonths()) if (state.plans[m] && !Object.values(state.plans[m].classes || {}).some((c) => c.ins)) delete state.plans[m];
      save(); render();
    },
    room: (el) => { ui.room = el.dataset.v; saveUI(); render(); },
    propose: () => {
      const M = ui.schedMonth; const av = LL.live(state.avail).filter((a) => a.month === M).length;
      if (!av && !confirm(`No availability answers for ${mName(M, true)} yet. Put everyone on their usual slots in the open classes? (You can remove them again under More.)`)) return;
      const r = LLS.propose(state, M, { assumeAll: !av });
      save(); render(); toast(`${r.total - r.unfilled} of ${r.total} classes in ${mName(M, true)} have an instructor${r.unfilled ? `, ${r.unfilled} still open (red)` : ''}.`, 6000);
    },
    clearIns: () => { if (confirm('Remove all instructors from ' + mName(ui.schedMonth, true) + '? Classes stay.')) { LLS.clearInstructors(state, ui.schedMonth); save(); render(); } },
    resetPlan: () => { if (confirm('Go back to the standard week for ' + mName(ui.schedMonth, true) + '? All changes and instructors for this month are removed.')) { LLS.resetPlan(state, ui.schedMonth); save(); render(); } },
    formScript: () => {
      const ms = [1, 2, 3, 4].map((i) => mName(LL.addMonths(LL.mk(today()), i), true));
      const code = LLS.formScript(state, ms);
      openModal(`<h2>Google Form script</h2><p class="small">Builds the availability form from your current standard week: one question per day with that day's class times (no class names). Make a new form whenever the times change.</p>
        <ol class="steps small"><li>Copy the script.</li><li>Open <b>script.google.com</b> → New project → delete what's there → paste → 💾 Save → ▶ Run.</li><li>Allow access (Advanced → Go to project → Allow).</li><li>The log at the bottom shows the link to send to the team.</li></ol>
        <textarea class="in mono code" id="fsCode" rows="9" readonly>${esc(code)}</textarea>
        <div class="row gap mt"><button class="btn primary" data-act="copyScript">Copy script</button><button class="btn" data-act="closeModal">Close</button></div>`);
    },
    copyScript: () => { const t = $('#fsCode'); t.select(); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Copied.'), () => { document.execCommand('copy'); toast('Copied.'); }); },
    editClass: (el) => { const p = LLS.getPlan(state, el.dataset.m || ui.schedMonth); const c = p && p.classes[el.dataset.id]; if (c) openModal(classEditor(c)); },
    newClass: (el) => openModal(classEditor(null, el.dataset.date)),
    schedWeek: (el) => { ui.schedWeek = new Date(new Date(ui.schedWeek + 'T12:00:00').getTime() + +el.dataset.d * 864e5).toISOString().slice(0, 10); ui.schedDay = ''; saveUI(); render(); },
    schedDay: (el) => { ui.schedDay = el.dataset.v; saveUI(); render(); },
    closeModal: () => closeModal(),
    saveClass: (el) => {
      const tSel = $('#ceType').value, title = (tSel === '__other' ? $('#ceTitle').value : tSel).trim(), start = LLS.hhmm($('#ceStart').value), end = LLS.hhmm($('#ceEnd').value), room = $('#ceRoom').value, ins = $('#ceIns').value;
      const scope = (document.querySelector('input[name=ceScope]:checked') || {}).value || 'once';
      if (!title || !start) { $('#ceErr').textContent = 'A class name and a start time (e.g. 07:40) are needed.'; return; }
      const e2 = end && LLS.mins(end) > LLS.mins(start) ? end : LLS.hhmm(LLS.mins(start) + 50);
      if (!LLS.classTypes(state).some((t) => t.name.toLowerCase() === title.toLowerCase())) { state.settings.classTypes = [...(state.settings.classTypes || []), { id: newId('t'), name: title, room, kind: /rental|miete/i.test(title) ? 'rental' : 'class' }]; state.settings.updatedAt = Date.now(); }
      const M = el.dataset.m || ui.schedMonth;
      if (el.dataset.id) {
        const c = LLS.getPlan(state, M).classes[el.dataset.id];
        const ch = { title, start, end: e2, room }; if (ins !== (c.ins || '')) ch.ins = ins;
        LLS.updateClass(state, M, el.dataset.id, ch, scope === 'weekly');
        if (scope === 'weekly' && ch.ins !== undefined) { const c2 = LLS.getPlan(state, M).classes[el.dataset.id]; c2.ins = ins; c2.manual = true; }
      } else {
        const date = ($('#ceDate') && $('#ceDate').value) || el.dataset.date;
        if (!date) { $('#ceErr').textContent = 'Pick a day.'; return; }
        LLS.addClass(state, LL.mk(date), { date, start, end: e2, title, room, ins }, scope === 'weekly');
      }
      closeModal(); save(); render(); toast(scope === 'weekly' ? 'Saved for every week.' : 'Saved.');
    },
    delClass: (el) => {
      const M = el.dataset.m || ui.schedMonth;
      const c = LLS.getPlan(state, M).classes[el.dataset.id];
      const scope = (document.querySelector('input[name=ceScope]:checked') || {}).value || 'once';
      if (!confirm(scope === 'weekly' ? `Delete ${c.title} at ${c.start} every ${DAYS_LONG[LLS.weekday(c.date)]} from ${dShort(c.date)} on?` : `Delete ${c.title} on ${dShort(c.date)} at ${c.start}?`)) return;
      LLS.deleteClass(state, M, el.dataset.id, scope === 'weekly'); closeModal(); save(); render();
    },
    newBill: (el) => openModal(billEditor(null, el.dataset.v)),
    editBill: (el) => { const b = state.bills[el.dataset.id]; if (b) openModal(billEditor(b)); },
    saveBill: (el) => {
      const party = $('#biParty').value.trim(), amount = money($('#biAmt').value);
      if (!party || !amount) { $('#biErr').textContent = 'A name and an amount are needed.'; return; }
      const id = el.dataset.id || newId('b'); const b = state.bills[id] || { id, dir: el.dataset.v, created: today() };
      Object.assign(b, { party, note: $('#biNote').value.trim(), amount: Math.abs(amount), due: $('#biDue').value, cat: $('#biCat').value, match: $('#biMatch').value.trim(), updatedAt: Date.now() });
      state.bills[id] = b; LL.matchBills(state); closeModal(); save(); render(); toast(b.paidOn ? `Saved. Already paid on ${dmy(b.paidOn)} (found in the bank).` : 'Saved. It\'s in the forecast.');
    },
    payBill: (el) => { const b = state.bills[el.dataset.id]; b.paidOn = today(); b.txId = ''; b.updatedAt = Date.now(); closeModal(); save(); render(); },
    unpayBill: (el) => { const b = state.bills[el.dataset.id]; b.paidOn = ''; b.txId = ''; b.noMatch = true; b.updatedAt = Date.now(); closeModal(); save(); render(); },
    delBill: (el) => { const b = state.bills[el.dataset.id]; if (b && confirm('Delete this entry?')) { b.deleted = true; b.updatedAt = Date.now(); closeModal(); save(); render(); } },
    newTenant: () => openModal(tenantEditor(null)),
    editTenant: (el) => { const x = state.tenants[el.dataset.id]; if (x) openModal(tenantEditor(x)); },
    saveTenant: (el) => {
      const id = el.dataset.id || newId('t'); const x = state.tenants[id] || { id };
      Object.assign(x, { name: $('#tnName').value.trim() || 'Tenant', monthly: money($('#tnMonthly').value), from: $('#tnFrom').value, payFrom: $('#tnPayFrom').value, backPlan: (document.querySelector('input[name=tnBack]:checked') || {}).value || 'lump', backMonths: Math.max(1, parseInt($('#tnBackMonths').value, 10) || 1), backFrom: $('#tnBackFrom').value, match: $('#tnMatch').value.trim(), notes: $('#tnNotes').value, updatedAt: Date.now() });
      state.tenants[id] = x; closeModal(); save(); render(); toast('Saved.');
    },
    delTenant: (el) => { const x = state.tenants[el.dataset.id]; if (x && confirm('Delete ' + x.name + '?')) { x.deleted = true; x.updatedAt = Date.now(); closeModal(); save(); render(); } },
    addFound: (el) => {
      const x = LL.foundEvents(state).find((f) => f.title === el.dataset.v && f.date === el.dataset.d); if (!x) return;
      const id = newId('e');
      state.events[id] = { id, kind: 'event', title: x.title, date: x.date, start: x.start || '', end: x.end || '', room: LLS.roomOf(state, x.title) || '', internal: false, notes: '', budget: { product: x.sold ? x.title : '', price: x.price, people: Math.max(x.sold, x.people), classes: 1, other: [] }, updatedAt: Date.now() };
      save(); render(); toast('Added to events.');
    },
    ignoreFound: (el) => { state.settings.evIgnore = [...(state.settings.evIgnore || []), el.dataset.v]; state.settings.updatedAt = Date.now(); save(); render(); },
    newEvent: () => openModal(eventEditor(null)),
    editEvent: (el) => { const e = state.events[el.dataset.id]; if (e) openModal(eventEditor(e)); },
    planIdea: (el) => openModal(eventEditor(null, { title: el.dataset.v, notes: el.dataset.why || '' })),
    saveEvent: (el) => {
      const ex = el.dataset.id ? state.events[el.dataset.id] : null;
      const e = Object.assign({}, ex || { id: newId('e'), kind: 'event' });
      e.title = $('#evTitle').value.trim(); if (!e.title) { toast('Give the event a title.'); return; }
      e.start = LLS.hhmm($('#evStart').value) || ''; e.end = LLS.hhmm($('#evEnd').value) || ''; e.room = $('#evRoom').value; e.notes = $('#evNotes').value;
      if (e.kind === 'rental') {
        e.dates = $('#evDates').value.split(/[,\n]+/).map((x) => LLParse.isoDate(x.trim())).filter(Boolean).sort();
        e.payments = $('#evPays').value.split('\n').map((l) => { const m = l.trim().match(/^(\S+)\s+(.+)$/); return m && LLParse.isoDate(m[1]) ? { due: LLParse.isoDate(m[1]), amount: money(m[2]) } : null; }).filter(Boolean);
      } else { e.date = $('#evDate').value; e.internal = $('#evInt').checked; e.budget = readBudget(); delete e.income; delete e.cost; }
      e.updatedAt = Date.now(); state.events[e.id] = e; closeModal(); save(); render(); toast('Saved.');
    },
    delEvent: (el) => { const e = state.events[el.dataset.id]; if (e && confirm('Delete “' + e.title + '”?')) { e.deleted = true; e.updatedAt = Date.now(); closeModal(); save(); render(); } },
    addIdea: () => { const v = $('#newIdea').value.trim(); if (!v) return; state.settings.ideas = [...(state.settings.ideas || []), { id: newId('d'), title: v }]; state.settings.updatedAt = Date.now(); save(); render(); },
    delIdea: (el) => { const i = (state.settings.ideas || []).find((x) => x.id === el.dataset.v); if (i) { i.deleted = true; state.settings.updatedAt = Date.now(); save(); render(); } },
    copyWb: (el) => {
      const snap = LL.growthSnapshot(state, today()); const list = snap && snap.retention ? snap.retention.winBack.list : [];
      const em = list.filter((c) => c.email && (el.dataset.v === 'all' || c.newsletter)).map((c) => c.email).join(', ');
      (navigator.clipboard ? navigator.clipboard.writeText(em) : Promise.reject()).then(() => toast(`${em.split(', ').filter(Boolean).length} emails copied.`), () => toast('Copy didn\'t work here.'));
    },
    wbAll: () => { ui.wbAll = true; render(); },
    evMonth: (el) => { const m0 = LL.mk(today()); const n = LL.addMonths(ui.evMonth || m0, +el.dataset.d); if (n >= m0 && n <= LL.addMonths(m0, 3)) { ui.evMonth = n; saveUI(); render(); } },
    report: () => { const cur = LL.mk(today()); exportReport(LL.addMonths(cur, -1)); },
    addType: () => { state.settings.classTypes = [...(state.settings.classTypes || []), { id: newId('t'), name: 'New class', room: LLS.rooms(state)[1] || LLS.rooms(state)[0], kind: 'class' }]; state.settings.updatedAt = Date.now(); save(); render(); },
    delType: (el) => { const n = el.dataset.v; const t = (state.settings.classTypes || []).find((x) => x.name === n); if (t) t.deleted = true; else state.settings.classTypes = [...(state.settings.classTypes || []), { id: newId('t'), name: n, deleted: true }]; state.settings.updatedAt = Date.now(); save(); render(); },
    exportPlan: () => exportPlan(),
    printPlan: () => window.print(),
    copyPlan: () => { const t = $('#print').dataset.text; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied. Paste it into WhatsApp.'), () => toast('Copy didn\'t work here. Use Print / save as PDF instead.')); },
    closePlan: () => { const b = $('#print'); b.hidden = true; b.innerHTML = ''; document.body.classList.remove('printing'); },
    addIns: () => {
      const id = newId('i');
      state.settings.instructors.push({ id, name: 'New instructor', evNames: [], bankNames: [], status: 'unknown', rate: 0, active: true });
      state.settings.updatedAt = Date.now(); save(); render();
      const el = document.querySelector(`#ins-${id} input`); if (el) { el.scrollIntoView({ block: 'center' }); el.select(); }
    },
    teachToggle: (el) => {
      const i = state.settings.instructors.find((x) => x.id === el.dataset.id); const v = el.dataset.v;
      let t = i.teaches && i.teaches.length ? i.teaches.slice() : (() => { const d = LLS.teachesOf(state, Object.assign({}, i, { teaches: [] })); return d.length ? d : (state.settings.slots || []).map((s) => s.title).filter((x) => /lagree burn/i.test(x)); })();
      t = t.includes(v) ? t.filter((x) => x !== v) : [...t, v];
      i.teaches = [...new Set(t)]; state.settings.updatedAt = Date.now(); save(); render();
    },
    delIns: (el) => { const i = state.settings.instructors.find((x) => x.id === el.dataset.v); if (i && confirm(`Remove ${i.name}? Their past classes stay; they just disappear from the lists.`)) { i.deleted = true; state.settings.updatedAt = Date.now(); save(); render(); } },
    lockOn: async () => {
      const a = $('#lockPin1').value, b = $('#lockPin2').value, err = $('#lockSetErr');
      if (!/^\d{4,8}$/.test(a)) { err.textContent = 'The PIN needs 4 to 8 digits.'; return; }
      if (a !== b) { err.textContent = 'The two PINs are different.'; return; }
      const bio = $('#lockBio') && $('#lockBio').checked && !$('#bioRow').hidden;
      try { await Lock.enable(a, bio); toast(bio ? 'App lock is on, with Face ID / Touch ID.' : 'App lock is on.'); render(); }
      catch (e) { err.textContent = 'Face ID / Touch ID couldn\'t be set up (' + e.message + '). Untick it to use the PIN only.'; }
    },
    lockOff: async () => { const err = $('#lockSetErr'); try { if (await Lock.checkPin($('#lockOffPin').value)) { Lock.disable(); toast('App lock is off.'); render(); } else err.textContent = 'Wrong PIN.'; } catch (e) { err.textContent = e.message; } },
    unlockBio: async () => { try { if (await Lock.bio()) { Lock.unlock(); render(); if (Sync.on()) syncNow(); } } catch (e) { $('#lockErr').textContent = 'Not recognised. Try again or use your PIN.'; } },
    unlockPin: async () => { const err = $('#lockErr'); try { if (await Lock.checkPin($('#pinIn').value)) { Lock.unlock(); render(); if (Sync.on()) syncNow(); } else { err.textContent = 'Wrong PIN.'; $('#pinIn').value = ''; } } catch (e) { err.textContent = e.message; } },
    page: (el) => { ui.page = el.dataset.v; ui.lastPage = ui.lastPage || {}; ui.lastPage[sectionOf(ui.page).k] = ui.page; if (el.dataset.cat) { ui.txCat = el.dataset.cat; ui.txMonth = ''; } saveUI(); render(); window.scrollTo(0, 0); },
    cfAll: (el) => { ui.cfAll = el.dataset.v === '1'; saveUI(); render(); },
    salesNet: (el) => { ui.salesNet = el.dataset.v === '1'; saveUI(); render(); },
    teamMonth: (el) => { ui.teamMonth = el.dataset.v; saveUI(); render(); },
    drill: (el) => { ui.page = 'tx'; ui.txMonth = el.dataset.m; ui.txCat = el.dataset.cat; ui.txQ = ''; saveUI(); render(); window.scrollTo(0, 0); },
    txClear: () => { ui.txQ = ''; ui.txMonth = ''; ui.txCat = ''; saveUI(); render(); },
    help: (el) => { const t = $('#tip'); showTip(el, el.dataset.tip, true); },
    copy: (el) => { navigator.clipboard && navigator.clipboard.writeText(el.dataset.v); toast('Copied'); },
    syncNow: () => syncNow(),
    showToken: () => toast(`Token: <code class="mono">${esc(Sync.cfg().token)}</code> <button class="btn sm" data-act="copy" data-v="${esc(Sync.cfg().token)}">Copy</button>`, 15000),
    disconnect: () => { if (confirm('Disconnect this device from sync? Data on this device stays.')) { Sync.disconnect(); render(); } },
    syncCreate: async () => {
      const tok = $('#sTok').value.trim(), pass = $('#sPass').value, err = $('#sErr');
      if (!tok || pass.length < 10) { err.textContent = 'Paste the token and choose a passphrase of at least 10 characters.'; return; }
      err.textContent = 'Creating…';
      try { const id = await Sync.create(tok, pass, state); toast('Sync file created. Sync ID: ' + id); render(); } catch (e) { err.textContent = e.message; }
    },
    syncConnect: async () => {
      const tok = $('#sTok').value.trim(), pass = $('#sPass').value, id = $('#sId').value.trim(), err = $('#sErr');
      if (!tok || !pass || !id) { err.textContent = 'Token, passphrase and Sync ID are all needed to connect.'; return; }
      err.textContent = 'Connecting…';
      try { const remote = await Sync.connect(tok, id, pass); state = LL.migrate(Sync.merge(state, remote)); save(true); await Sync.push(state); toast('Connected. Your data is in.'); render(); } catch (e) { err.textContent = e.message; }
    },
    backup: () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], { type: 'application/json' }));
      a.download = 'lab-ledger-backup-' + today() + '.json'; a.click();
    },
    delRule: (el) => { const r = state.settings.rules[+el.dataset.v]; r.deleted = true; state.settings.updatedAt = Date.now(); save(); render(); },
    erase: () => { if (confirm('Erase all data on this device? Synced data on GitHub and other devices stays.')) { localStorage.removeItem(STORE); Sync.disconnect(); state = LL.migrate(null); render(); } },
    makeRule: (el) => {
      const party = el.dataset.party, cat = el.dataset.cat;
      state.settings.rules = state.settings.rules || [];
      state.settings.rules.unshift({ m: '^' + party.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), c: cat });
      // the rule now decides for the others; keep manual choices only where they differ
      for (const t of LL.live(state.bank)) if (t.party === party && t.cat === cat) { delete t.cat; t.updatedAt = Date.now(); }
      state.settings.updatedAt = Date.now(); save(); render(); toast('Rule saved. Future payments from ' + esc(party) + ' are sorted the same way.');
    },
  };
  const CHANGE = {
    ceType: (el) => {
      const other = el.value === '__other'; $('#ceOtherRow').hidden = !other; if (other) { $('#ceTitle').focus(); return; }
      const r = LLS.roomOf(state, el.value); const rs = $('#ceRoom'); if (r && rs && [...rs.options].some((o) => o.value === r || o.text === r)) rs.value = r;
    },
    txMonth: (el) => { ui.txMonth = el.value; saveUI(); render(); },
    txCat: (el) => { ui.txCat = el.value; saveUI(); render(); },
    setCat: (el) => {
      const t = state.bank[el.dataset.id]; t.cat = el.value; t.updatedAt = Date.now(); save(); render();
      const same = LL.live(state.bank).filter((x) => x.party === t.party).length;
      toast(`Saved. ${same > 1 || true ? `<button class="btn sm" data-act="makeRule" data-party="${esc(t.party)}" data-cat="${t.cat}">Always sort “${esc(t.party.slice(0, 28))}” as ${CATS[t.cat].label}</button>` : ''}`, 9000);
    },
    setWho: (el) => {
      const t = state.bank[el.dataset.id]; t.cat = 'instructors'; t.who = el.value || null; t.updatedAt = Date.now();
      const i = state.settings.instructors.find((x) => x.id === t.who);
      if (i && t.party && !(i.bankNames || []).some((b) => b.toLowerCase() === t.party.toLowerCase())) { i.bankNames = [...(i.bankNames || []), t.party]; state.settings.updatedAt = Date.now(); }
      save(); render();
    },
    insSet: (el) => {
      const i = state.settings.instructors.find((x) => x.id === el.dataset.id); const f = el.dataset.f;
      if (f === 'rate') i.rate = Math.round(parseFloat(el.value.replace(/\./g, '').replace(',', '.')) * 100) || 0;
      else if (f === 'bankNames') i.bankNames = el.value.split(',').map((s) => s.trim()).filter(Boolean);
      else if (f === 'active') i.active = el.checked;
      else if (f === 'teaches') i.teaches = [...el.selectedOptions].map((o) => o.value);
      else if (f === 'paidFrom') i.paidFrom = el.value || null;
      else i[f] = el.value;
      state.settings.updatedAt = Date.now(); save(); render();
    },
    typeSet: (el) => {
      const n = el.dataset.v, f = el.dataset.f; let t = (state.settings.classTypes || []).find((x) => !x.deleted && x.name === n);
      if (!t) { const auto = LLS.classTypes(state).find((x) => x.name === n) || { name: n }; t = { id: newId('t'), name: n, room: auto.room, kind: auto.kind || 'class' }; state.settings.classTypes = [...(state.settings.classTypes || []), t]; }
      if (f === 'name') {
        const v = el.value.trim(); if (!v) return;
        for (const sl of state.settings.slots || []) if (sl.title === n) sl.title = v;
        for (const i of state.settings.instructors) if (i.teaches) i.teaches = i.teaches.map((x) => (x === n ? v : x));
        t.name = v;
      } else t[f] = el.value;
      if (f === 'room') for (const sl of state.settings.slots || []) if (sl.title === t.name) sl.room = el.value;
      state.settings.updatedAt = Date.now(); save(); render();
    },
    setTarget: (el) => { const f = el.dataset.f; const v = parseFloat(String(el.value).replace(',', '.')); if (!isFinite(v)) return; state.settings.targets = Object.assign({}, state.settings.targets, { [f]: f === 'membership' ? Math.round(v * 100) : v }); state.settings.updatedAt = Date.now(); save(); render(); },
    setSetting: (el) => { const f = el.dataset.f; state.settings[f] = f === 'bufferMonths' ? Math.max(0, +el.value || 0) : el.value; state.settings.updatedAt = Date.now(); save(); render(); },
  };
  document.addEventListener('click', (e) => {
    let el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'button')) return;
    if (el.dataset.act === 'fold' && e.target.closest('.q')) el = e.target.closest('.q');
    const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
  });
  document.addEventListener('input', (e) => { if (e.target.closest('[data-calc]')) { const box = $('#bgCalc'), id = $('[data-act=saveEvent]') && $('[data-act=saveEvent]').dataset.id; const base = (id && state.events[id]) || { date: $('#evDate') ? $('#evDate').value : today() }; if (box) box.innerHTML = budgetCalc(Object.assign({}, base, { date: $('#evDate') ? $('#evDate').value || base.date : base.date, budget: readBudget() })); } });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-act]'); if (!el) return; const f = CHANGE[el.dataset.act]; if (f) f(el); });

  // tooltips: hover on desktop, tap on touch
  function showTip(el, html, sticky) {
    const t = $('#tip'); t.innerHTML = html; t.hidden = false;
    const r = el.getBoundingClientRect(); const tw = Math.min(280, window.innerWidth - 24);
    t.style.maxWidth = tw + 'px';
    let x = r.left + r.width / 2 - t.offsetWidth / 2; x = Math.max(12, Math.min(x, window.innerWidth - t.offsetWidth - 12));
    let y = r.top - t.offsetHeight - 8; if (y < 8) y = r.bottom + 8;
    t.style.left = x + 'px'; t.style.top = y + window.scrollY + 'px'; t.dataset.sticky = sticky ? '1' : '';
  }
  document.addEventListener('mouseover', (e) => { const g = e.target.closest('.hov'); if (g) showTip(g, g.dataset.tip); });
  document.addEventListener('mouseout', (e) => { const g = e.target.closest('.hov'); if (g && !$('#tip').dataset.sticky) $('#tip').hidden = true; });
  document.addEventListener('click', (e) => { const g = e.target.closest('.hov'); if (g) showTip(g, g.dataset.tip, true); else if (!e.target.closest('.q')) $('#tip').hidden = true; }, true);

  let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (!document.activeElement || !['INPUT', 'SELECT'].includes(document.activeElement.tagName)) render(); }, 200); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !Lock.isLocked()) syncNow(); });

  Lock.watch(() => render());
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme());
  render();
  if (Sync.on() && !Lock.isLocked()) syncNow();
})();

</script>
</body>
</html>
