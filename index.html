      const g = await gh(c.token, API + '/' + c.gistId);
      return decrypt(await readFile(c.token, g), await keyFromCfg(c));
    },
    async push(state) {
      const c = cfg(); if (!c) return;
      const content = await encrypt(state, await keyFromCfg(c), c.salt);
      await gh(c.token, API + '/' + c.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [FILE]: { content } } }) });
      c.last = Date.now(); saveCfg(c);
    },
    disconnect() { saveCfg(null); },
    // merge two states: per record, the newer edit wins
    merge(a, b) {
      if (!b) return a;
      const out = JSON.parse(JSON.stringify(a));
      for (const k of LL.COLLS) {
        out[k] = out[k] || {};
        for (const [id, r] of Object.entries(b[k] || {})) {
          const l = out[k][id];
          if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) out[k][id] = r;
        }
      }
      if (b.settings && (b.settings.updatedAt || 0) > ((out.settings && out.settings.updatedAt) || 0)) out.settings = b.settings;
      out.importLog = [...(a.importLog || []), ...(b.importLog || [])].filter((x, i, arr) => arr.findIndex((y) => y.id === x.id) === i).sort((x, y) => y.at - x.at).slice(0, 60);
      return out;
    },
  };
  G.Sync = Sync;
})(window);

</script>
<script>
/* Lab Ledger — app lock: Face ID / Touch ID (passkey on this device) with a PIN as backup.
   Settings live on each device. The lock hides the app; the data itself is protected by the device lock and encrypted sync. */
(function (G) {
  'use strict';
  const KEY = 'labledger:lock:v1';
  const AFTER_MS = 2 * 60 * 1000;
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const cfg = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } };
  const save = (c) => { try { c ? localStorage.setItem(KEY, JSON.stringify(c)) : localStorage.removeItem(KEY); } catch (e) {} };
  async function hashPin(pin, salt) {
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(salt), iterations: 150000, hash: 'SHA-256' }, k, 256));
  }
  let locked = false, hiddenAt = 0, fails = 0, waitUntil = 0;

  const Lock = {
    on: () => !!(cfg() && cfg().on),
    hasBio: () => !!(cfg() && cfg().cred),
    isLocked: () => locked,
    async bioAvailable() {
      try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; }
    },
    async enable(pin, useBio) {
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      const c = { on: true, salt, pin: await hashPin(pin, salt), cred: null };
      if (useBio) {
        const cred = await navigator.credentials.create({ publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          rp: { name: 'Lab Ledger', id: location.hostname },
          user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'lab-ledger', displayName: 'Lab Ledger' },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
          authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
          timeout: 60000,
        } });
        c.cred = b64(cred.rawId);
      }
      save(c);
    },
    disable() { save(null); locked = false; },
    async checkPin(pin) {
      const c = cfg(); if (!c) return true;
      if (Date.now() < waitUntil) throw new Error(`Too many tries. Wait ${Math.ceil((waitUntil - Date.now()) / 1000)} seconds.`);
      if (await hashPin(pin, c.salt) === c.pin) { fails = 0; return true; }
      fails++; if (fails >= 5) { waitUntil = Date.now() + 30000; fails = 0; }
      return false;
    },
    async bio() {
      const c = cfg(); if (!c || !c.cred) return false;
      await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64(c.cred) }], userVerification: 'required', timeout: 60000, rpId: location.hostname } });
      return true;
    },
    lock() { if (Lock.on()) locked = true; },
    unlock() { locked = false; },
    // lock again after 2 minutes away
    watch(onLock) {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') hiddenAt = Date.now();
        else if (Lock.on() && hiddenAt && Date.now() - hiddenAt > AFTER_MS) { locked = true; onLock(); }
      });
    },
  };
  if (Lock.on()) locked = true;
  G.Lock = Lock;
})(window);

</script>
<script>
/* Lab Ledger — interface */
(function () {
  'use strict';
  const { CATS, GROUPS } = LL;
  const STORE = 'labledger:data:v1', UIKEY = 'labledger:ui:v1';
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- state ----------
  let state = load();
  let ui = Object.assign({ page: 'overview', cfAll: false, txMonth: '', txCat: '', txQ: '', teamMonth: '', salesNet: false, theme: 'auto', schedMonth: '' }, (() => { try { return JSON.parse(localStorage.getItem(UIKEY)) || {}; } catch (e) { return {}; } })());
  function load() { try { return LL.migrate(JSON.parse(localStorage.getItem(STORE))); } catch (e) { return LL.migrate(null); } }
  function save(silent) {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { toast('Could not save on this device: ' + e.message); }
    if (!silent) scheduleSync();
  }
  function saveUI() { try { localStorage.setItem(UIKEY, JSON.stringify(ui)); } catch (e) {} }
  const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

  // ---------- formatting ----------
  const nf0 = new Intl.NumberFormat('de-AT', { maximumFractionDigits: 0, minimumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat('de-AT', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
  const eur = (c, dec) => (c < 0 ? '−' : '') + '€ ' + (dec ? nf2 : nf0).format(Math.abs(c) / 100);
  const eurS = (c) => (c > 0 ? '+' : '') + eur(c);
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const mName = (m, long) => (long ? ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][+m.slice(5) - 1] : MON[+m.slice(5) - 1]) + ' ' + (long ? m.slice(0, 4) : "'" + m.slice(2, 4));
  const dmy = (iso) => (iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4) : '—');
  const pct = (x) => (isFinite(x) ? Math.round(x * 100) + '%' : '—');
  const cls = (c) => (c < 0 ? 'neg' : c > 0 ? 'pos' : '');

  // ---------- toast ----------
  let toastT;
  function toast(html, ms = 4200) {
    const t = $('#toast'); t.innerHTML = html; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), ms);
  }

  // ---------- sync ----------
  let syncT, syncing = false, syncErr = null;
  function scheduleSync() { if (!Sync.on()) return; clearTimeout(syncT); syncT = setTimeout(syncNow, 2500); setSyncBadge('pending'); }
  async function syncNow() {
    if (!Sync.on() || syncing) return;
    syncing = true; setSyncBadge('busy');
    try {
      const remote = await Sync.pull();
      state = LL.migrate(Sync.merge(state, remote));
      save(true);
      await Sync.push(state);
      syncErr = null; setSyncBadge('ok');
      render();
    } catch (e) { syncErr = e.message; setSyncBadge('err'); }
    syncing = false;
  }
  function setSyncBadge(s) {
    const b = $('#syncBadge'); if (!b) return;
    if (!Sync.on()) { b.className = 'sync off'; b.textContent = 'Not synced'; b.title = 'Settings → Sync'; return; }
    const map = { ok: ['ok', 'Synced'], busy: ['busy', 'Syncing…'], pending: ['busy', 'Saving…'], err: ['err', 'Sync problem'] };
    const [c, t] = map[s] || map.ok; b.className = 'sync ' + c; b.textContent = t; b.title = syncErr || '';
  }

  // ---------- pages ----------
  const PAGES = [
    ['overview', 'Overview'], ['cashflow', 'Cash flow'], ['sales', 'Sales'], ['team', 'Team & classes'], ['schedule', 'Schedule'],
    ['tx', 'Transactions'], ['import', 'Import'], ['settings', 'Settings'],
  ];
  let agg = null;
  function applyTheme() {
    const r = document.documentElement;
    if (ui.theme === 'light' || ui.theme === 'dark') r.dataset.theme = ui.theme; else delete r.dataset.theme;
    const dark = ui.theme === 'dark' || (ui.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.querySelectorAll('meta[name=theme-color]').forEach((m) => m.setAttribute('content', dark ? '#1B1B1B' : '#F4F0F0'));
    const ICON = {
      auto: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
      light: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>',
      dark: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>',
    };
    const b = $('#themeBtn'); if (b) { b.innerHTML = ICON[ui.theme] || ICON.auto; b.title = 'Appearance: ' + ({ auto: 'automatic', light: 'light', dark: 'dark' }[ui.theme]); }
  }
  function render() {
    applyTheme();
    if (Lock.isLocked()) { $('#nav').innerHTML = ''; $('#main').innerHTML = viewLock(); afterRender(); return; }
    agg = LL.aggregate(state, today());
    $('#nav').innerHTML = PAGES.map(([k, l]) => `<button class="tab${ui.page === k ? ' on' : ''}" data-act="page" data-v="${k}">${l}${k === 'tx' && unsorted().length ? ` <span class="dot">${unsorted().length}</span>` : ''}</button>`).join('');
    const empty = !Object.keys(state.bank).length && !Object.keys(state.sales).length;
    const views = { overview: viewOverview, cashflow: viewCashflow, sales: viewSales, team: viewTeam, schedule: viewSchedule, tx: viewTx, import: viewImport, settings: viewSettings, help: viewHelp };
    const v = empty && !['import', 'settings', 'help', 'schedule'].includes(ui.page) ? viewWelcome() : (views[ui.page] || viewOverview)();
    $('#main').innerHTML = v;
    setSyncBadge(syncErr ? 'err' : 'ok');
    afterRender();
  }
  const unsorted = () => (agg ? agg.bank.filter((t) => t._c.cat === 'uncat') : []);
  const opMonths = () => {
    const open = LL.mk(state.settings.openingDate);
    return agg.months.filter((m) => m.m >= LL.addMonths(open, 0));
  };

  function viewWelcome() {
    return `<section class="hero-empty">
      <h1>Welcome to <em>Lab Ledger</em></h1>
      <p>Your studio finances in one place: cash, sales, instructors and what's ahead. Everything stays on this device and is shared with your co-owner only through encrypted sync.</p>
      <div class="row gap">
        <button class="btn primary" data-act="page" data-v="import">Import files</button>
        <button class="btn" data-act="page" data-v="settings">Connect sync</button>
      </div>
      <p class="muted small">Already set up on another device? Connect sync in Settings and your data arrives by itself.</p>
    </section>`;
  }

  // ---------- Overview ----------
  function viewOverview() {
    const kf = LL.keyFigures(state, agg);
    const fc = kf.fc;
    const last = LL.lastFullMonths(agg, 1)[0];
    const prev = last ? agg.months.find((m) => m.m === LL.addMonths(last.m, -1)) : null;
    const runway = kf.runway;
    const runTxt = runway === Infinity ? 'Cash positive' : runway < 1 ? 'Under 1 month' : `≈ ${runway < 10 ? runway.toFixed(1).replace('.', ',') : Math.round(runway)} months`;
    const bufGap = agg.cash - kf.buffer;
    const lowPoint = fc.months.find((m) => m.end < 0);
    const attn = attention(kf);
    return `
    <div class="tiles">
      <div class="tile hero">
        <div class="label">Cash in the bank${help('Balance of the business account on the last day you have bank data for. Import the latest statement to update it.')}</div>
        <div class="big">${eur(agg.cash)}</div>
        <div class="sub">on ${dmy(agg.lastBankDate)}${agg.statementsOk ? ` · <span class="okc">✓ matches ${agg.statementCount} statements</span>` : ' · <span class="negc">check statements</span>'}</div>
      </div>
      <div class="tile">
        <div class="label">${last ? mName(last.m, true) : 'Last month'} result${help('Money in (Eversports payouts, card terminal, other income) minus running costs. Build-out, tax office and loan money are left out so you see how the studio itself is doing.')}</div>
        <div class="big ${cls(last ? last.op : 0)}">${last ? eurS(last.op) : '—'}</div>
        <div class="sub">${last ? `${eur(last.groups.in)} in · ${eur(-last.groups.out)} out` : ''}${prev && prev.tx ? ` · ${mName(prev.m)}: ${eurS(prev.op)}` : ''}</div>
      </div>
      <div class="tile">
        <div class="label">Runway${help('How long the cash lasts at the pace expected for the next months: running costs, instructor pay from the Eversports schedule, and the loan repayment, against average income.')}</div>
        <div class="big ${runway < 3 ? 'negc' : runway < 6 ? 'warnc' : ''}">${runTxt}</div>
        <div class="sub">${fc.avgNet < 0 ? `expected ${eur(fc.avgNet)} a month incl. loan` : 'income covers costs and loan'}</div>
      </div>
      <div class="tile">
        <div class="label">Safety buffer${help(`Target: ${state.settings.bufferMonths} months of running costs in the bank (change it in Settings).`)}</div>
        <div class="big ${bufGap < 0 ? 'warnc' : 'okc'}">${bufGap < 0 ? eur(bufGap) : 'Covered'}</div>
        <div class="sub">target ${eur(kf.buffer)} (${state.settings.bufferMonths} × ${eur(kf.fixed)})</div>
      </div>
    </div>

    ${attn.length ? `<div class="card attn"><h2>Needs a look</h2><ul>${attn.map((a) => `<li>${a}</li>`).join('')}</ul></div>` : ''}
    ${insightsCard(LL.insights(state, agg), true)}

    <div class="grid2">
      <div class="card">
        <h2>Money in vs running costs${help('Per month since opening. Running costs include rent, instructors, social security, fees and supplies. Build-out, VAT refunds and loan money are not included.')}</h2>
        <div class="legend"><span><i class="sw sw-in"></i>Money in</span><span><i class="sw sw-out"></i>Running costs</span></div>
        ${barsInOut(opMonths().filter((m) => m.tx > 0))}
      </div>
      <div class="card">
        <h2>Cash in the bank${help('Month-end balance from shortly before opening, then the forecast (dashed). The full history since the account was opened is under Cash flow → Whole history.')}</h2>
        ${lineCash(agg.months.filter((m) => m.m <= LL.mk(agg.lastBankDate || today()) && m.m >= LL.addMonths(LL.mk(state.settings.openingDate), -2)), fc.months)}
      </div>
    </div>

    <div class="card">
      <h2>Next months${help('Income: average of the last 3 complete months (for the current month: Eversports sales so far, projected). Instructors: classes planned in Eversports × rate, plus social security at the rate you actually paid recently. Loan: the last repayment.')}</h2>
      <div class="tablewrap"><table class="t">
        <thead><tr><th>Month</th><th class="r">In</th><th class="r">Out</th><th class="r hide-sm">Result</th><th class="r">Cash at end</th></tr></thead>
        <tbody>${fc.months.map((f) => `<tr><td class="nw">${mName(f.m)}${f.partial ? ' <span class="muted small">(partly actual)</span>' : ''}</td><td class="r">${eur(f.inc)}</td><td class="r">${eur(f.cost)}</td><td class="r hide-sm ${cls(f.net)}">${eurS(f.net)}</td><td class="r ${f.end < 0 ? 'negc b' : ''}">${eur(f.end)}</td></tr>`).join('')}</tbody>
      </table></div>
      <p class="muted small">Includes the loan repayment of ${eur(-fc.loan)} a month${fc.loan ? '' : ' (none seen yet)'} and instructor social security at ${pct(fc.ratio - 1)} on top of class pay. ${lowPoint ? `<b class="negc">At this pace the account goes below zero in ${mName(lowPoint.m, true)}.</b>` : ''}</p>
    </div>`;
  }
  function attention(kf) {
    const out = [];
    const u = unsorted();
    if (u.length) out.push(`<a data-act="page" data-v="tx" data-cat="uncat">${u.length} payment${u.length > 1 ? 's' : ''} not sorted yet</a> (e.g. ${esc(u[0].party)} ${eur(u[0].amount)})`);
    const unk = state.settings.instructors.filter((i) => !i.deleted && i.status === 'unknown');
    if (unk.length) out.push(`New in the schedule: ${unk.map((i) => esc(i.name)).join(', ')}. <a data-act="page" data-v="settings">Paid or not?</a>`);
    if (agg.lastBankDate) {
      const age = (new Date(today()) - new Date(agg.lastBankDate)) / 864e5;
      if (age > 20) out.push(`Bank data ends ${dmy(agg.lastBankDate)}. <a data-act="page" data-v="import">Import the latest statement</a>.`);
    }
    const lastSale = LL.live(state.sales).reduce((a, s) => (s.date > a ? s.date : a), '');
    if (lastSale && (new Date(today()) - new Date(lastSale)) / 864e5 > 20) out.push(`Eversports sales end ${dmy(lastSale)}. <a data-act="page" data-v="import">Import the revenue report</a>.`);
    if (!agg.statementsOk) out.push('A bank statement doesn\'t add up. Re-import it as PDF.');
    return out;
  }

  // ---------- charts (SVG, hand-made) ----------
  function chartW(full) {
    const vw = Math.min(window.innerWidth, 1180);
    if (full || window.innerWidth < 760) return Math.max(300, vw - 32 - (window.innerWidth < 520 ? 26 : 38));
    return Math.max(300, (vw - 32 - 16) / 2 - 38);
  }
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
  function kfmt(c) { const v = c / 100; return Math.abs(v) >= 1000 ? nf0.format(Math.round(v / 1000)) + 'k' : nf0.format(v); }
  function barsInOut(ms) {
    if (!ms.length) return '<p class="muted">No months yet.</p>';
    const W = chartW(), H = 230, L = 44, B = 26, T = 10;
    const max = niceMax(Math.max(...ms.map((m) => Math.max(m.groups.in, -m.groups.out))));
    const cw = (W - L - 6) / ms.length, bw = Math.min(26, (cw - 10) / 2);
    const y = (v) => T + (H - T - B) * (1 - v / max);
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = (max * i) / 4; g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
    ms.forEach((m, i) => {
      const cx = L + cw * i + cw / 2;
      const hi = y(0) - y(m.groups.in), ho = y(0) - y(-m.groups.out);
      g += `<g class="hov" data-tip="${esc(`<b>${mName(m.m, true)}</b><br>Money in ${eur(m.groups.in)}<br>Running costs ${eur(-m.groups.out)}<br>Result ${eurS(m.op)}`)}">
        <rect class="hit" x="${cx - cw / 2}" y="${T}" width="${cw}" height="${H - T - B}"/>
        ${bar(cx - bw - 1, y(0), bw, hi, 'in')}${bar(cx + 1, y(0), bw, ho, 'out')}
        <text class="ax" x="${cx}" y="${H - 8}" text-anchor="middle">${MON[+m.m.slice(5) - 1]}</text></g>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Money in and running costs per month">${g}<line class="base" x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
  }
  function bar(x, base, w, h, c) {
    if (h <= 0) return '';
    const r = Math.min(4, h, w / 2);
    return `<path class="b-${c}" d="M${x},${base} V${base - h + r} Q${x},${base - h} ${x + r},${base - h} H${x + w - r} Q${x + w},${base - h} ${x + w},${base - h + r} V${base} Z"/>`;
  }
  function lineCash(ms, fc) {
    if (!ms.length) return '<p class="muted">No bank data yet.</p>';
    const pts = ms.map((m) => ({ m: m.m, v: m.end, f: false }));
    const all = [...pts, ...fc.filter((f) => f.m > pts[pts.length - 1].m).map((f) => ({ m: f.m, v: f.end, f: true }))];
    const W = chartW(), H = 230, L = 50, B = 26, T = 10, R = 8;
    const hiV = Math.max(...all.map((p) => p.v), 1), loV = Math.min(0, ...all.map((p) => p.v));
    const stepV = niceMax((hiV - loV) / 4);
    const lo = Math.floor(loV / stepV) * stepV, maxV = Math.max(lo + stepV, Math.ceil(hiV / stepV) * stepV);
    const x = (i) => L + ((W - L - R) * i) / Math.max(1, all.length - 1);
    const y = (v) => T + (H - T - B) * (1 - (v - lo) / (maxV - lo));
    let g = '';
    for (let v = lo; v <= maxV + 1; v += stepV) { g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
    if (lo < 0) g += `<line class="zero" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
    const real = all.filter((p) => !p.f);
    g += `<path class="ln" d="${real.map((p, i) => (i ? 'L' : 'M') + x(i) + ',' + y(p.v)).join(' ')}"/>`;
    const fi = all.findIndex((p) => p.f);
    if (fi > 0) g += `<path class="ln dash" d="${all.slice(fi - 1).map((p, j) => (j ? 'L' : 'M') + x(fi - 1 + j) + ',' + y(p.v)).join(' ')}"/>`;
    const step = Math.ceil(all.length / Math.max(3, Math.floor(W / 70)));
    all.forEach((p, i) => {
      if (i % step === 0 || i === all.length - 1) g += `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${MON[+p.m.slice(5) - 1]}${p.m.slice(5) === '01' || i === 0 ? " '" + p.m.slice(2, 4) : ''}</text>`;
      const cw = (W - L - R) / Math.max(1, all.length - 1);
      g += `<g class="hov" data-tip="${esc(`<b>${mName(p.m, true)}</b><br>${p.f ? 'Forecast ' : 'Month end '}${eur(p.v)}`)}"><rect class="hit" x="${x(i) - cw / 2}" y="${T}" width="${cw}" height="${H - T - B}"/><circle class="pt${p.f ? ' f' : ''}" cx="${x(i)}" cy="${y(p.v)}" r="4"/></g>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Cash in the bank per month">${g}</svg>`;
  }
  function barsSingle(ms, val, tip) {
    if (!ms.length) return '<p class="muted">No data yet.</p>';
    const W = chartW(true), H = 220, L = 44, B = 26, T = 10;
    const max = niceMax(Math.max(...ms.map(val), 1));
    const cw = (W - L - 6) / ms.length, bw = Math.min(34, cw - 12);
    const y = (v) => T + (H - T - B) * (1 - v / max);
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = (max * i) / 4; g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
    ms.forEach((m, i) => {
      const cx = L + cw * i + cw / 2;
      g += `<g class="hov" data-tip="${esc(tip(m))}"><rect class="hit" x="${cx - cw / 2}" y="${T}" width="${cw}" height="${H - T - B}"/>${bar(cx - bw / 2, y(0), bw, y(0) - y(Math.max(0, val(m))), 'in')}<text class="ax" x="${cx}" y="${H - 8}" text-anchor="middle">${MON[+m.m.slice(5) - 1]}</text></g>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}<line class="base" x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
  }
  const help = (t) => ` <button class="q" data-act="help" data-tip="${esc(t)}" aria-label="What is this?">?</button>`;

  // ---------- Cash flow ----------
  const CAT_HELP = {
    sales: 'Money Eversports (via Stripe) pays into the bank, usually once a week. Eversports bills its own fee separately.',
    terminal: 'Card payments taken in the studio with the SumUp reader.',
    other_in: 'Anything else coming in that isn\'t a sale, a loan or a tax refund (e.g. a supplier refund).',
    rent: 'Monthly rent incl. service charges and VAT.',
    instructors: 'Pay that reaches the instructors (net pay or their invoices).',
    payroll: 'Social security (ÖGK), payroll tax and municipal tax on instructor pay.',
    platform: 'The monthly Eversports invoice.',
    utilities: 'Electricity and similar.', insurance: 'Studio insurance policies.',
    software: 'Google Workspace, website hosting, Canva and other tools.',
    marketing: 'Ads (Instagram/Facebook), flyers, printing.',
    accounting: 'Tax advisor, notary, court fees.', bank: 'Account fees, card fees, interest.',
    loan_fees: 'Fees for the bank loan guarantee.', supplies: 'Things for the studio after opening: cleaning, decoration, small equipment.',
    license: 'The yearly Lagree licence fee.', memberships: 'Chamber of commerce (WKO) and similar fees.', travel: 'Train, hotel and travel costs.',
    other_out: 'Costs that fit nowhere else.', uncat: 'Payments the app couldn\'t sort. Pick a category in Transactions.',
    setup: 'One-off costs to build the studio: equipment, construction, design. Not part of the running result.',
    certification: 'Lagree certification and training. One-off, not part of the running result.',
    vat: 'VAT refunds from (or payments to) the tax office.',
    owner: 'Money you and your co-owner put in (capital, shareholder loans, deposits).',
    bank_loan: 'Money drawn from the bank loan.', loan_repay: 'Monthly loan repayment to the bank.', deposit: 'The security deposit for the loan.',
  };
  function viewCashflow() {
    const lastBank = LL.mk(agg.lastBankDate || today());
    const fcAll = LL.forecast(state, agg).months;
    const partialM = fcAll[0] && fcAll[0].partial ? fcAll[0].m : null;
    let ms = agg.months.filter((m) => m.m <= lastBank && m.m !== partialM);
    if (!ui.cfAll) ms = ms.filter((m) => m.m >= LL.addMonths(LL.mk(state.settings.openingDate), -1));
    const cols = [
      ...ms.map((m) => ({ m: m.m, cats: m.cats, groups: m.groups, op: m.op, net: m.net, end: m.end, fc: false })),
      ...fcAll.map((f) => ({ m: f.m, cats: f.cats, groups: f.groups, op: f.op, net: f.net, end: f.end, fc: true, partial: f.partial })),
    ];
    const act = cols.filter((c) => !c.fc);
    const catsBy = (grp) => Object.keys(CATS).filter((k) => CATS[k].group === grp && cols.some((m) => Math.round(m.cats[k] || 0)));
    const cell = (c, k) => { const v = Math.round(c.cats[k] || 0); return `<td class="r ${cls(v)}${c.fc ? ' fc' : ''}">${v ? (c.fc ? eur(v) : `<a data-act="drill" data-m="${c.m}" data-cat="${k}">${eur(v)}</a>`) : '<span class="muted">·</span>'}</td>`; };
    const tot = (f) => act.reduce((a, c) => a + f(c), 0);
    const rows = (grp) => catsBy(grp).map((k) => `<tr><th class="rl">${CATS[k].label}${help(CAT_HELP[k] || '')}</th>${cols.map((c) => cell(c, k)).join('')}<td class="r tot ${cls(tot((c) => c.cats[k] || 0))}">${eur(tot((c) => c.cats[k] || 0))}</td></tr>`).join('');
    const sum = (label, f, cl = '') => `<tr class="sum ${cl}"><th class="rl">${label}</th>${cols.map((c) => `<td class="r ${cls(f(c))}${c.fc ? ' fc' : ''}">${eur(f(c))}</td>`).join('')}<td class="r tot ${cls(tot(f))}">${eur(tot(f))}</td></tr>`;
    const head = (t) => `<tr class="gh"><th class="rl" colspan="${cols.length + 2}">${t}</th></tr>`;
    return `<div class="card">
      <div class="row between wrap"><h2>Cash flow by month${help('Every euro that moved on the business account, sorted. Tap an amount to see the payments behind it. The shaded columns on the right are the forecast for the next 3 months.')}</h2>
      <div class="seg"><button class="${!ui.cfAll ? 'on' : ''}" data-act="cfAll" data-v="0">Since opening</button><button class="${ui.cfAll ? 'on' : ''}" data-act="cfAll" data-v="1">Whole history</button></div></div>
      <div class="tablewrap sticky"><table class="t cf">
        <thead><tr><th class="rl"></th>${cols.map((c) => `<th class="r${c.fc ? ' fc' : ''}">${mName(c.m)}${c.fc ? `<div class="fct">${c.partial ? 'actual + forecast' : 'forecast'}</div>` : ''}</th>`).join('')}<th class="r">Total<div class="fct">so far</div></th></tr></thead>
        <tbody>
          ${head('Money in')}${rows('in')}${sum('Total money in', (c) => c.groups.in)}
          ${head('Running costs')}${rows('out')}${sum('Total running costs', (c) => c.groups.out)}
          ${sum('Operating result', (c) => c.op, 'strong')}
          ${catsBy('setup').length ? head('One-off') + rows('setup') : ''}
          ${catsBy('tax').length ? head('Tax office') + rows('tax') : ''}
          ${catsBy('fin').length ? head('Financing') + rows('fin') : ''}
          ${sum('Net change', (c) => c.net, 'strong')}
          <tr class="sum strong"><th class="rl">Cash at month end</th>${cols.map((c) => `<td class="r${c.fc ? ' fc' : ''} ${c.end < 0 ? 'neg' : ''}">${eur(c.end)}</td>`).join('')}<td></td></tr>
        </tbody></table></div>
      <p class="muted small">Actual months up to ${dmy(agg.lastBankDate)}, the last day with bank data. Forecast: average of the last 3 complete months; instructor pay from the planned classes (Eversports or the Schedule page); loan repayment as last paid.</p>
    </div>`;
  }

  // ---------- Sales ----------
  function viewSales() {
    const ms = agg.months.filter((m) => m.sales.gross || m.sales.count || m.vouchers.count);
    const conv = LL.trialConversion(state);
    const groups = LL.PRODUCT_GROUPS.filter((g) => ms.some((m) => m.sales.byGroup[g]));
    const v = (o) => (o ? (ui.salesNet ? o.net : o.gross) : 0);
    const last = ms.filter((m) => m.m < LL.mk(today())).slice(-1)[0];
    const totalNow = ms.find((m) => m.m === LL.mk(today()));
    return `<div class="tiles">
        <div class="tile"><div class="label">${last ? mName(last.m, true) : ''} sales</div><div class="big">${last ? eur(v(last.sales)) : '—'}</div><div class="sub">${ui.salesNet ? 'net of VAT' : 'incl. VAT'}</div></div>
        <div class="tile"><div class="label">${mName(LL.mk(today()), true)} so far</div><div class="big">${totalNow ? eur(v(totalNow.sales)) : '—'}</div><div class="sub">until ${dmy(LL.live(state.sales).reduce((a, s) => (s.date > a ? s.date : a), ''))}</div></div>
        <div class="tile"><div class="label">Trial → bought more${help('Of the people whose first purchase was a trial class in that month, how many bought something else afterwards (drop-in, pack, membership…). Recent months look lower because people haven\'t had time yet.')}</div><div class="big">${last && conv[last.m] ? pct(conv[last.m].converted / conv[last.m].trials) : '—'}</div><div class="sub">${last && conv[last.m] ? `${conv[last.m].converted} of ${conv[last.m].trials} trial buyers in ${mName(last.m)}` : ''}</div></div>
      </div>
      ${insightsCard(LL.insights(state, agg))}
      <div class="card">
        <div class="row between wrap"><h2>Sales per month${help('From the Eversports revenue report plus gift voucher sales. Payments made with a studio gift voucher are left out, because the voucher sale already counted.')}</h2>
        <div class="seg"><button class="${!ui.salesNet ? 'on' : ''}" data-act="salesNet" data-v="0">Incl. VAT</button><button class="${ui.salesNet ? 'on' : ''}" data-act="salesNet" data-v="1">Net of VAT</button></div></div>
        ${barsSingle(ms, (m) => v(m.sales), (m) => `<b>${mName(m.m, true)}</b><br>Sales ${eur(v(m.sales))}`)}
        <div class="tablewrap sticky"><table class="t cf">
          <thead><tr><th class="rl"></th>${ms.map((m) => `<th class="r">${mName(m.m)}</th>`).join('')}</tr></thead>
          <tbody>
          ${groups.map((g) => `<tr><th class="rl">${g}</th>${ms.map((m) => { const o = m.sales.byGroup[g]; return `<td class="r">${o ? eur(v(o)) + `<div class="muted small">${o.count}×</div>` : '<span class="muted">·</span>'}</td>`; }).join('')}</tr>`).join('')}
          <tr class="sum strong"><th class="rl">Total sales</th>${ms.map((m) => `<td class="r">${eur(v(m.sales))}</td>`).join('')}</tr>
          <tr><th class="rl">of which refunds</th>${ms.map((m) => `<td class="r ${cls(m.sales.refunds)}">${m.sales.refunds ? eur(m.sales.refunds) : '<span class="muted">·</span>'}</td>`).join('')}</tr>
          <tr><th class="rl">Paid with gift voucher${help('Classes paid with a studio voucher. Not new money: shown for information.')}</th>${ms.map((m) => `<td class="r muted">${m.sales.voucherRedeemed ? eur(m.sales.voucherRedeemed) : '·'}</td>`).join('')}</tr>
          <tr class="gh"><th class="rl" colspan="${ms.length + 1}">Compared with the bank</th></tr>
          <tr><th class="rl">Eversports payouts${help('What Stripe/Eversports actually paid into the bank that month. It differs from sales by timing (payouts run weekly) and by in-studio card payments, which arrive through SumUp.')}</th>${ms.map((m) => `<td class="r">${m.cats.sales ? eur(m.cats.sales) : '<span class="muted">·</span>'}</td>`).join('')}</tr>
          <tr><th class="rl">Card terminal (SumUp)</th>${ms.map((m) => `<td class="r">${m.cats.terminal ? eur(m.cats.terminal) : '<span class="muted">·</span>'}</td>`).join('')}</tr>
          <tr><th class="rl">Eversports fees</th>${ms.map((m) => `<td class="r ${cls(m.cats.platform || 0)}">${m.cats.platform ? eur(m.cats.platform) : '<span class="muted">·</span>'}</td>`).join('')}</tr>
          <tr><th class="rl">Fees as % of sales</th>${ms.map((m) => `<td class="r muted">${m.cats.platform && m.sales.gross ? pct(-m.cats.platform / m.sales.gross) : '·'}</td>`).join('')}</tr>
          <tr class="gh"><th class="rl" colspan="${ms.length + 1}">Trial classes</th></tr>
          <tr><th class="rl">New trial buyers</th>${ms.map((m) => `<td class="r">${conv[m.m] ? conv[m.m].trials : '·'}</td>`).join('')}</tr>
          <tr><th class="rl">… who bought more</th>${ms.map((m) => `<td class="r">${conv[m.m] ? `${conv[m.m].converted} <span class="muted small">(${pct(conv[m.m].converted / conv[m.m].trials)})</span>` : '·'}</td>`).join('')}</tr>
          </tbody></table></div>
      </div>`;
  }

  function insightsCard(list, short) {
    if (!list.length) return '';
    const items = short ? list.filter((x) => x.tone === 'bad').slice(0, 2) : list;
    if (!items.length) return '';
    const icon = { bad: '↓', good: '↑', info: '→' };
    return `<div class="card ideas"><div class="row between"><h2>What to work on${help('Suggestions from your own numbers: sales pace, trial follow-up, product mix and how full each class time is. They update every time you import.')}</h2>${short ? '<a data-act="page" data-v="sales">All ideas</a>' : ''}</div>
      <ul class="idea-list">${items.map((x) => `<li class="idea ${x.tone}"><span class="ic">${icon[x.tone]}</span><div><b>${esc(x.title)}</b><p>${esc(x.text)}</p></div></li>`).join('')}</ul></div>`;
  }

  // ---------- Team & classes ----------
  function viewTeam() {
    const ins = state.settings.instructors.filter((i) => !i.deleted);
    const byId = Object.fromEntries(ins.map((i) => [i.id, i]));
    const cm = agg.months.filter((m) => m.classes.taught || m.classes.planned || m.ins.expected || m.ins.paidNet);
    if (!cm.length) return `<div class="card"><h2>Team & classes</h2><p class="muted">Import the Eversports “Activity overview of all appointments” to see classes and instructor pay.</p></div>`;
    const cur = LL.mk(today());
    if (!ui.teamMonth || !cm.find((m) => m.m === ui.teamMonth)) ui.teamMonth = cm.filter((m) => m.m <= cur).slice(-1)[0]?.m || cm[0].m;
    const M = agg.byMonth[ui.teamMonth];
    const ratio = LL.onCostRatio(agg);
    const ids = new Set([...Object.keys(M.classes.byIns), ...Object.keys(M.ins.byIns)]);
    const rows = [...ids].map((id) => {
      const i = byId[id]; const c = M.classes.byIns[id] || { classes: 0, attendees: 0, capacity: 0 }; const p = M.ins.byIns[id] || { classes: 0, expected: 0, paid: 0 };
      const st = i ? (LL.paidIn(i, M.m) ? 'paid' : i.status === 'paid' ? 'unpaid' : i.status) : 'unknown';
      return { id, name: i ? i.name : id.replace(/^x/, ''), status: st, classes: Math.max(c.classes + (c.planned || 0), p.classes), taught: c.classes, att: c.attendees, cap: c.capacity, expected: p.expected, paid: p.paid };
    }).sort((a, b) => (a.status === 'paid') === (b.status === 'paid') ? b.classes - a.classes : a.status === 'paid' ? -1 : 1);
    const stLabel = { paid: 'paid', unpaid: 'unpaid', unknown: 'not set', excluded: '' };
    // one bar per instructor: length = classes, colour = how full their classes were
    const bars = rows.filter((r) => r.classes > 0).sort((a, b) => b.classes - a.classes);
    const totalC = bars.reduce((a, r) => a + r.classes, 0) || 1, maxC = bars[0] ? bars[0].classes : 1;
    const step = (f) => (f < 0.2 ? 1 : f < 0.35 ? 2 : f < 0.5 ? 3 : f < 0.65 ? 4 : 5);
    const barsHtml = `<div class="ibars">${bars.map((r) => { const f = r.cap ? r.att / r.cap : null; return `<div class="ibar hov" data-tip="${esc(`<b>${esc(r.name)}</b><br>${r.classes} classes (${pct(r.classes / totalC)} of all)${r.taught < r.classes ? `<br>${r.classes - r.taught} still planned` : ''}${f !== null ? `<br>${pct(f)} full, ${nf2.format(r.att / r.taught)} guests per class` : ''}`)}"><span class="iname">${esc(r.name)}</span><span class="itrack"><span class="ifill ${f === null ? 'seq0' : 'seq' + step(f)}" style="width:${Math.max(3, (r.classes / maxC) * 100)}%"></span></span><span class="ival"><b>${r.classes}</b> <span class="muted">${pct(r.classes / totalC)}</span>${f !== null ? ` · ${pct(f)} full` : ' · planned'}</span></div>`; }).join('')}</div>
      <div class="seqlegend"><span class="muted small">How full:</span>${['under 20%', '20–35%', '35–50%', '50–65%', '65%+'].map((l, i) => `<span><i class="sw seq${i + 1}"></i>${l}</span>`).join('')}<span><i class="sw seq0"></i>planned</span></div>`;
    const fut = M.m > cur || (M.m === cur && M.classes.planned);
    return `<div class="card">
      <div class="row between wrap"><h2>Instructors${help('Classes from the Eversports activity export. Expected pay = classes × rate (Settings). Paid = what left the bank for that month (payroll is paid early the following month).')}</h2>
        <div class="chips">${cm.map((m) => `<button class="chip${m.m === ui.teamMonth ? ' on' : ''}" data-act="teamMonth" data-v="${m.m}">${mName(m.m)}${m.m > cur ? ' · plan' : ''}</button>`).join('')}</div></div>
      ${barsHtml}
      <div class="tablewrap mt"><table class="t">
        <thead><tr><th>Instructor</th><th class="r">Classes</th><th class="r">Avg. guests</th><th class="r">Full</th><th class="r">Expected pay</th><th class="r">Paid (bank)</th></tr></thead>
        <tbody>${rows.map((r) => `<tr class="${r.status !== 'paid' ? 'dim' : ''}"><td>${esc(r.name)} ${r.status !== 'paid' ? `<span class="tag">${stLabel[r.status] || ''}</span>` : ''}</td><td class="r">${r.classes}${r.taught < r.classes ? ` <span class="muted small">(${r.classes - r.taught} planned)</span>` : ''}</td><td class="r">${r.taught ? nf2.format(r.att / r.taught).replace(/,0+$/, '') : '·'}</td><td class="r">${r.cap ? pct(r.att / r.cap) : '·'}</td><td class="r">${r.status === 'paid' ? eur(r.expected) : '·'}</td><td class="r">${r.paid ? eur(r.paid, true) : '<span class="muted">·</span>'}</td></tr>`).join('')}</tbody>
        <tfoot><tr class="sum"><th>Total</th><th class="r">${M.classes.taught + M.classes.planned}</th><th class="r">${M.classes.taught ? nf2.format(M.classes.attendees / M.classes.taught) : '·'}</th><th class="r">${M.classes.capacity ? pct(M.classes.attendees / M.classes.capacity) : '·'}</th><th class="r">${eur(M.ins.expected)}</th><th class="r">${M.ins.paidNet ? eur(M.ins.paidNet, true) : '·'}</th></tr>
        <tr><td colspan="5">Social security & payroll tax for ${mName(M.m)}</td><td class="r">${M.ins.payroll ? eur(M.ins.payroll, true) : fut || !M.ins.paidNet ? `<span class="muted">≈ ${eur(M.ins.expected * (ratio - 1))}</span>` : '·'}</td></tr>
        <tr class="sum strong"><td colspan="4">Instructor cost${fut || !M.ins.paidNet ? ' (expected)' : ''}</td><td class="r">${eur(M.ins.expected * ratio)}</td><td class="r">${M.ins.paidNet ? eur(M.ins.paidNet + M.ins.payroll) : '·'}</td></tr></tfoot>
      </table></div>
      <p class="muted small">“Paid” is net pay; payroll tax and social security come on top (recently ${pct(ratio - 1)} of class pay). ${M.m >= LL.addMonths(LL.mk(agg.lastBankDate || today()), 0) ? `Pay for ${mName(M.m)} shows once the bank statement for ${mName(LL.addMonths(M.m, 1))} is imported.` : ''}</p>
    </div>
    <div class="card">
      <h2>Classes per month</h2>
      <div class="tablewrap"><table class="t">
        <thead><tr><th>Month</th><th class="r">Classes</th><th class="r">by paid team</th><th class="r">Guests</th><th class="r">Avg. per class</th><th class="r">Full</th><th class="r">Instructor cost</th><th class="r">Cost per guest</th></tr></thead>
        <tbody>${cm.map((m) => { const cost = m.ins.paidNet ? m.ins.paidNet + m.ins.payroll : m.ins.expected * ratio; const est = !m.ins.paidNet; return `<tr><td>${mName(m.m, true)}</td><td class="r">${m.classes.taught}${m.classes.planned ? ` <span class="muted small">+${m.classes.planned} planned</span>` : ''}</td><td class="r">${m.classes.paidTaught}</td><td class="r">${m.classes.attendees || '·'}</td><td class="r">${m.classes.taught ? nf2.format(m.classes.attendees / m.classes.taught) : '·'}</td><td class="r">${m.classes.capacity ? pct(m.classes.attendees / m.classes.capacity) : '·'}</td><td class="r">${est ? '≈ ' : ''}${eur(cost)}</td><td class="r">${m.classes.attendees && !m.classes.planned ? (est ? '≈ ' : '') + eur(cost / m.classes.attendees, true) : '·'}</td></tr>`; }).join('')}</tbody>
      </table></div>
    </div>`;
  }

  // ---------- Transactions ----------
  function viewTx() {
    const months = [...new Set(agg.bank.map((t) => LL.mk(t.date)))].sort().reverse();
    const q = (ui.txQ || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    let list = agg.bank.slice().reverse();
    if (ui.txMonth) list = list.filter((t) => LL.mk(t.date) === ui.txMonth);
    if (ui.txCat) list = list.filter((t) => t._c.cat === ui.txCat);
    if (q) list = list.filter((t) => (t.party + ' ' + t.text + ' ' + (CATS[t._c.cat] || {}).label).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q));
    const total = list.reduce((a, t) => a + t.amount, 0);
    const paid = state.settings.instructors.filter((i) => !i.deleted && i.status === 'paid');
    const opts = (sel) => Object.entries(GROUPS).map(([g, gl]) => `<optgroup label="${gl}">${Object.entries(CATS).filter(([, c]) => c.group === g).map(([k, c]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${c.label}</option>`).join('')}</optgroup>`).join('');
    const shown = list.slice(0, 400);
    return `<div class="card">
      <div class="filters">
        <div class="search"><input id="txQ" type="search" placeholder="Search name, reference, category" value="${esc(ui.txQ)}"><button class="x" data-act="txClear" aria-label="Clear">×</button></div>
        <select data-act="txMonth"><option value="">All months</option>${months.map((m) => `<option value="${m}"${m === ui.txMonth ? ' selected' : ''}>${mName(m, true)}</option>`).join('')}</select>
        <select data-act="txCat"><option value="">All categories</option>${opts(ui.txCat)}</select>
      </div>

  async function importFiles(files) {
    const res = [];
    for (const f of files) {
      try {
        const r = await importOne(f);
        res.push(`<li><b>${esc(f.name)}</b>: ${r}</li>`);
        state.importLog = [{ id: LL.hash(f.name + Date.now()), at: Date.now(), file: f.name, what: r.replace(/<[^>]+>/g, '') }, ...(state.importLog || [])].slice(0, 60);
      } catch (e) { res.push(`<li class="negc"><b>${esc(f.name)}</b>: ${esc(e.message)}</li>`); }
    }
    save(); render();
    const box = $('#importResult'); if (box) box.innerHTML = `<ul class="result">${res.join('')}</ul>`;
  }
  async function importOne(f) {
    const name = f.name.toLowerCase();
    if (name.endsWith('.pdf')) {
      const pages = await readPdf(f);
      const { statements, tx } = LLParse.parseStatementPages(pages);
      if (!statements.length) throw new Error('This PDF doesn\'t look like an Erste / Sparkasse account statement.');
      const r = LL.importBank(state, tx, statements, f.name);
      return `${r.statements} statement${r.statements > 1 ? 's' : ''} (${r.stBad.length ? `<span class="negc">${r.stBad.join(', ')} don't add up</span>` : '<span class="okc">all add up</span>'}), ${r.added} new payments${r.skipped ? `, ${r.skipped} already there` : ''}`;
    }
    const text = await f.text();
    if (name.endsWith('.json')) {
      const j = JSON.parse(text);
      if (j && j.kind === 'patch') { const r = LL.applyPatch(state, j); return r === 'already' ? 'this update was already applied' : `update applied: ${esc(j.note || j.id)}`; }
      if (j && j.schema && j.settings && j.bank) { state = LL.migrate(Sync.merge(state, Object.assign({}, j, { settings: Object.assign({}, j.settings, { updatedAt: Math.max(j.settings.updatedAt || 0, (state.settings.updatedAt || 0) + 1) }) }))); return 'backup restored and merged'; }
      const arr = Array.isArray(j) ? j : j.transactions || j.collection || j.items || [];
      const tx = LLParse.parseGeorgeJSON(arr);
      if (!tx.length) throw new Error('No bank payments found in this JSON.');
      const r = LL.importBank(state, tx, [], f.name);
      return `${r.added} new payments, ${r.skipped} already there`;
    }
    const rows = LLParse.parseCSV(text);
    const kind = LLParse.detectCSV(rows);
    if (kind === 'sales') { const r = LL.importSales(state, LLParse.parseSales(rows), f.name); return `Eversports sales: ${r.added} new, ${r.skipped} already there`; }
    if (kind === 'vouchers') { const r = LL.importVouchers(state, LLParse.parseVouchers(rows), f.name); return `gift vouchers: ${r.added} new, ${r.skipped} already there`; }
    if (kind === 'classes') { const r = LL.importClasses(state, LLParse.parseClasses(rows), f.name); return `${r.added} classes from ${dmy(r.from)} to ${dmy(r.to)}${r.replaced ? ' (replaced the earlier export for these dates)' : ''}`; }
    if (kind === 'availability') {
      const m = ui.schedMonth || LL.addMonths(LL.mk(today()), 1);
      const r = LLS.importAvailability(state, rows, m);
      return `availability for ${mName(m, true)}: ${r.added} answers${r.created.length ? ` (new names: ${r.created.map(esc).join(', ')}. Set them up in Settings)` : ''}`;
    }
    if (kind === 'georgecsv') { const r = LL.importBank(state, LLParse.parseGeorgeCSV(rows), [], f.name); return `${r.added} new payments, ${r.skipped} already there`; }
    throw new Error('File type not recognised. Expected an Erste statement PDF, a George export, or an Eversports revenue, voucher or activity export.');
  }
  // pdf.js is loaded only when a PDF is imported, from jsDelivr, checked against its published fingerprint
  const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
  const SRI = { lib: 'sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e', worker: 'sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2' };
  let pdfReady;
  function loadPdfJs() {
    if (pdfReady) return pdfReady;
    pdfReady = new Promise((ok, fail) => {
      const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js'; s.integrity = SRI.lib; s.crossOrigin = 'anonymous';
      s.onload = async () => {
        try {
          const w = await fetch(PDFJS + 'pdf.worker.min.js', { integrity: SRI.worker });
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([await w.text()], { type: 'text/javascript' }));
          ok(window.pdfjsLib);
        } catch (e) { fail(new Error('Could not load the PDF reader. Check the internet connection.')); }
      };
      s.onerror = () => { pdfReady = null; fail(new Error('Could not load the PDF reader. Check the internet connection.')); };
      document.head.appendChild(s);
    });
    return pdfReady;
  }
  async function readPdf(f) {
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
    const pages = [];
    for (let p = 1; p <= doc.numPages; p++) { const tc = await (await doc.getPage(p)).getTextContent(); pages.push(tc.items.map((i) => ({ str: i.str, x: i.transform[4], y: i.transform[5], w: i.width }))); }
    return pages;
  }

  const insName = (id) => { const i = state.settings.instructors.find((x) => x.id === id); return i ? i.name : ''; };

    const teachCache = {};

      opts.push(`<optgroup label="Not available / other class">${rest.map((i) => `<option value="${i.id}"${c.ins === i.id ? ' selected' : ''}>${esc(i.name)}</option>`).join('')}</optgroup>`);

      return `<div class="tablewrap"><table class="t sgrid"><thead><tr><th></th>${all7.map((d) => `<th class="${w.days[d] ? '' : 'out'}">${dShort(d)}</th>`).join('')}</tr></thead><tbody>${times.map((t) => `<tr><th class="st">${t}</th>${all7.map((d) => `<td class="${w.days[d] ? '' : 'out'}">${(w.days[d] || []).filter((e) => e.slot.start === t).map((e) => `<div class="scell"><span class="sn">${esc(e.slot.title)}</span>${sel(e, d)}</div>`).join('')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    };
    return `<div class="card">
      <div class="row between wrap"><h2>Schedule${help('1) Instructors fill in the Google Form. 2) Import their answers. 3) Make a proposal: unpaid instructors first, then whoever usually has the slot, spread fairly, within each person\'s max per week. 4) Change anything by tapping. 5) Export for the team. Classes still have to be created in Eversports by hand.')}</h2>${chips}</div>
      <div class="steps3">

  function latestWeek() {

          <label><span>€ / class</span><input class="in num" inputmode="decimal" value="${i.rate ? nf2.format(i.rate / 100) : ''}" data-act="insSet" data-id="${i.id}" data-f="rate" ${i.status !== 'paid' ? 'disabled' : ''}></label>
          <label><span>Paid from</span><input class="in" type="month" value="${i.paidFrom || ''}" data-act="insSet" data-id="${i.id}" data-f="paidFrom" ${i.status !== 'paid' ? 'disabled' : ''}></label>
          <label class="f-bank"><span>Bank name</span><input class="in" value="${esc((i.bankNames || []).join(', '))}" data-act="insSet" data-id="${i.id}" data-f="bankNames" placeholder="as on the statement" ${i.status !== 'paid' ? 'disabled' : ''}></label>
          <label class="f-act"><span>Active</span><input type="checkbox" ${i.active !== false ? 'checked' : ''} data-act="insSet" data-id="${i.id}" data-f="active"></label>
          ${titles.length ? `<div class="f-teach"><span>Teaches ${t.length ? '' : '<em>(automatic, from past classes)</em>'}</span><div class="tchips">${titles.map((x) => { const on = t.length ? t.includes(x) : (derived.length ? derived.includes(x) : /lagree burn/i.test(x)); return `<button class="tchip${on ? ' on' : ''}${t.length ? '' : ' auto'}" data-act="teachToggle" data-id="${i.id}" data-v="${esc(x)}">${esc(x)}</button>`; }).join('')}</div></div>` : ''}
          <button class="x" data-act="delIns" data-v="${i.id}" aria-label="Remove ${esc(i.name)}">×</button>
        </div>`; }).join('') || '<p class="muted">No instructors yet. Import the Eversports activity export or add one.</p>'}</div>
    </div>
    <div class="grid2">
      <div class="card">
        <h2>Sync with your co-owner${help('Both of you connect with the same token, Sync ID and passphrase. Your data is encrypted on the device before it reaches GitHub; without the passphrase nobody can read it, GitHub included.')}</h2>
        ${c ? `<p><span class="okc">● Connected.</span> ${Sync.cfg().last ? 'Last sync ' + new Date(Sync.cfg().last).toLocaleString('de-AT') : ''}</p>
          <label class="fld">Sync ID<div class="row gap"><input class="in mono" readonly value="${esc(c.gistId)}" id="sid"><button class="btn sm" data-act="copy" data-v="${esc(c.gistId)}">Copy</button></div></label>
          ${syncErr ? `<p class="negc small">${esc(syncErr)}</p>` : ''}
          <div class="row gap wrap"><button class="btn" data-act="syncNow">Sync now</button><button class="btn" data-act="showToken">Show token</button><button class="btn ghost" data-act="disconnect">Disconnect this device</button></div>`
        : `<p class="muted small">First device: paste the token, choose a passphrase, leave Sync ID empty → <b>Create sync file</b>. Every other device: same token, the Sync ID and the passphrase → <b>Connect</b>.</p>
          <label class="fld">GitHub token<input class="in mono" id="sTok" type="password" autocomplete="off" placeholder="ghp_…"></label>
          <label class="fld">Passphrase<input class="in" id="sPass" type="password" autocomplete="new-password" placeholder="at least 10 characters"></label>
          <label class="fld">Sync ID <span class="muted small">(empty on the first device)</span><input class="in mono" id="sId" autocomplete="off"></label>
          <p id="sErr" class="negc small"></p>
          <div class="row gap"><button class="btn primary" data-act="syncCreate">Create sync file</button><button class="btn" data-act="syncConnect">Connect</button></div>`}
        <h2 class="mt">App lock${help('Asks for Face ID / Touch ID (or your PIN) every time you open the app, and after 2 minutes away. Set it up on each device.')}</h2>
        ${Lock.on() ? `<p><span class="okc">● On</span> · ${Lock.hasBio() ? 'Face ID / Touch ID + PIN' : 'PIN only'}</p><div class="row gap wrap"><input class="in pin" id="lockOffPin" type="password" inputmode="numeric" placeholder="PIN" aria-label="PIN"><button class="btn ghost" data-act="lockOff">Turn off</button></div><p id="lockSetErr" class="negc small"></p>`
        : `<div class="row gap wrap"><input class="in pin" id="lockPin1" type="password" inputmode="numeric" autocomplete="new-password" placeholder="New PIN (4–8 digits)" aria-label="New PIN"><input class="in pin" id="lockPin2" type="password" inputmode="numeric" autocomplete="new-password" placeholder="Repeat PIN" aria-label="Repeat PIN"></div>
          <label class="chk" id="bioRow" hidden><input type="checkbox" id="lockBio" checked> Also use Face ID / Touch ID</label>
          <p id="lockSetErr" class="negc small"></p><button class="btn primary" data-act="lockOn">Turn on app lock</button>`}
      </div>
      <div class="card">
        <h2>General</h2>
        <label class="fld">Opening day<input class="in" type="date" value="${state.settings.openingDate}" data-act="setSetting" data-f="openingDate"></label>
        <label class="fld">Safety buffer (months of running costs)<input class="in num" inputmode="numeric" value="${state.settings.bufferMonths}" data-act="setSetting" data-f="bufferMonths"></label>
        <label class="fld">Name on exported schedules<input class="in" value="${esc(state.settings.studioName || '')}" data-act="setSetting" data-f="studioName" placeholder="Studio name"></label>
        <h2 class="mt">Backup</h2>
        <p class="muted small">A backup file is <b>not encrypted</b>. Keep it somewhere private. With sync on, the encrypted copy on GitHub is your everyday backup.</p>
        <div class="row gap wrap"><button class="btn" data-act="backup">Download backup</button><label class="btn">Restore from backup<input type="file" accept=".json" id="restore" hidden></label></div>
        <h2 class="mt">Rules you've made</h2>
        ${(state.settings.rules || []).filter((r) => !r.deleted).length ? `<ul class="rules">${state.settings.rules.map((r, ix) => r.deleted ? '' : `<li><code>${esc(r.m)}</code> → ${CATS[r.c] ? CATS[r.c].label : r.c} <button class="x" data-act="delRule" data-v="${ix}" aria-label="Delete rule">×</button></li>`).join('')}</ul>` : '<p class="muted small">None yet. When you change a category in Transactions you can make it a rule.</p>'}
        <p class="muted small mt">Lab Ledger ${LL.APP_VERSION}. <a data-act="erase">Erase data on this device</a></p>
      </div>
    </div>`;
  }

  // ---------- Help ----------
  function viewHelp() {
    const sec = (id, title, body, open) => `<details class="card help" id="h-${id}"${open ? ' open' : ''}><summary><h2>${title}</h2></summary><div class="hb">${body}</div></details>`;
    return `<div class="card"><h1 class="ht">How Lab Ledger works</h1><p>Lab Ledger shows how the studio is doing: money in the bank, what came in and went out each month, sales, instructors and the next three months. You don't type numbers in. You drop in a few files once a month and the app does the rest. Tap any <span class="q static">?</span> in the app for a short explanation.</p></div>
    ${sec('month', 'Every month (5 minutes)', `<ol class="steps">
      <li><b>Bank:</b> in George Business open the account → <i>Kontoauszüge</i> → download the PDF of last month.</li>
      <li><b>Eversports sales:</b> Financials → Reports → <i>Revenue report (based on income & expenses)</i> for last month.</li>
      <li><b>Gift vouchers:</b> Financials → Reports → <i>Voucher sales report</i>, same month.</li>
      <li><b>Classes:</b> Activities → Export activity & booking data → <i>Activity overview of all appointments</i>. Take last month and next month.</li>
      <li>Open <b>Import</b> and drop all four files in at once. Anything already there is skipped.</li>
      <li>Look at <b>Overview → Needs a look</b> and sort anything new.</li></ol>`, true)}
    ${sec('pages', 'What each page shows', `<p><b>Overview:</b> cash in the bank, last month's result, how long the cash lasts, and the next 3 months.</p>
      <p><b>Cash flow:</b> every month by category, like your spreadsheet. The shaded columns on the right are the forecast. Tap an amount to see the payments behind it.</p>
      <p><b>Sales:</b> what you sold by product, how many trial clients come back, and <i>What to work on</i>: ideas from your numbers.</p>
      <p><b>Team & classes:</b> classes per instructor, how full they were, expected pay vs what was paid.</p>
      <p><b>Schedule:</b> plan next month's classes from the team's availability.</p>
      <p><b>Transactions:</b> every bank payment. Change a category if it's wrong.</p>`)}
    ${sec('result', 'Result, runway, buffer: what they mean', `<p><b>Result</b> = money in from classes minus running costs (rent, instructors, fees…). One-off build-out, certification, VAT refunds and loan money are left out, so you see how the studio itself is doing.</p>
      <p><b>Runway</b> = how many months the cash lasts at the expected pace, loan repayment included.</p>
      <p><b>Safety buffer</b> = the cash you'd like to keep (3 months of running costs) compared with what's in the bank.</p>
      <p><b>Forecast</b> = the average of the last 3 complete months, with instructor pay from the planned classes.</p>`)}
    ${sec('categories', 'Categories explained', `<table class="t"><tbody>${Object.entries(CATS).map(([k, c]) => `<tr><td><b>${c.label}</b></td><td>${esc(CAT_HELP[k] || '')}</td></tr>`).join('')}</tbody></table>
      <p class="muted small mt">To change a payment: Transactions → choose another category → tap “Always sort … as …” so it happens automatically next time.</p>`)}
    ${sec('schedule', 'Schedule: how it works', `<ol class="steps">
      <li><b>Once:</b> make a Google Form (forms.google.com → Blank) with these questions:
        <ul><li><i>Your name</i> (Dropdown with the instructors' names)</li>
        <li><i>Month</i> (Dropdown, e.g. November 2026, December 2026)</li>
        <li><i>When can you teach?</i>: <b>Checkbox grid</b>. Rows: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. Columns: <code>Early 6:30-8:30</code>, <code>Morning 9-12:30</code>, <code>Afternoon 13-17:30</code>, <code>Evening 17:30-21</code></li>
        <li><i>Max classes per week</i> (Short answer)</li>
        <li><i>Days you're away</i> (Short answer, e.g. “3.11, 20.-24.11.”)</li>
        <li><i>Notes</i> (Paragraph, optional)</li></ul>
        Then Send → copy the link → share it in the team chat.</li>
      <li><b>Each month:</b> ask the team to fill it in for the next month.</li>
      <li>In the form open <i>Responses</i> → green Sheets icon. In the sheet: File → Download → <b>Comma-separated values (.csv)</b>.</li>
      <li>In Lab Ledger: <b>Schedule</b> → pick the month → <b>Import form answers</b> → <b>Make proposal</b>.</li>
      <li>Change any class by tapping the name. Your changes stay even if you make a new proposal.</li>
      <li><b>Export for instructors</b> → Print / save as PDF, or copy the text for WhatsApp.</li>
      <li>Create the classes in Eversports as planned (Eversports doesn't allow apps to do this).</li></ol>
      <p><b>How the proposal chooses:</b> only people who are available and teach that class, unpaid instructors first, then whoever usually has the slot, then whoever has the fewest classes that week. Nobody gets more than their max per week or two classes at once.</p>
      <p><b>Weekly classes</b> (bottom of the Schedule page) are the classes that run every week. Change them there when the timetable changes.</p>`)}
    ${sec('team', 'Instructors: paid, unpaid, invoices', `<p>In <b>Settings → Instructors</b> set each person to <i>Paid</i>, <i>Unpaid</i> or <i>Not in tool</i> (hidden from the money, still schedulable). For paid instructors enter the rate per class and the name that appears on the bank statement. <i>Paid from</i> is for someone who starts unpaid and later sends invoices. <b>+ Add instructor</b> adds someone new.</p>`)}
    ${sec('share', 'Sharing with your co-owner', `<p>Both of you use the same app link. In <b>Settings → Sync</b>, each device connects with the same <b>token</b>, <b>Sync ID</b> and <b>passphrase</b>. Changes appear on the other devices within seconds. Share these three through a password manager, not one chat message.</p>`)}
    ${sec('lock', 'Face ID and PIN', `<p><b>Settings → App lock</b>: choose a PIN and tick Face ID / Touch ID. From then on the app asks every time you open it, and after 2 minutes away. Set it up on each device. Forgot the PIN? Remove the app from the device and connect sync again: your data comes back from the encrypted sync file.</p>`)}
    ${sec('safe', 'Is my data safe?', `<p>Your numbers are stored on your devices and, encrypted, in the studio's GitHub account. Without the passphrase nobody can read them, GitHub included. Files you import never leave your device. Customer names aren't stored. The app code on GitHub contains no data.</p>`)}
    ${sec('wrong', 'Something looks wrong?', `<p><b>A payment is in the wrong category:</b> Transactions → change it. <b>Cash doesn't match the bank:</b> import the latest statement PDF; each statement is checked against its own balance. <b>Instructor pay looks off:</b> check Settings → Instructors (status, rate, paid from, bank name). <b>Anything else:</b> take a screenshot and send it to whoever helps you with the app.</p>`)}`;
  }

  // ---------- events ----------
  function afterRender() {
    const fi = $('#file'); if (fi) fi.onchange = () => importFiles([...fi.files]);
    const rs = $('#restore'); if (rs) rs.onchange = () => importFiles([...rs.files]);
    const af = $('#availFile'); if (af) af.onchange = () => importFiles([...af.files]);
    const br = $('#bioRow'); if (br) Lock.bioAvailable().then((ok) => { br.hidden = !ok; });
    const pin = $('#pinIn'); if (pin) { pin.onkeydown = (e) => { if (e.key === 'Enter') ACT.unlockPin(); }; if (!Lock.hasBio()) setTimeout(() => pin.focus(), 50); }
    const q = $('#txQ'); if (q) q.oninput = () => { ui.txQ = q.value; saveUI(); const pos = q.selectionStart; render(); const n = $('#txQ'); n.focus(); n.setSelectionRange(pos, pos); };
  }
  document.addEventListener('dragover', (e) => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); });
  document.addEventListener('dragleave', () => { const d = $('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files.length) { ui.page = 'import'; saveUI(); render(); importFiles([...e.dataTransfer.files]); } });

  const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const ACT = {
    theme: () => { ui.theme = { auto: 'light', light: 'dark', dark: 'auto' }[ui.theme] || 'auto'; saveUI(); render(); toast('Appearance: ' + ({ auto: 'automatic (follows your device)', light: 'light', dark: 'dark' }[ui.theme]), 1800); },
    schedMonth: (el) => { ui.schedMonth = el.dataset.v; saveUI(); render(); },
    slotsFromEv: (el) => {
      if ((state.settings.slots || []).length && !confirm('Replace the weekly classes with the week of ' + dmy(el.dataset.v) + ' from Eversports?')) return;
      state.settings.slots = LLS.slotsFromClasses(state, el.dataset.v); state.settings.updatedAt = Date.now(); save(); render();
    },
    addSlot: () => {
      const day = +$('#nsDay').value, start = LLS.hhmm($('#nsStart').value), end = LLS.hhmm($('#nsEnd').value) || null, title = $('#nsTitle').value.trim();
      if (!start || !title) { toast('Add a start time (e.g. 07:40) and a class name.'); return; }
      state.settings.slots = [...(state.settings.slots || []), { id: newId('s'), day, start, end: end || LLS.hhmm(LLS.mins(start) + 50 + ''), title }];
      state.settings.updatedAt = Date.now(); save(); render();
    },
    delSlot: (el) => { state.settings.slots = state.settings.slots.filter((s) => s.id !== el.dataset.v); state.settings.updatedAt = Date.now(); save(); render(); },
    propose: (el) => {
      const M = ui.schedMonth; const had = state.plans[M] && !state.plans[M].deleted;
      const kept = had ? Object.values(state.plans[M].cells).filter((c) => c.manual).length : 0;
      if (had && !confirm(`Make a new proposal for ${mName(M, true)}?${kept ? ` Your ${kept} manual change${kept > 1 ? 's' : ''} stay.` : ''}`)) return;
      const r = LLS.propose(state, M, { assumeAll: el.dataset.v === 'all' });
      save(); render(); toast(`Proposal ready: ${r.total - r.unfilled} of ${r.total} classes filled${r.unfilled ? `, ${r.unfilled} still open (marked)` : ''}.`);
    },
    exportPlan: () => exportPlan(),
    printPlan: () => window.print(),
    copyPlan: () => { const t = $('#print').dataset.text; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied. Paste it into WhatsApp.'), () => toast('Copy didn\'t work here. Use Print / save as PDF instead.')); },
    closePlan: () => { const b = $('#print'); b.hidden = true; b.innerHTML = ''; document.body.classList.remove('printing'); },
    addIns: () => {
      const id = newId('i');
      state.settings.instructors.push({ id, name: 'New instructor', evNames: [], bankNames: [], status: 'unknown', rate: 0, active: true });
      state.settings.updatedAt = Date.now(); save(); render();
      const el = document.querySelector(`#ins-${id} input`); if (el) { el.scrollIntoView({ block: 'center' }); el.select(); }
    },
    teachToggle: (el) => {
      const i = state.settings.instructors.find((x) => x.id === el.dataset.id); const v = el.dataset.v;
      let t = i.teaches && i.teaches.length ? i.teaches.slice() : (() => { const d = LLS.teachesOf(state, Object.assign({}, i, { teaches: [] })); return d.length ? d : (state.settings.slots || []).map((s) => s.title).filter((x) => /lagree burn/i.test(x)); })();
      t = t.includes(v) ? t.filter((x) => x !== v) : [...t, v];
      i.teaches = [...new Set(t)]; state.settings.updatedAt = Date.now(); save(); render();
    },
    delIns: (el) => { const i = state.settings.instructors.find((x) => x.id === el.dataset.v); if (i && confirm(`Remove ${i.name}? Their past classes stay; they just disappear from the lists.`)) { i.deleted = true; state.settings.updatedAt = Date.now(); save(); render(); } },
    lockOn: async () => {
      const a = $('#lockPin1').value, b = $('#lockPin2').value, err = $('#lockSetErr');
      if (!/^\d{4,8}$/.test(a)) { err.textContent = 'The PIN needs 4 to 8 digits.'; return; }
      if (a !== b) { err.textContent = 'The two PINs are different.'; return; }
      const bio = $('#lockBio') && $('#lockBio').checked && !$('#bioRow').hidden;
      try { await Lock.enable(a, bio); toast(bio ? 'App lock is on, with Face ID / Touch ID.' : 'App lock is on.'); render(); }
      catch (e) { err.textContent = 'Face ID / Touch ID couldn\'t be set up (' + e.message + '). Untick it to use the PIN only.'; }
    },
    lockOff: async () => { const err = $('#lockSetErr'); try { if (await Lock.checkPin($('#lockOffPin').value)) { Lock.disable(); toast('App lock is off.'); render(); } else err.textContent = 'Wrong PIN.'; } catch (e) { err.textContent = e.message; } },
    unlockBio: async () => { try { if (await Lock.bio()) { Lock.unlock(); render(); if (Sync.on()) syncNow(); } } catch (e) { $('#lockErr').textContent = 'Not recognised. Try again or use your PIN.'; } },
    unlockPin: async () => { const err = $('#lockErr'); try { if (await Lock.checkPin($('#pinIn').value)) { Lock.unlock(); render(); if (Sync.on()) syncNow(); } else { err.textContent = 'Wrong PIN.'; $('#pinIn').value = ''; } } catch (e) { err.textContent = e.message; } },
    page: (el) => { ui.page = el.dataset.v; if (el.dataset.cat) { ui.txCat = el.dataset.cat; ui.txMonth = ''; } saveUI(); render(); window.scrollTo(0, 0); },
    cfAll: (el) => { ui.cfAll = el.dataset.v === '1'; saveUI(); render(); },
    salesNet: (el) => { ui.salesNet = el.dataset.v === '1'; saveUI(); render(); },
    teamMonth: (el) => { ui.teamMonth = el.dataset.v; saveUI(); render(); },
    drill: (el) => { ui.page = 'tx'; ui.txMonth = el.dataset.m; ui.txCat = el.dataset.cat; ui.txQ = ''; saveUI(); render(); window.scrollTo(0, 0); },
    txClear: () => { ui.txQ = ''; ui.txMonth = ''; ui.txCat = ''; saveUI(); render(); },
    help: (el) => { const t = $('#tip'); showTip(el, el.dataset.tip, true); },
    copy: (el) => { navigator.clipboard && navigator.clipboard.writeText(el.dataset.v); toast('Copied'); },
    syncNow: () => syncNow(),
    showToken: () => toast(`Token: <code class="mono">${esc(Sync.cfg().token)}</code> <button class="btn sm" data-act="copy" data-v="${esc(Sync.cfg().token)}">Copy</button>`, 15000),
    disconnect: () => { if (confirm('Disconnect this device from sync? Data on this device stays.')) { Sync.disconnect(); render(); } },
    syncCreate: async () => {
      const tok = $('#sTok').value.trim(), pass = $('#sPass').value, err = $('#sErr');
      if (!tok || pass.length < 10) { err.textContent = 'Paste the token and choose a passphrase of at least 10 characters.'; return; }
      err.textContent = 'Creating…';
      try { const id = await Sync.create(tok, pass, state); toast('Sync file created. Sync ID: ' + id); render(); } catch (e) { err.textContent = e.message; }
    },
    syncConnect: async () => {
      const tok = $('#sTok').value.trim(), pass = $('#sPass').value, id = $('#sId').value.trim(), err = $('#sErr');
      if (!tok || !pass || !id) { err.textContent = 'Token, passphrase and Sync ID are all needed to connect.'; return; }
      err.textContent = 'Connecting…';
      try { const remote = await Sync.connect(tok, id, pass); state = LL.migrate(Sync.merge(state, remote)); save(true); await Sync.push(state); toast('Connected. Your data is in.'); render(); } catch (e) { err.textContent = e.message; }
    },
    backup: () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], { type: 'application/json' }));
      a.download = 'lab-ledger-backup-' + today() + '.json'; a.click();
    },
    delRule: (el) => { const r = state.settings.rules[+el.dataset.v]; r.deleted = true; state.settings.updatedAt = Date.now(); save(); render(); },
    erase: () => { if (confirm('Erase all data on this device? Synced data on GitHub and other devices stays.')) { localStorage.removeItem(STORE); Sync.disconnect(); state = LL.migrate(null); render(); } },
    makeRule: (el) => {
      const party = el.dataset.party, cat = el.dataset.cat;
      state.settings.rules = state.settings.rules || [];
      state.settings.rules.unshift({ m: '^' + party.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), c: cat });
      // the rule now decides for the others; keep manual choices only where they differ
      for (const t of LL.live(state.bank)) if (t.party === party && t.cat === cat) { delete t.cat; t.updatedAt = Date.now(); }
      state.settings.updatedAt = Date.now(); save(); render(); toast('Rule saved. Future payments from ' + esc(party) + ' are sorted the same way.');
    },
  };
  const CHANGE = {
    cellSet: (el) => {
      const M = ui.schedMonth; const p = state.plans[M]; if (!p) return;
      p.cells[el.dataset.k] = { ins: el.value, manual: true }; p.updatedAt = Date.now(); save();
      el.className = 'cellsel man' + (!el.value ? ' open' : el.value === '-' ? ' off' : '');
    },
    txMonth: (el) => { ui.txMonth = el.value; saveUI(); render(); },
    txCat: (el) => { ui.txCat = el.value; saveUI(); render(); },
    setCat: (el) => {
      const t = state.bank[el.dataset.id]; t.cat = el.value; t.updatedAt = Date.now(); save(); render();
      const same = LL.live(state.bank).filter((x) => x.party === t.party).length;
      toast(`Saved. ${same > 1 || true ? `<button class="btn sm" data-act="makeRule" data-party="${esc(t.party)}" data-cat="${t.cat}">Always sort “${esc(t.party.slice(0, 28))}” as ${CATS[t.cat].label}</button>` : ''}`, 9000);
    },
    setWho: (el) => {
      const t = state.bank[el.dataset.id]; t.cat = 'instructors'; t.who = el.value || null; t.updatedAt = Date.now();
      const i = state.settings.instructors.find((x) => x.id === t.who);
      if (i && t.party && !(i.bankNames || []).some((b) => b.toLowerCase() === t.party.toLowerCase())) { i.bankNames = [...(i.bankNames || []), t.party]; state.settings.updatedAt = Date.now(); }
      save(); render();
    },
    insSet: (el) => {
      const i = state.settings.instructors.find((x) => x.id === el.dataset.id); const f = el.dataset.f;
      if (f === 'rate') i.rate = Math.round(parseFloat(el.value.replace(/\./g, '').replace(',', '.')) * 100) || 0;
      else if (f === 'bankNames') i.bankNames = el.value.split(',').map((s) => s.trim()).filter(Boolean);
      else if (f === 'active') i.active = el.checked;
      else if (f === 'teaches') i.teaches = [...el.selectedOptions].map((o) => o.value);
      else if (f === 'paidFrom') i.paidFrom = el.value || null;
      else i[f] = el.value;
      state.settings.updatedAt = Date.now(); save(); render();
    },
    setSetting: (el) => { const f = el.dataset.f; state.settings[f] = f === 'bufferMonths' ? Math.max(0, +el.value || 0) : el.value; state.settings.updatedAt = Date.now(); save(); render(); },
  };
  document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'button')) return; const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el); } });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-act]'); if (!el) return; const f = CHANGE[el.dataset.act]; if (f) f(el); });

  // tooltips: hover on desktop, tap on touch
  function showTip(el, html, sticky) {
    const t = $('#tip'); t.innerHTML = html; t.hidden = false;
    const r = el.getBoundingClientRect(); const tw = Math.min(280, window.innerWidth - 24);
    t.style.maxWidth = tw + 'px';
    let x = r.left + r.width / 2 - t.offsetWidth / 2; x = Math.max(12, Math.min(x, window.innerWidth - t.offsetWidth - 12));
    let y = r.top - t.offsetHeight - 8; if (y < 8) y = r.bottom + 8;
    t.style.left = x + 'px'; t.style.top = y + window.scrollY + 'px'; t.dataset.sticky = sticky ? '1' : '';
  }
  document.addEventListener('mouseover', (e) => { const g = e.target.closest('.hov'); if (g) showTip(g, g.dataset.tip); });
  document.addEventListener('mouseout', (e) => { const g = e.target.closest('.hov'); if (g && !$('#tip').dataset.sticky) $('#tip').hidden = true; });
  document.addEventListener('click', (e) => { const g = e.target.closest('.hov'); if (g) showTip(g, g.dataset.tip, true); else if (!e.target.closest('.q')) $('#tip').hidden = true; }, true);

  let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (!document.activeElement || !['INPUT', 'SELECT'].includes(document.activeElement.tagName)) render(); }, 200); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !Lock.isLocked()) syncNow(); });

  Lock.watch(() => render());
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme());
  render();
  if (Sync.on() && !Lock.isLocked()) syncNow();
})();

</script>
</body>
</html>
