<style>
:root {
  /* brand: #252525 charcoal · #3B0A0A oxblood · #F4F0F0 · #E9E8E7 */
  --bg: #F4F0F0; --surface: #FFFFFF; --surface2: #E9E8E7; --ink: #252525; --ink2: #4D4949; --muted: #807A79;
  --line: #E2DCDB; --accent: #3B0A0A; --accent-ink: #F4F0F0; --blush: #EEDFDC; --link: #7A2A20;
  --hero: #3B0A0A; --hero-ink: #F4F0F0;
  --in: #1F6FA8; --out: #A63F2E; --pos: #2E6B4A; --neg: #A8321F; --warn: #8E5A00;
  --room1: #3B0A0A; --room2: #3E6E7E; --room1bg: #F6ECEA; --room2bg: #E8F0F2;
  --seq0: #D9D4D3; --seq1: #F1DCD7; --seq2: #E2B1A7; --seq3: #C77D6F; --seq4: #9A4437; --seq5: #5C1A12;
  --grid: #EAE5E4; --shadow: 0 1px 2px rgba(37,37,37,.05), 0 4px 16px rgba(37,37,37,.04);
  --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1B1B; --surface: #252525; --surface2: #2F2E2E; --ink: #F4F0F0; --ink2: #CFC9C8; --muted: #918B8A;
    --line: #3A3737; --accent: #E3B8AF; --accent-ink: #252525; --blush: #3A2523; --link: #E8B4AA;
    --hero: #3B0A0A; --hero-ink: #F4F0F0;
    --in: #4C94CC; --out: #D06A55; --pos: #74C394; --neg: #F08A76; --warn: #E3B04B;
    --room1: #D98C80; --room2: #7FB3C4; --room1bg: #33201E; --room2bg: #1F2C30;
    --seq0: #4A4747; --seq1: #4E2A26; --seq2: #723A32; --seq3: #9E5145; --seq4: #C9776A; --seq5: #EDB3A8;
    --grid: #333131; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1B1B; --surface: #252525; --surface2: #2F2E2E; --ink: #F4F0F0; --ink2: #CFC9C8; --muted: #918B8A;
  --line: #3A3737; --accent: #E3B8AF; --accent-ink: #252525; --blush: #3A2523; --link: #E8B4AA;
  --hero: #3B0A0A; --hero-ink: #F4F0F0;
  --in: #4C94CC; --out: #D06A55; --pos: #74C394; --neg: #F08A76; --warn: #E3B04B;
  --room1: #D98C80; --room2: #7FB3C4; --room1bg: #33201E; --room2bg: #1F2C30;
  --seq0: #4A4747; --seq1: #4E2A26; --seq2: #723A32; --seq3: #9E5145; --seq4: #C9776A; --seq5: #EDB3A8;
  --grid: #333131; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); font-feature-settings: 'tnum' 1, 'cv11' 1; }
a { color: var(--link); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 14px 16px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font: italic 500 28px/1.1 var(--serif); letter-spacing: .01em; }
.brand h1 span { font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-style: normal; margin-left: 10px; }
.hdr-r { display: flex; align-items: center; gap: 8px; }
.iconbtn svg { display: block; }
.iconbtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px/1 var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.sync { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--surface2); color: var(--ink2); white-space: nowrap; }
.sync::before { content: '●'; margin-right: 6px; }
.sync.ok::before { color: var(--pos); } .sync.busy::before { color: var(--warn); } .sync.err::before { color: var(--neg); } .sync.off::before { color: var(--muted); }
nav#nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; }
nav#nav::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; color: var(--ink2); font: 500 14px var(--sans); padding: 10px 12px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); }
.tab .dot { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; line-height: 18px; text-align: center; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; margin-bottom: 16px; box-shadow: var(--shadow); min-width: 0; }
h2 { font: 600 15px/1.3 var(--sans); margin: 0 0 12px; letter-spacing: .005em; }
h2.mt, .mt { margin-top: 18px; }
.tiles { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.tile.hero { background: var(--hero); color: var(--hero-ink); border-color: var(--hero); }
.tile.hero .label, .tile.hero .sub { color: color-mix(in srgb, var(--hero-ink) 72%, var(--hero)); }
.tile.hero .okc { color: #BFE3C9; }
.tile.hero .q { color: inherit; border-color: currentColor; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.big { font: 500 34px/1.15 var(--serif); margin: 6px 0 4px; letter-spacing: -.01em; white-space: nowrap; }
.tile.hero .big { font-size: 44px; }
.sub { font-size: 13px; color: var(--ink2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2 > .card { margin-bottom: 16px; }
.pos, .okc { color: var(--pos); } .neg, .negc { color: var(--neg); } .warnc { color: var(--warn); }
td.neg, td.pos { color: inherit; }
td.neg a, td.neg { color: var(--neg); }
.b { font-weight: 600; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.row { display: flex; align-items: center; } .gap { gap: 8px; } .wrap { flex-wrap: wrap; } .between { justify-content: space-between; gap: 10px; }
.attn { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--blush) 35%, var(--surface)); }
.attn ul { margin: 0; padding-left: 18px; } .attn li { margin: 4px 0; }
/* charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--muted); stroke-width: 1; }
.chart .zero { stroke: var(--neg); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .ax { fill: var(--muted); font: 11px var(--sans); }
.chart .b-in { fill: var(--in); } .chart .b-out { fill: var(--out); }
.chart .ln { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.chart .ln.dash { stroke-dasharray: 5 5; stroke: var(--muted); }
.chart .pt { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.chart .pt.f { fill: var(--surface); stroke: var(--muted); }
.chart .hit { fill: transparent; }
.chart .hov:hover .hit { fill: color-mix(in srgb, var(--ink) 5%, transparent); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink2); margin: -4px 0 8px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.sw-in { background: var(--in); } .sw-out { background: var(--out); }
#tip { position: absolute; z-index: 50; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
#tip b { font-weight: 600; }
.q { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--muted); background: none; color: var(--muted); font: 600 11px/1 var(--sans); padding: 0; cursor: pointer; flex: none; vertical-align: 1px; text-transform: none; letter-spacing: 0; }
/* tables */
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.t th, .t td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.t thead th { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.t .r { text-align: right; white-space: nowrap; }
.t td a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
.t tr.sum th, .t tr.sum td { font-weight: 600; background: var(--surface2); }
.t tr.strong th, .t tr.strong td { border-top: 1.5px solid var(--ink2); }
.t tr.gh th { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 16px; border-bottom: 0; }
.t .rl { font-weight: 500; white-space: nowrap; }
.t.cf .rl { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 150px; }
.t.cf tr.sum .rl { background: var(--surface2); }
.t .tot { border-left: 1px solid var(--line); }
.t tr.dim td { color: var(--muted); }
.t tr.warnrow td { background: color-mix(in srgb, var(--blush) 40%, transparent); }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--surface2); color: var(--ink2); vertical-align: 1px; }
/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px var(--sans); padding: 9px 14px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: none; color: var(--ink2); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
.seg { display: inline-flex; background: var(--surface2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font: 500 13px var(--sans); color: var(--ink2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font: 500 13px var(--sans); color: var(--ink2); cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.static { cursor: default; }
.in, select { font: 14px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; max-width: 100%; min-width: 0; }
.in:disabled { opacity: .45; }
.in.num { width: 90px; text-align: right; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.fld { display: block; font-size: 13px; color: var(--ink2); margin: 10px 0; }
.fld .in { display: block; width: 100%; margin-top: 4px; }
.fld .row .in { margin-top: 4px; }
.ins .in { width: 100%; min-width: 110px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.search { position: relative; flex: 1 1 240px; }
.search input { width: 100%; padding-right: 30px; font: 14px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 30px 8px 10px; }
.x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
.rules { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.rules li { position: relative; padding: 4px 26px 4px 0; border-bottom: 1px solid var(--line); }
.rules code { font-size: 12px; }
/* transactions */
.txlist { border-top: 1px solid var(--line); }
.tx { display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'main amt' 'cat cat'; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tx.warn { background: color-mix(in srgb, var(--blush) 35%, transparent); margin: 0 -8px; padding: 10px 8px; }
.tx-main { grid-area: main; min-width: 0; } .tx-amt { grid-area: amt; font-weight: 600; white-space: nowrap; text-align: right; }
.tx-amt.neg { color: var(--ink); } .tx-amt.pos { color: var(--pos); }
.tx-name { font-weight: 500; overflow-wrap: anywhere; } .tx-meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.tx-cat { grid-area: cat; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tx-cat select { font-size: 13px; padding: 4px 6px; }
@media (min-width: 760px) { .tx { grid-template-columns: 1fr 220px 120px; grid-template-areas: 'main cat amt'; align-items: center; } }
/* import */
.drop { display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; text-align: center; border: 2px dashed var(--line); border-radius: 14px; padding: 34px 16px; cursor: pointer; background: var(--surface2); }
.drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--blush) 40%, var(--surface)); }
.drop input { display: none; }
.result { list-style: none; padding: 0; margin: 12px 0 0; } .result li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); } .result li:first-child { border-top: 0; }
.imp { flex: none; display: inline-block; font: 600 12px/1 var(--sans); padding: 5px 9px; border-radius: 99px; white-space: nowrap; }
.imp.ok { background: color-mix(in srgb, var(--pos) 16%, var(--surface)); color: var(--pos); }
.imp.bad { background: color-mix(in srgb, var(--neg) 14%, var(--surface)); color: var(--neg); }
.imp.sm { padding: 2px 6px; font-size: 11px; }
.steps { padding-left: 20px; } .steps li { margin: 8px 0; }
.hero-empty { max-width: 560px; margin: 60px auto; text-align: center; }
.hero-empty h1 { font: 500 40px/1.1 var(--serif); margin: 0 0 12px; }
.hero-empty .row { justify-content: center; margin: 22px 0 12px; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 8px 28px rgba(0,0,0,.25); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#toast .btn { background: var(--bg); color: var(--ink); border: 0; }
#toast code { overflow-wrap: anywhere; }
@media (max-width: 980px) { .tiles { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
td.nw { white-space: nowrap; }
@media (max-width: 379px) { .srow { grid-template-columns: 42px 1fr; } .srow .cellsel { grid-column: span 2; } }
@media (max-width: 520px) {
  .srow { grid-template-columns: 44px 1fr 140px; }
  .hide-sm { display: none; }
  .tiles { grid-template-columns: 1fr; } .big { font-size: 30px; } .tile.hero .big { font-size: 38px; }
  .card { padding: 14px 12px; border-radius: 12px; } .brand h1 { font-size: 24px; } .brand h1 span { display: none; }
}

/* forecast columns */
.t .fc { background: color-mix(in srgb, var(--surface2) 55%, transparent); font-style: italic; }
.t thead th.fc { font-style: normal; }
.fct { font: 500 10px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-style: normal; }
.t tr.sum td.fc { background: color-mix(in srgb, var(--surface2) 100%, var(--ink) 4%); }
.q.static { display: inline-flex; align-items: center; justify-content: center; vertical-align: -3px; }
/* ideas */
.idea-list { list-style: none; margin: 0; padding: 0; }
.idea { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.idea:first-child { border-top: 0; padding-top: 0; }
.idea p { margin: 3px 0 0; color: var(--ink2); font-size: 14px; }
.idea .ic { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; background: var(--surface2); }
.idea.bad .ic { background: color-mix(in srgb, var(--neg) 16%, transparent); color: var(--neg); }
.idea.good .ic { background: color-mix(in srgb, var(--pos) 16%, transparent); color: var(--pos); }
/* instructor bars */
.ibars { display: grid; gap: 6px; margin: 4px 0 10px; }
.ibar { display: grid; grid-template-columns: minmax(70px, 120px) 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; cursor: default; }
.iname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.itrack { height: 14px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.ifill { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.ival { white-space: nowrap; font-size: 13px; min-width: 120px; text-align: right; }
.seq0 { background: repeating-linear-gradient(135deg, var(--seq0) 0 4px, transparent 4px 7px); border: 1px solid var(--seq0); }
.seq1 { background: var(--seq1); } .seq2 { background: var(--seq2); } .seq3 { background: var(--seq3); } .seq4 { background: var(--seq4); } .seq5 { background: var(--seq5); }
.seqlegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink2); align-items: center; }
.seqlegend .sw { width: 14px; }
/* schedule */
.steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stp { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; background: var(--surface2); border-radius: 10px; padding: 12px; }
.sgrid { table-layout: fixed; }
.sgrid th, .sgrid td { padding: 4px; vertical-align: top; }
.sgrid th:first-child { width: 52px; }
.sgrid .out { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface2) 6px 7px); color: var(--muted); }
.sgrid th.st, .st { font-weight: 600; font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.scell { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.sn { font-size: 11.5px; color: var(--muted); }
.cellsel { width: 100%; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
.cellsel.open { border-color: var(--neg); background: color-mix(in srgb, var(--neg) 8%, var(--surface)); }
.cellsel.off { color: var(--muted); text-decoration: line-through; }
.cellsel.man { box-shadow: inset 3px 0 0 var(--accent); }
.sday { border-top: 1px solid var(--line); padding: 8px 0; }
.sdh { font-weight: 600; margin-bottom: 4px; }
.srow { display: grid; grid-template-columns: 46px 1fr 150px; gap: 8px; align-items: center; padding: 3px 0; }
.srow .sn { font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<script>
/* Lab Ledger — file parsers. Pure functions, no DOM. Works in browser and Node. */
(function (G) {
  'use strict';

  // ---------- helpers ----------
  const toCents = (n) => Math.round(n * 100);
  // "1.234,56-" (Erste) -> -123456
  function atAmount(s) {
    s = String(s).trim();
    const neg = /-$/.test(s) || /^-/.test(s);
    const n = parseFloat(s.replace(/[-\s]/g, '').replace(/\./g, '').replace(',', '.'));
    return isNaN(n) ? null : (neg ? -1 : 1) * toCents(n);
  }
  // "1,890" / "78,998.9" / "-19" (Eversports, English format) -> cents
  function enAmount(s) {
    s = String(s || '').trim().replace(/,/g, '');
    if (s === '') return 0;
    const n = parseFloat(s);
    return isNaN(n) ? 0 : toCents(n);
  }
  // dd.mm.yyyy or dd/mm/yyyy -> yyyy-mm-dd
  function isoDate(s) {
    const m = String(s).trim().match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    const m2 = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m2 ? `${m2[1]}-${m2[2]}-${m2[3]}` : null;
  }

  // ---------- CSV ----------
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/, 1)[0];
    const delim = (first.split(';').length >= first.split(',').length) ? ';' : ',';
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    const head = (rows.shift() || []).map((h) => h.trim());
    return rows.filter((r) => r.some((c) => c.trim() !== '')).map((r) => {
      const o = {}; head.forEach((h, i) => (o[h] = (r[i] || '').trim())); return o;
    });
  }

  // Detect which Eversports / bank export a CSV is
  function detectCSV(rows) {
    if (!rows.length) return null;
    const k = Object.keys(rows[0]);
    const has = (x) => k.includes(x);
    if (has('Voucher Code') && has('Paid Invoice Amount')) return 'vouchers';
    if (has('Paid Gross') && has('Product Name')) return 'sales';
    if (has('Trainer') && has('Max. participants') && has('Start time')) return 'classes';
    if (has('Amount spent (EUR)') || (has('Amount spent') && has('Link clicks'))) return 'ads';
    if (has('Number of participations')) return 'gproducts';
    if (has('Total bookings in timeframe')) return 'gcustomers';
    if (k.some((x) => /name/i.test(x)) && k.some((x) => /\[[^\]]+\]\s*$|(monday|tuesday|wednesday|thursday|friday|saturday|sunday|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)/i.test(x)) && !has('Paid Gross')) return 'availability';
    // George CSV (best effort): needs a date and an amount column
    const lk = k.map((x) => x.toLowerCase());
    if (lk.some((x) => /buchungsdatum|booking date|valuta|value date/.test(x)) && lk.some((x) => /betrag|amount/.test(x))) return 'georgecsv';
    return null;
  }

  // ---------- Eversports: revenue report (income & expenses) ----------
  function parseSales(rows) {
    const out = [];
    for (const r of rows) {
      const date = isoDate(r['Paid At']);
      if (!date) continue; // skips the "Sum ..." line
      out.push({
        date, inv: r['Invoice Number'], state: r['Payment State'],
        product: (r['Product Name'] || '').trim(), ptype: r['Product Type'],
        gross: enAmount(r['Paid Gross']), net: enAmount(r['Paid Net']), vat: enAmount(r['VAT Amount']),
        method: r['Payment Method'], cashier: r['Cashier'] === 'online' ? 'online' : 'studio', customer: (r['Customer Name'] || '').trim(),
      });
    }
    return out;
  }
  // ---------- Eversports: voucher sales ----------
  function parseVouchers(rows) {
    const out = [];
    for (const r of rows) {
      const date = isoDate(r['Paid At'] || r['Invoice Date']);
      if (!date) continue;
      out.push({
        date, inv: r['Invoice No.'], type: r['Invoice Type'],
        gross: enAmount(r['Paid Invoice Amount']), vat: enAmount(r['VAT Amount']),
        net: enAmount(r['Paid Invoice Amount']) - enAmount(r['VAT Amount']), method: r['Payment Method'],
      });
    }
    return out;
  }
  // ---------- Eversports: activity report / utilization report ----------
  function parseClasses(rows) {
    const out = [];
    for (const r of rows) {
      const date = isoDate(r['Date']);
      if (!date) continue;
      const cancelled = /cancel/i.test(r['Status'] || '') || /^yes$/i.test(r['Session cancelled'] || '');
      out.push({
        date, start: r['Start time'], end: r['End time'], title: (r['Title'] || '').trim(), type: r['Type'],
        trainer: (r['Trainer'] || '').trim(), registered: +r['Registered'] || 0, present: +r['Present'] || 0,
        max: +r['Max. participants'] || 0, sport: r['Sport'] || '', cancelled,
      });
    }
    return out;
  }

  // ---------- Erste / Sparkasse statement PDF ----------
  // pages: array of arrays of {str, x, y}. Returns {statements:[...], tx:[...]}
  const AMT = /^-?[\d.]+,\d\d-?$/;
  const DATE = /^\d\d\.\d\d\.\d{4}$/;
  function linesFromItems(items) {
    const rows = [];
    for (const it of items) {
      if (!it.str || !it.str.trim()) continue;
      if (it.w === undefined) it.w = 0;
      let row = rows.find((r) => Math.abs(r.y - it.y) < 2.5);
      if (!row) { row = { y: it.y, items: [] }; rows.push(row); }
      row.items.push(it);
    }
    rows.sort((a, b) => b.y - a.y);
    // merge word items into column cells: a gap wider than ~8pt starts a new cell
    rows.forEach((r) => {
      r.items.sort((a, b) => a.x - b.x);
      const cells = []; let c = null;
      for (const it of r.items) {
        const s = it.str.trim();
        if (c && (it.w === 0 ? it.x - c.end < 12 : it.x - c.end < 8)) { c.str += (it.x - c.end > 1.2 ? ' ' : '') + s; c.end = it.x + (it.w || s.length * 4.5); }
        else { c = { str: s, x: it.x, end: it.x + (it.w || s.length * 4.5) }; cells.push(c); }
      }
      r.items = cells.map((x) => ({ str: x.str.replace(/([\d.]+,\d\d) -$/, '$1-'), x: x.x }));
    });
    return rows;
  }
  function parseStatementPages(pages) {
    const statements = []; const tx = [];
    let st = null, inBody = false, cur = null;
    for (const items of pages) {
      const rows = linesFromItems(items);
      for (const row of rows) {
        const parts = row.items.map((i) => i.str.trim()).filter(Boolean);
        const text = parts.join(' ');
        const nr = text.match(/Nr\.\s*(\d{3}\/\d{4})/);
        if (nr && /Kontoauszug/.test(text)) {
          st = { no: nr[1], iban: null, oldBal: null, newBal: null, date: null, count: 0, sum: 0 };
          statements.push(st); inBody = false; cur = null; continue;
        }
        if (!st) continue;
        const ib = text.match(/IBAN:\s*(AT\d{18})/); if (ib) st.iban = ib[1];
        const ob = text.match(/Alter Kontostand\s+(-?[\d.]+,\d\d-?)/); if (ob && st.oldBal === null) st.oldBal = atAmount(ob[1]);
        const nb = text.match(/Neuer Kontostand(?:\/New Balance)?\s+(-?[\d.]+,\d\d-?)/); if (nb) st.newBal = atAmount(nb[1]);
        if (/Neuer Kontostand\/New Balance/.test(text)) { inBody = false; cur = null; continue; }
        if (/Buchungstext\/Booking Text/.test(text)) { inBody = true; continue; }
        const foot = text.match(/^AT\d{18}\s+(\d\d\.\d\d\.\d{4})/);
        if (foot) { st.date = isoDate(foot[1]); inBody = false; continue; }
        if (/^IBAN Datum\/Date/.test(text)) { inBody = false; continue; }
        if (/^(Erste Bank der|Sparkassen AG|Am Belvedere|1100 Wien|Salzburger Sparkasse|Alter Kontostand|Neuer Kontostand)/.test(text)) continue;
        if (!inBody) continue;
        const last = parts[parts.length - 1];
        const di = parts.findIndex((p) => DATE.test(p));
        if (di >= 0 && AMT.test(last) && di < parts.length - 1) {
          cur = { date: isoDate(parts[di]), amount: atAmount(last), ref: parts.slice(0, di).join(' ').replace(/\s+/g, ' '), details: [], st: st.no };
          tx.push(cur); st.count++; st.sum += cur.amount;
        } else if (di >= 0 && !AMT.test(last)) {
          cur = null; // booking line without amount (closing notes)
        } else if (cur) {
          cur.details.push(text.replace(/\s+/g, ' '));
        }
      }
    }
    for (const t of tx) {
      // counterparty = first detail line that isn't a reference code
      t.party = (t.details.find((d) => !/^(MDID:|NOTPROVIDED|EVERSPORT-|SPESEN|stammt von|Reklamationen|[A-Z]{3}\s+[\d.,]+$)/.test(d)) || t.ref || '').trim();
      t.text = [t.ref, ...t.details].join(' | ');
    }
    return { statements, tx };
  }

  // ---------- George CSV (best effort, untested format) ----------
  function parseGeorgeCSV(rows) {
    const k = Object.keys(rows[0]);
    const find = (re) => k.find((x) => re.test(x.toLowerCase()));
    const dCol = find(/buchungsdatum|booking date/) || find(/valuta|value date/);
    const aCol = find(/^betrag|amount/);
    const pCol = find(/partner|name|empfänger|auftraggeber/);
    const tCol = find(/buchungstext|verwendungszweck|reference|booking text|details/);
    const tx = [];
    for (const r of rows) {
      const date = isoDate(r[dCol]); if (!date) continue;
      let a = r[aCol];
      const amount = /,\d\d-?$/.test(a) ? atAmount(a) : enAmount(a);
      const party = (r[pCol] || '').trim(); const ref = (r[tCol] || '').trim();
      tx.push({ date, amount, ref, party: party || ref, details: [party], text: [ref, party].join(' | ') });
    }
    return tx;
  }
  // ---------- George JSON (best effort) ----------
  function parseGeorgeJSON(arr) {
    const tx = [];
    for (const r of arr) {
      const date = isoDate(r.booking || r.bookingDate || r.valuation || r.valueDate || '');
      const amt = r.amount || {};
      let v = amt.value !== undefined ? amt.value / Math.pow(10, amt.precision || 0) : parseFloat(r.amount);
      if (!date || isNaN(v)) continue;
      const party = r.partnerName || r.partner?.name || '';
      const ref = r.reference || r.referenceNumber || r.receiverReference || '';
      const desc = [r.bookingTypeTranslation, r.additionalInformation].filter(Boolean).join(' ');
      tx.push({ date, amount: Math.round(v * 100), ref: ref || desc, party: party || desc, details: [party, desc].filter(Boolean), text: [ref, party, desc].filter(Boolean).join(' | ') });
    }
    return tx;
  }

  // keep only the columns an analysis needs (drops birthdays, phone numbers, etc.)
  function minimiseCSV(rows, keep) {
    const cols = Object.keys(rows[0] || {}).filter((c) => keep.some((k) => (k instanceof RegExp ? k.test(c) : k === c)));
    const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    return [cols.map(q).join(';'), ...rows.map((r) => cols.map((c) => q(r[c])).join(';'))].join('\n');
  }
  G.LLParse = { minimiseCSV, parseCSV, detectCSV, parseSales, parseVouchers, parseClasses, parseStatementPages, parseGeorgeCSV, parseGeorgeJSON, isoDate, atAmount, enAmount };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Lab Ledger — data model, import merge, categories, monthly aggregation. No DOM. */
(function (G) {
  'use strict';
  const APP_VERSION = '1.4';
  const SCHEMA = 1;

  // ---------- categories ----------
  // group: in = operating income, out = operating cost, setup = one-off build-out,
  //        tax = VAT / tax office, fin = financing (owners, bank loan, deposits)
  const CATS = {
    sales:       { label: 'Eversports payouts', group: 'in' },
    terminal:    { label: 'Card terminal (SumUp)', group: 'in' },
    rental_in:   { label: 'Room rental', group: 'in' },
    other_in:    { label: 'Other income', group: 'in' },
    rent:        { label: 'Rent', group: 'out' },
    instructors: { label: 'Instructor pay', group: 'out' },
    payroll:     { label: 'Social security & payroll tax', group: 'out' },
    platform:    { label: 'Eversports fees', group: 'out' },
    utilities:   { label: 'Utilities', group: 'out' },
    insurance:   { label: 'Insurance', group: 'out' },
    software:    { label: 'Software & web', group: 'out' },
    marketing:   { label: 'Marketing', group: 'out' },
    accounting:  { label: 'Accounting & legal', group: 'out' },
    bank:        { label: 'Bank fees', group: 'out' },
    loan_fees:   { label: 'Loan fees', group: 'out' },
    supplies:    { label: 'Studio supplies', group: 'out' },
    license:     { label: 'Lagree licence', group: 'out' },
    memberships: { label: 'Chamber & fees', group: 'out' },
    travel:      { label: 'Travel', group: 'out' },
    events_out:  { label: 'Events & catering', group: 'out' },
    other_out:   { label: 'Other costs', group: 'out' },
    uncat:       { label: 'Not sorted yet', group: 'out' },
    setup:       { label: 'Build-out & setup', group: 'setup' },
    certification: { label: 'Lagree certification', group: 'setup' },
    vat:         { label: 'VAT & tax office', group: 'tax' },
    owner:       { label: 'Shareholder money', group: 'fin' },
    bank_loan:   { label: 'Bank loan drawdown', group: 'fin' },
    loan_repay:  { label: 'Loan repayment', group: 'fin' },
    deposit:     { label: 'Security deposit', group: 'fin' },
  };
  const GROUPS = { in: 'Income', out: 'Running costs', setup: 'One-off build-out', tax: 'Tax office', fin: 'Financing' };

  // Generic rules (no personal data). Matched against "party | text", lower case. sign: '+' only money in, '-' only money out.
  const BUILTIN_RULES = [
    { m: 'eversport-|stripe', c: 'sales', s: '+' },
    { m: 'eversport', c: 'platform' },
    { m: 'sumup limited|sumup eur ops', c: 'terminal' },
    { m: 'rueckzahlung', c: 'vat', s: '+' },
    { m: 'fa österreich|finanzamt', c: 'payroll', s: '-' },
    { m: 'gesundheitskasse|ögk|oegk', c: 'payroll' },
    { m: 'gemeinde salzburg|magistrat', c: 'payroll' },
    { m: 'haftungsprovision', c: 'loan_fees' },
    { m: 'kreditauszahlung|teilauszahlung|teilinanspruchnahme|fehlbuchung', c: 'bank_loan' },
    { m: '^kredit |\\| kredit \\d', c: 'loan_repay', s: '-' },
    { m: 'kontoführung|buchungskosten|debitkarte|digital banking|karten-airbag|^spesen|ausfertigungsgebühr|kest|habenzinsen', c: 'bank' },
    { m: 'wirtschaftskammer', c: 'memberships' },
    { m: 'salzburg ag', c: 'utilities' },
    { m: 'versicherung|arag se|uniqa|allianz|generali', c: 'insurance' },
    { m: 'google|strato|canva|elementor|wix|squarespace|adobe|apple.com/bill', c: 'software' },
    { m: 'facebk|meta pla|instagram|flyeralarm|vistaprint|peterkopie|google ads', c: 'marketing' },
    { m: 'steuerberat|notar|landesgericht|rechtsanw', c: 'accounting' },
    { m: 'lagree fitness|spx fitness', c: 'license' },
    { m: 'westbahn|öbb|oebb|numastays|booking.com|airbnb|ryanair|austrian air', c: 'travel' },
    { m: 'amazon|ikea|jysk|bauhaus|dm-fil|lidl|spar |billa|hofer|temu|kaufland|zara ?home|deichmann|dehner|blumen|etsy|sklum|kenay|sport-tec|lampenwelt|obi |hornbach|müller|brunos|wolt|colibri|ryzon|sb supply|abraham|sanitino|eufy|dji', c: 'supplies' },
  ];

  const COLLS = ['bank', 'statements', 'sales', 'vouchers', 'classes', 'avail', 'plans', 'events', 'growth', 'bills', 'tenants'];
  // Is this instructor paid for a class in month m? ('paid from' lets someone start unpaid and switch to invoices)
  const paidIn = (ins, m) => !!ins && ins.status === 'paid' && (!ins.paidFrom || m >= ins.paidFrom);

  function defaultState() {
    return {
      schema: SCHEMA,
      settings: {
        openingDate: '2026-05-16',
        startMonth: null,
        instructors: [],
        rules: [],
        bufferMonths: 3,
        slots: [],
        classTypes: [],
        rooms: ['The Lagree Room', 'The Movement Room'],
        ideas: [],
        vatMode: 'monthly',
        targets: { conv30: 35, commit30: 20, trials: 150, returning: 180, avgBooked: 6, membership: 300000, newsletter: 40 },
        patches: [],
        updatedAt: 0,
      },
      bank: {}, statements: {}, sales: {}, vouchers: {}, classes: {}, avail: {}, plans: {}, events: {}, growth: {}, bills: {}, tenants: {},
    };
  }
  function migrate(s) {
    const d = defaultState();
    s = Object.assign(d, s || {});
    s.settings = Object.assign(defaultState().settings, s.settings || {});
    for (const k of COLLS) s[k] = s[k] || {};
    s.settings.slots = s.settings.slots || []; s.settings.patches = s.settings.patches || []; s.settings.classTypes = s.settings.classTypes || []; s.settings.ideas = s.settings.ideas || []; s.settings.targets = Object.assign({ conv30: 35, commit30: 20, trials: 150, returning: 180, avgBooked: 6, membership: 300000, newsletter: 40 }, s.settings.targets || {}); s.settings.vatMode = s.settings.vatMode || 'monthly';
    if (!s.settings.rooms || !s.settings.rooms.length) s.settings.rooms = ['The Lagree Room', 'The Movement Room'];
    s.schema = SCHEMA;
    return s;
  }

  // ---------- small utils ----------
  const now = () => Date.now();
  const mk = (iso) => iso.slice(0, 7);
  function addMonths(m, n) { let [y, mo] = m.split('-').map(Number); mo += n; while (mo > 12) { mo -= 12; y++; } while (mo < 1) { mo += 12; y--; } return `${y}-${String(mo).padStart(2, '0')}`; }
  function monthRange(a, b) { const out = []; for (let m = a; m <= b; m = addMonths(m, 1)) out.push(m); return out; }
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
  const live = (o) => Object.values(o).filter((x) => !x.deleted);
  const norm = (s) => String(s || '').toLowerCase();
  function slug(s) { return norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

  // ---------- instructors ----------
  // Eversports trainer label "Lea - ENG" -> "Lea"
  function trainerName(t) { return String(t || '').replace(/\s+-\s+(ENG|DE|EN|GER)$/i, '').trim(); }
  function findInstructor(state, trainer) {
    const t = norm(trainerName(trainer));
    return state.settings.instructors.find((i) => !i.deleted && (norm(i.name) === t || (i.evNames || []).some((e) => norm(trainerName(e)) === t)));
  }
  function ensureInstructor(state, trainer) {
    if (!trainer) return null;
    let ins = findInstructor(state, trainer);
    if (!ins) {

  }

  // ---------- categorize a bank line ----------
  function categorize(state, t) {
    if (t.cat) return { cat: t.cat, who: t.who || null, manual: true };
    const hay = norm(t.party + ' | ' + t.text);
    // instructor pay by bank name
    for (const i of state.settings.instructors) {
      if (i.deleted) continue;
      for (const b of i.bankNames || []) if (b && hay.includes(norm(b)) && t.amount < 0) return { cat: 'instructors', who: i.id };
    }
    const rules = [...(state.settings.rules || []).filter((r) => !r.deleted), ...BUILTIN_RULES];
    for (const r of rules) {
      if (r.s === '+' && t.amount < 0) continue;
      if (r.s === '-' && t.amount > 0) continue;
      let ok = false;
      try { ok = new RegExp(r.m, 'i').test(hay); } catch (e) { ok = hay.includes(norm(r.m)); }
      if (ok) {
        let cat = r.c;
        if (cat === 'supplies' && t.date < state.settings.openingDate) cat = 'setup';
        return { cat, who: null, rule: r };
      }
    }
    return { cat: t.amount > 0 ? 'other_in' : 'uncat', who: null };
  }

    // Payroll runs in arrears: paid in the first weeks of a month = pay for the month before.
  function serviceMonth(t) {
    return +t.date.slice(8, 10) >= 20 ? mk(t.date) : addMonths(mk(t.date), -1);
  }

  // ---------- imports ----------
  // Bank lines: de-duplicate by date+amount as a multiset, so the same payment from a PDF and a CSV export isn't counted twice,
  // while two equal payments on the same day inside one file are both kept.
  function importBank(state, txs, statements, src) {
    const existing = {};
    for (const t of live(state.bank)) { const k = t.date + '|' + t.amount; existing[k] = (existing[k] || 0) + 1; }
    const seen = {}; let added = 0, skipped = 0;
    for (const t of txs) {
      const k = t.date + '|' + t.amount; seen[k] = (seen[k] || 0) + 1;
      if (seen[k] <= (existing[k] || 0)) { skipped++; continue; }
      const id = 'b' + hash(k + '|' + t.ref + '|' + t.party) + seen[k];
      state.bank[id] = { id, date: t.date, amount: t.amount, ref: t.ref || '', party: t.party || '', text: t.text || '', st: t.st || null, src, updatedAt: now() };
      added++;
    }
    let stOk = 0, stBad = [];
    for (const s of statements || []) {
      if (s.oldBal === null || s.newBal === null) continue;
      const ok = s.oldBal + s.sum === s.newBal;
      if (ok) stOk++; else stBad.push(s.no);
      state.statements[s.iban + ':' + s.no] = { no: s.no, iban: s.iban, date: s.date, oldBal: s.oldBal, newBal: s.newBal, count: s.count, ok, updatedAt: now() };
    }
    return { added, skipped, statements: (statements || []).length, stOk, stBad };
  }
  function importSales(state, rows, src) {
    let added = 0, skipped = 0;
    for (const r of rows) {
      const id = 's' + r.inv + '_' + r.date + '_' + r.gross;
      if (state.sales[id]) { skipped++; continue; }
      const o = Object.assign({ id, src, updatedAt: now() }, r);
      // keep only a fingerprint of the customer (for trial conversion), never the name
      o.cust = r.customer && !/walkin/i.test(r.customer) ? hash(norm(r.customer).replace(/\s+/g, ' ')) : null;
      delete o.customer;

  }
  function importVouchers(state, rows, src) {
    let added = 0, skipped = 0;
    for (const r of rows) {
      const id = 'v' + r.inv + '_' + r.type + '_' + r.gross;
      if (state.vouchers[id]) { skipped++; continue; }
      state.vouchers[id] = Object.assign({ id, src, updatedAt: now() }, r); added++;

  // Classes: a new export replaces everything inside its date range (schedules change).
  function importClasses(state, rows, src) {
    if (!rows.length) return { added: 0, replaced: 0 };

    const to = rows.reduce((a, r) => (r.date > a ? r.date : a), '0000');
    let replaced = 0;
    for (const c of live(state.classes)) if (c.date >= from && c.date <= to) { c.deleted = true; c.updatedAt = now(); replaced++; }
    const seen = {}; let added = 0;

  // ---------- sales product groups ----------
  const PRODUCT_GROUPS = ['Trial classes', 'Drop-ins', 'Class packs', 'Memberships', 'Promotions', 'Yoga', 'Events & privates', 'Gift vouchers', 'Other'];
  function productGroup(name) {
    const n = norm(name);
    if (/first/.test(n)) return 'Trial classes';
    if (/membership/.test(n)) return 'Memberships';
    if (/summer burn|promo|special/.test(n)) return 'Promotions';
    if (/yoga/.test(n)) return 'Yoga';
    if (/private|brunch|event|workshop|minis|certif|pop.?up/.test(n)) return 'Events & privates';

  // ---------- aggregate everything per month ----------

      mm.sales.byGroup['Gift vouchers'] = mm.sales.byGroup['Gift vouchers'] || { gross: 0, net: 0, count: 0 };
      const g = mm.sales.byGroup['Gift vouchers']; g.gross += v.gross; g.net += v.net; g.count += v.gross > 0 ? 1 : -1;
      mm.sales.gross += v.gross; mm.sales.net += v.net;
    }
    // classes
    const insById = {}; state.settings.instructors.forEach((i) => (insById[i.id] = i));
    for (const c of live(state.classes)) {
      if (c.cancelled || !c.trainer) continue;
      const ins = findInstructor(state, c.trainer);
      if (ins && ins.status === 'excluded') continue;
      const mm = M(mk(c.date));
      const paid = paidIn(ins, mk(c.date));

        b.planned = (b.planned || 0) + 1;
      }
      if (paid) {

        mm.ins.expected += ins.rate || 0;
        const bi = (mm.ins.byIns[ins.id] = mm.ins.byIns[ins.id] || { classes: 0, expected: 0, paid: 0 });
        bi.classes++; bi.expected += ins.rate || 0;
      }
    }
    // months that Eversports doesn't cover yet: use the plan from the Schedule page
    let until = ''; for (const c of live(state.classes)) if (!c.cancelled && c.date > until) until = c.date;
    for (const p of live(state.plans)) {
      if (p.month < mk(today) || !p.classes) continue;
      const mm = M(p.month);
      const cls = Object.values(p.classes).filter((c) => !c.deleted && c.src !== 'ev' && (!until || c.date > until));
      for (const cell of cls) {
        if (!cell || !cell.ins) continue;
        const ins = insById[cell.ins];

        if (paidIn(ins, p.month)) {
          mm.ins.expected += ins.rate || 0;
          const bi = (mm.ins.byIns[ins.id] = mm.ins.byIns[ins.id] || { classes: 0, expected: 0, paid: 0 });

        }

    if (G.LLS) {

  }

  // ---------- key figures & forecast ----------
  function lastFullMonths(agg, n) {
    const cur = mk(agg.today);
    return agg.months.filter((m) => m.m < cur && m.tx > 0).slice(-n);
  }
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);

  function onCostRatio(agg) {
    // actual cash for instructors (net pay + payroll) vs expected gross from classes x rate, over recent complete months
    const ms = lastFullMonths(agg, 4).filter((m) => m.ins.expected > 0 && (m.ins.paidNet + m.ins.payroll) > 0).slice(-3);
    const e = ms.reduce((a, m) => a + m.ins.expected, 0), p = ms.reduce((a, m) => a + m.ins.paidNet + m.ins.payroll, 0);
    return e > 0 ? p / e : 1;
  }

  // ---------- forecast v2 ----------
  const FIXED = ['rent', 'utilities', 'insurance', 'software', 'bank', 'loan_fees', 'license', 'memberships', 'loan_repay'];
  const VARIABLE = ['supplies', 'marketing', 'travel', 'other_out', 'accounting'];
  const evTag = (e) => e.kind !== 'rental' && e.kind !== 'tenant';
  // known rhythm when there's only one payment so far (months)
  const DEFAULT_EVERY = { loan_repay: 1, rent: 1, license: 12, memberships: 12, insurance: 12 };
  const daysIn = (m) => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
  const addDays = (iso, n) => new Date(new Date(iso + 'T12:00:00').getTime() + n * 864e5).toISOString().slice(0, 10);
  // Payments that repeat: same category + payee, with a regular gap (monthly, quarterly, half-yearly, yearly).
  const salesEnd = (state, today) => { let e = ''; for (const x of live(state.sales)) if (x.date > e && x.date <= today) e = x.date; return e || today; };
  function recurring(state, agg) {
    const since = addDays(agg.lastBankDate || agg.today, -400);
    const groups = {};
    for (const t of agg.bank) {
      if (t.amount >= 0 || t.date < since || !FIXED.includes(t._c.cat)) continue;
      const k = t._c.cat + '|' + norm(t.party).replace(/[^a-zäöüß]/g, '').slice(0, 8);
      (groups[k] = groups[k] || []).push(t);
    }
    const out = [];
    for (const [k, list] of Object.entries(groups)) {

      const gaps = list.slice(1).map((t, i) => (new Date(t.date) - new Date(list[i].date)) / 864e5).sort((a, b) => a - b);
      const gap = gaps.length ? gaps[Math.floor(gaps.length / 2)] : null;
      let every = gap === null ? (DEFAULT_EVERY[cat] || null) : gap < 20 ? 0.5 : gap <= 45 ? 1 : gap <= 110 ? 3 : gap <= 200 ? 6 : gap <= 420 ? 12 : null;
      if (cat === 'memberships' || cat === 'license') every = 12;
      if (gap === null && !every) continue; // a single one-off payment doesn't repeat
      const recent = list.slice(-3).map((t) => t.amount);
      const amount = every === 0.5 ? list.filter((t) => t.date > addDays(last.date, -31)).reduce((a, t) => a + t.amount, 0) : recent.sort((a, b) => a - b)[Math.floor(recent.length / 2)];
      if (every === 0.5) every = 1;

        continue;

  }
  const dueIn = (r, m) => {

    return false;
  };
  // VAT (Austria, monthly UVA): payable on the 15th of the second month after. Rough: 1/6 of gross sales and rent income,
  // minus 1/6 of costs that carry Austrian VAT (rent, Eversports fee, utilities, accounting, supplies, build-out).
  const VAT_IN = ['rent', 'platform', 'utilities', 'accounting', 'supplies', 'setup', 'software', 'events_out'];
  function vatFor(state, agg, M, fcCats, startM) {
    const mm = agg.byMonth[M];
    const actual = !fcCats && mm && mm.tx > 0 && M < startM;
    const sales = actual ? mm.sales.gross : fcCats && fcCats._salesGross ? fcCats._salesGross : mm ? mm.sales.gross : 0;
    const cats = actual ? mm.cats : fcCats || {};

    const inVat = VAT_IN.reduce((a, k) => a + Math.max(0, -(cats[k] || 0)), 0) / 6;
    return -(outVat - inVat); // negative = to pay, positive = refund
  }
  // ---------- events: budget ----------
  function eventBudget(state, e, feeRatio) {
    const b = e.budget || {};

    const tickets = price * people;
    const fee = tickets * Math.abs(feeRatio === undefined ? 0.07 : feeRatio);
    const catering = (+b.caterPer || 0) * people + (+b.caterFixed || 0);
    const ins = b.classIns ? state.settings.instructors.find((i) => i.id === b.classIns) : null;
    const instructor = ins && paidIn(ins, mk(e.date || '2000-01-01')) ? (ins.rate || 0) * (+b.classes || 1) : 0;
    const other = (b.other || []).reduce((a, x) => a + (+x.amount || 0), 0) + (+e.cost || 0);

  // one-off events found in Eversports (class names that aren't a regular class type)
  function foundEvents(state) {

  }

    return live(state.bank).filter((x) => x.amount > 0 && x.date >= addDays(t.from, -31) && (!until || x.date <= until) && rx.test(x.party + ' ' + x.text));
  }
  // rent due per month: due on the 1st, the first month pro rata from the start day
  function tenantDue(t, m) {
    const fm = mk(t.from); if (m < fm) return 0;
    if (m === fm) { const d = +t.from.slice(8, 10), n = daysIn(m); return Math.round(t.monthly * (n - d + 1) / n); }
    return t.monthly;
  }
  function tenantStatus(state, t, today) {
    if (!t.from || !t.monthly) return { owed: 0, due: 0, received: 0, months: [] };
    const months = monthRange(mk(t.from), mk(today));
    const due = months.reduce((a, m) => a + tenantDue(t, m), 0);
    const rec = tenantReceived(state, t, today); const received = rec.reduce((a, x) => a + x.amount, 0);
    return { due, received, owed: Math.max(0, due - received), months, payments: rec };
  }
  // expected payments: regular rent from payFrom, plus the back rent as agreed
  function tenantSchedule(state, t, agg) {
    if (!t.from || !t.monthly || !t.payFrom) return [];
    const out = []; const pm = mk(t.payFrom);
    for (let i = 0; i < 6; i++) { const m = addMonths(pm, i); out.push([m + '-01' > t.payFrom ? m + '-01' : t.payFrom, tenantDue(t, m)]); }
    const backDue = monthRange(mk(t.from), addMonths(pm, -1)).reduce((a, m) => a + tenantDue(t, m), 0);
    const back = Math.max(0, backDue - tenantReceived(state, t).reduce((a, x) => a + x.amount, 0));
    const n = Math.max(1, +t.backMonths || 1), start = t.backFrom || t.payFrom;
    if (back > 0 && t.backPlan !== 'none') for (let i = 0; i < n; i++) out.push([addMonths(mk(start), i) + start.slice(7), Math.round(back / n)]);
    return out;
  }
  // tick off open bills when the payment shows up in the bank
  function matchBills(state) {
    const used = new Set(live(state.bills).map((b) => b.txId).filter(Boolean));
    let changed = 0;
    for (const b of live(state.bills)) {
      if (b.paidOn || b.noMatch) continue;
      const words = norm(b.match || b.party).split(/[^a-z0-9äöüß]+/).filter((w) => w.length >= 3);
      const tx = live(state.bank).find((x) => !used.has(x.id) && (b.dir === 'in' ? x.amount > 0 : x.amount < 0) && Math.abs(Math.abs(x.amount) - b.amount) <= Math.max(100, b.amount * 0.01)
        && x.date >= addDays(b.created || b.due || '2000-01-01', -45) && (!words.length || words.some((w) => norm(x.party + ' ' + x.text).includes(w))));
      if (tx) { b.paidOn = tx.date; b.txId = tx.id; b.updatedAt = now(); used.add(tx.id); changed++; }
    }
    return changed;
  }

  function forecast(state, agg, n = 3) {
    const ref = lastFullMonths(agg, 3);
    const ratio = onCostRatio(agg);
    const rec = recurring(state, agg);
    const last = agg.lastBankDate || agg.today, lastM = mk(last), lastDay = +last.slice(8, 10);
    const startM = lastDay >= daysIn(lastM) ? addMonths(lastM, 1) : lastM;
    // income: Eversports sales over the last 6 weeks, as a daily pace; payouts track sales closely
    const sEnd = salesEnd(state, agg.today), t42 = addDays(sEnd, -42);
    const s42 = live(state.sales).filter((x) => x.date > t42 && x.date <= sEnd && !/^voucher$/i.test(x.method)).reduce((a, x) => a + x.gross, 0)
      + live(state.vouchers).filter((x) => x.date > t42 && x.date <= sEnd).reduce((a, x) => a + x.gross, 0);
    const daily = s42 / 42;
    const payoutRatio = (() => { const sg = ref.reduce((a, m) => a + m.sales.gross, 0), po = ref.reduce((a, m) => a + (m.cats.sales || 0), 0); return sg > 0 && po > 0 ? Math.min(1.1, Math.max(0.85, po / sg)) : 0.97; })();
    const feeRatio = (() => { const sg = ref.reduce((a, m) => a + m.sales.gross, 0), f = ref.reduce((a, m) => a + (m.cats.platform || 0), 0); return sg > 0 ? f / sg : -0.06; })();
    const avgCat = {}; for (const k of [...VARIABLE, 'terminal', 'other_in']) avgCat[k] = avg(ref.map((m) => m.cats[k] || 0));
    avgCat.accounting = avg(lastFullMonths(agg, 6).map((m) => m.cats.accounting || 0));
    const insSum = ref.reduce((a, m) => a + (m.cats.instructors || 0), 0), paySum = ref.reduce((a, m) => a + (m.cats.payroll || 0), 0);
    const sI = insSum + paySum !== 0 ? insSum / (insSum + paySum) : 0.8;
    const insAvg = avg(ref.map((m) => (m.cats.instructors || 0) + (m.cats.payroll || 0)));
    const prevEnd = agg.months.find((x) => x.m === addMonths(startM, -1));
    let bal = prevEnd ? prevEnd.end : agg.cash, low = bal, high = bal;
    const out = []; const fcCatsBy = {};
    const sumG = (cats, g) => Object.entries(cats).reduce((a, [k, v]) => a + (CATS[k] && CATS[k].group === g ? v : 0), 0);
    for (let i = 0; i < n; i++) {
      const m = addMonths(startM, i);
      const mm = agg.byMonth[m];
      const prev = agg.byMonth[addMonths(m, -1)];
      const cats = {};
      // sales: what's already sold this month + the pace for the rest
      const soldSoFar = m === mk(sEnd) && mm ? mm.sales.gross : 0;
      const rest = m === mk(sEnd) ? daily * Math.max(0, daysIn(m) - +sEnd.slice(8, 10)) : daily * daysIn(m);
      const salesGross = soldSoFar + rest;
      cats.sales = salesGross * payoutRatio;
      for (const k of ['terminal', 'other_in']) if (avgCat[k]) cats[k] = avgCat[k];
      // fixed payments at their real amount, in the month they're due
      for (const r of rec) if (dueIn(r, m)) cats[r.cat] = (cats[r.cat] || 0) + r.amount;
      // variable costs: average of the last 3 months; Eversports fee as a share of sales
      for (const k of VARIABLE) if (avgCat[k]) cats[k] = avgCat[k];
      cats.platform = salesGross * feeRatio;
      // instructors: planned classes of the month before × rate × (1 + social security), paid this month
      const prevPay = prev ? prev.ins.expected + (prev.ins.est || 0) : 0;
      const plannedIns = prevPay > 0 ? -prevPay * ratio : insAvg;
      cats.instructors = plannedIns * sI; cats.payroll = plannedIns * (1 - sI);
      let partial = false;
      if (m === lastM && mm && mm.tx) {
        // part of this month is already in the bank: actuals + the rest of the month
        partial = true;
        const left = Math.max(0, (daysIn(m) - lastDay) / daysIn(m));
        for (const k of Object.keys(CATS)) {
          const act = mm.cats[k] || 0;
          if (FIXED.includes(k)) cats[k] = act || cats[k] || 0;
          else if (k === 'instructors' || k === 'payroll') cats[k] = act || cats[k] || 0;
          else if (cats[k] !== undefined && (CATS[k].group === 'in' || CATS[k].group === 'out')) cats[k] = act + cats[k] * left;
          else if (act) cats[k] = act;
        }
      }
      // agreed rentals, planned events, tenants and open bills (after the actuals, so they count in full)
      const add = (k, v) => { if (v) cats[k] = (cats[k] || 0) + v; };
      const paidBy = partial ? last : '';
      for (const e of live(state.events || {})) {
        for (const pay of e.payments || []) if (mk(pay.due) === m && pay.due > paidBy) add('rental_in', pay.amount);
        if (evTag(e) && e.date && mk(e.date) === m) {
          const b = eventBudget(state, e, feeRatio);
          if (e.date > sEnd) { add('sales', b.tickets * payoutRatio); add('platform', b.tickets * feeRatio); }
          if (e.date > paidBy) { add('other_in', b.extra); add('events_out', -(b.catering + b.other)); }
        }
      }
      for (const t of live(state.tenants || {})) for (const [due, amt] of tenantSchedule(state, t, agg)) if (mk(due) === m && due > paidBy) add('rental_in', amt);
      for (const b of live(state.bills || {})) {
        if (b.paidOn) continue;
        const dm = b.due && mk(b.due) > startM ? mk(b.due) : startM;
        if (dm === m) add(b.cat || (b.dir === 'in' ? 'other_in' : 'other_out'), b.dir === 'in' ? b.amount : -b.amount);
      }
      cats._salesGross = salesGross;
      fcCatsBy[m] = cats;
      // VAT for the month before last
      if (state.settings.vatMode !== 'off') {
        const vm = addMonths(m, -2);
        const v = vatFor(state, agg, vm, fcCatsBy[vm], startM);
        if (!(partial && mm.cats.vat)) cats.vat = (cats.vat || 0) + v;
      }
      const clean = {}; for (const [k, v] of Object.entries(cats)) if (k[0] !== '_' && Math.round(v)) clean[k] = v;
      const inc = sumG(clean, 'in'), outG = sumG(clean, 'out');
      const cost = outG + sumG(clean, 'fin') + sumG(clean, 'setup') + sumG(clean, 'tax');
      const salesIn = (clean.sales || 0);
      bal += inc + cost; low += inc + cost - salesIn * 0.15; high += inc + cost + salesIn * 0.15;
      out.push({ m, cats: clean, inc, cost, net: inc + cost, op: inc + outG, end: bal, endLow: low, endHigh: high, plannedIns, partial, salesGross, groups: { in: inc, out: outG, setup: sumG(clean, 'setup'), tax: sumG(clean, 'tax'), fin: sumG(clean, 'fin') } });
    }
    const full = out.filter((x) => !x.partial);
    return { months: out, startM, recurring: rec, daily, payoutRatio, feeRatio, ratio, loan: (rec.find((r) => r.cat === 'loan_repay') || {}).amount || 0, avgNet: avg(full.map((x) => x.net)), salesMonth: daily * 30.4 };
  }

  // Share of trial-class buyers who later bought anything else (pack, drop-in, membership...)
  function trialConversion(state) {
    const byCust = {};
    for (const s of live(state.sales)) {
      if (!s.cust || s.gross <= 0 || /^voucher$/i.test(s.method)) continue;
      (byCust[s.cust] = byCust[s.cust] || []).push(s);
    }
    const res = {};
    for (const list of Object.values(byCust)) {
      list.sort((a, b) => (a.date < b.date ? -1 : 1));
      const t = list.find((s) => productGroup(s.product) === 'Trial classes');
      if (!t) continue;
      const m = mk(t.date);
      const r = (res[m] = res[m] || { trials: 0, converted: 0 });
      r.trials++;
      if (list.some((s) => s.date >= t.date && s !== t && productGroup(s.product) !== 'Trial classes')) r.converted++;
    }
    return res;
  }

  // "What to work on": simple rules over sales and class data. Each item: { tone: 'bad'|'good'|'info', title, text }
  function insights(state, agg) {
    const out = [];
    const today = agg.today, cur = mk(today);
    const full = agg.months.filter((m) => m.m < cur && (m.sales.gross > 0));
    const last = full[full.length - 1], prev3 = full.slice(-4, -1);
    const conv = trialConversion(state);
    const pctf = (x) => Math.round(x * 100) + '%';
    const euro = (c) => '€' + Math.round(c / 100).toLocaleString('de-AT');
    // 1. sales pace this month
    const now = agg.byMonth[cur];
    if (now && now.sales.gross > 0 && full.length >= 2) {
      const se = salesEnd(state, today), d = mk(se) === cur ? +se.slice(8, 10) : +today.slice(8, 10), days = new Date(+cur.slice(0, 4), +cur.slice(5, 7), 0).getDate();
      const pace = now.sales.gross * days / d, base = avg(full.slice(-3).map((m) => m.sales.gross));
      const ch = pace / base - 1;
      if (ch < -0.15) out.push({ tone: 'bad', title: `Sales this month are heading ${pctf(-ch)} below average`, text: `${euro(now.sales.gross)} after ${d} days points to about ${euro(pace)} for the month, against ${euro(base)} on average. Fill the gap now rather than at month end: a short offer to past drop-in and trial clients (e.g. a 5-pack deal valid for 10 days), and a push on your fullest class times, where demand is proven.` });
      else if (ch > 0.1) out.push({ tone: 'good', title: `Sales this month are ${pctf(ch)} above average`, text: `On track for about ${euro(pace)}. Look at what you did differently this month and repeat it.` });
    }
    const snap = growthSnapshot(state, today);
    if (snap && snap.funnel) {
      const fm = snap.funnel.byMonth.filter((x) => x.conv30Pct !== null && x.maturedTrials >= 15);
      const l = fm[fm.length - 1], f0 = fm[0];
      if (l && l.conv30Pct < 35) out.push({ tone: 'bad', title: `Only ${Math.round(l.conv30Pct)}% of trial clients buy again within 30 days`, text: `${l.trials} trials in ${l.month.slice(5)}/${l.month.slice(2, 4)}, ${Math.round(l.commit30Pct)}% bought a pack or membership${f0 && f0.conv30Pct > l.conv30Pct + 5 ? ` (it was ${Math.round(f0.conv30Pct)}% at the start)` : ''}. The 48 hours after the first class decide it: a personal message from the instructor and a "first pack" offer that expires within 7 days.` });
    }
    if (snap && snap.retention) {
      const r = snap.retention, bm = r.byMonth, a = bm[bm.length - 2], b = bm[bm.length - 3];
      if (a && b && a.returningCustomers < b.returningCustomers * 0.9) out.push({ tone: 'bad', title: `Returning clients fell from ${b.returningCustomers} to ${a.returningCustomers}`, text: 'Fewer people came back the following month. Check the win-back list on Growth and reach out personally to the ones with the most visits.' });
      if (r.winBack && r.winBack.count) out.push({ tone: 'info', title: `${r.winBack.count} clients to win back`, text: `They booked at least twice but not this month (${r.winBack.strongCount} of them with 3+ visits and silent for two months). A personal message with one free class works better than a newsletter.` });
    }
    // 2. trial follow-up (from sales, if the growth exports aren't imported)
    const cm = snap && snap.funnel ? [] : Object.keys(conv).filter((m) => m < cur && conv[m].trials >= 20).sort();
    if (cm.length >= 2) {
      const l = conv[cm[cm.length - 1]], first = conv[cm[0]];
      const rl = l.converted / l.trials, rf = first.converted / first.trials;
      if (rl < 0.3) out.push({ tone: 'bad', title: `Only ${pctf(rl)} of trial clients buy again`, text: `Trial classes bring people in (${l.trials} in ${cm[cm.length - 1].slice(5)}/${cm[cm.length - 1].slice(2, 4)}), but most don't come back${rf > rl + 0.05 ? ` (it was ${pctf(rf)} at the start)` : ''}. The fix is the 48 hours after the first class: a personal message from the instructor, and a "first pack" offer that expires within 7 days. Each extra 10% who convert is worth roughly ${euro(l.trials * 0.1 * 16900)} a month at a 5-pack.` });
    }
    // 3. product mix: memberships
    if (last) {
      const g = last.sales.byGroup, tot = last.sales.gross || 1;
      const mem = (g['Memberships'] || {}).gross || 0;
      if (mem / tot < 0.15) out.push({ tone: 'bad', title: `Memberships are only ${pctf(mem / tot)} of sales`, text: `Packs and drop-ins pay once; memberships pay every month and make cash flow predictable. Offer every pack buyer an upgrade at their 4th visit, and consider a founding-style membership price for the first 20 sign-ups this season.` });
      // 4. biggest drop by product group vs previous 3 months
      if (prev3.length >= 2) {
        let worst = null;
        for (const name of PRODUCT_GROUPS) {
          if (name === 'Gift vouchers' || name === 'Other') continue;
          const base = avg(prev3.map((m) => ((m.sales.byGroup[name] || {}).gross || 0)));
          const now2 = (g[name] || {}).gross || 0;
          if (base > 30000 && (now2 - base) / base < -0.25 && (!worst || now2 - base < worst.d)) worst = { name, d: now2 - base, base, now2 };
        }
        if (worst) out.push({ tone: 'bad', title: worst.now2 <= 0 ? `${worst.name}: nothing sold last month` : `${worst.name} dropped ${pctf(-worst.d / worst.base)} last month`, text: `${euro(worst.now2)} against ${euro(worst.base)} on average before. ${worst.name === 'Promotions' ? 'The summer offer ended. A winter version (e.g. "3 classes in 3 weeks") brought in up to ' + euro(Math.max(...prev3.map((m) => ((m.sales.byGroup.Promotions || {}).gross || 0)))) + ' a month.' : 'Check whether price, timing or visibility changed, and give it a spotlight in your next posts.'}` });
      }
      // promotions worked before but none running
      const promoBest = Math.max(0, ...full.map((m) => ((m.sales.byGroup.Promotions || {}).gross || 0)));
      if (promoBest > 100000 && !((g.Promotions || {}).gross) && !out.some((o) => /Promotions/.test(o.title))) out.push({ tone: 'info', title: 'No offer running at the moment', text: `Your best promotion month brought in ${euro(promoBest)}. A time-limited offer is your strongest lever when sales dip.` });
    }
    // 5. emptiest and fullest class times (last 8 weeks)
    const since = new Date(new Date(today).getTime() - 56 * 864e5).toISOString().slice(0, 10);
    const slots = {};
    const W = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    for (const c of live(state.classes)) {
      if (c.cancelled || !c.trainer || c.date > today || c.date < since || !c.max || /private/i.test(c.title)) continue;
      const wd = (new Date(c.date + 'T12:00:00').getDay() + 6) % 7;
      const k = W[wd] + ' ' + c.start + ' · ' + c.title;
      const o = (slots[k] = slots[k] || { n: 0, p: 0, cap: 0, wait: 0, wd, start: c.start });
      o.n++; o.p += c.present; o.cap += c.max;
    }
    const list = Object.entries(slots).filter(([, o]) => o.n >= 3).map(([k, o]) => ({ k, fill: o.p / o.cap, avg: o.p / o.n, o }));
    if (list.length >= 6 && !(snap && snap.occupancy && snap.funnel)) {
      list.sort((a, b) => a.fill - b.fill);
      const low = list.slice(0, 3), high = list.slice(-3).reverse();
      out.push({ tone: 'info', title: 'Emptiest class times (last 8 weeks)', text: low.map((x) => `${x.k}: ${x.avg.toFixed(1).replace('.', ',')} guests on average (${pctf(x.fill)} full)`).join(' · ') + '. Either cut or move these, or give them a reason to come (a themed class, a "bring a friend" slot).' });
      out.push({ tone: 'good', title: 'Fullest class times', text: high.map((x) => `${x.k}: ${pctf(x.fill)} full`).join(' · ') + '. Demand is proven here: these are the times to add a class next to, and to feature in ads.' });
    }
    // 6. refunds
    if (last && last.sales.refunds < 0 && -last.sales.refunds / (last.sales.gross || 1) > 0.03) out.push({ tone: 'info', title: `Refunds were ${pctf(-last.sales.refunds / last.sales.gross)} of sales last month`, text: 'Worth a look at why: late cancellations, double bookings or unhappy first-timers?' });
    return out;
  }

  // ---------- growth (needs growth-kpis module + the two extra Eversports exports) ----------
  let gCache = { key: null, snap: null };
  function growthSnapshot(state, today) {
    const GK = G.GrowthKPIs; if (!GK) return null;
    const pr = state.growth && state.growth.products, cu = state.growth && state.growth.customers;
    const key = [pr && pr.updatedAt, cu && cu.updatedAt, Object.keys(state.classes).length, Object.keys(state.sales).length, today].join('|');
    if (gCache.key === key) return gCache.snap;
    const asOf = new Date(today + 'T23:00:00Z');
    const dmyS = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4);
    const out = { asOf: today };
    try {
      if (pr && pr.text) { const rows = GK.parseCSV(pr.text); out.funnel = GK.trialFunnel(rows, asOf); out.productUsage = GK.productUsage(rows); }
      if (cu && cu.text) out.retention = GK.retention(GK.parseCSV(cu.text), asOf);
      const cls = live(state.classes).filter((c) => !c.cancelled && c.date <= today).map((c) => ({ 'Date': dmyS(c.date), 'Start time': c.start, 'Title': c.title, 'Trainer': c.trainer || '', 'Registered': String(c.registered), 'Present': String(c.present), 'Max. participants': String(c.max) }));
      if (cls.length) out.occupancy = GK.occupancy(cls, asOf);
      const sales = live(state.sales).map((x) => ({ 'Paid At': x.date, 'Product Name': x.product, 'Paid Gross': String(x.gross / 100), 'Paid Net': String(x.net / 100) }));
      if (sales.length) out.revenue = GK.revenueMix(sales);
    } catch (e) { out.error = e.message; }
    gCache = { key, snap: out };
    return out;
  }

  // Meta ads report (by age & gender)
  function adsSummary(state) {
    const a = state.growth && state.growth.ads; if (!a || !a.text || !G.LLParse) return null;
    const rows = G.LLParse.parseCSV(a.text);
    const n = (v) => parseFloat(String(v || '').replace(/,/g, '')) || 0;
    const t = { spend: 0, reach: 0, impressions: 0, clicks: 0, lpv: 0, target: 0, from: null, to: null };
    for (const r of rows) {
      const sp = n(r['Amount spent (EUR)'] || r['Amount spent']);
      t.spend += sp; t.reach += n(r['Reach']); t.impressions += n(r['Impressions']); t.clicks += n(r['Link clicks']); t.lpv += n(r['Website landing page views']);
      if (/female|weiblich/i.test(r['Gender'] || '') && /25-34|35-44|45-54/.test(r['Age'] || '')) t.target += sp;
      t.from = r['Reporting starts'] || t.from; t.to = r['Reporting ends'] || t.to;
    }
    t.cpc = t.clicks ? t.spend / t.clicks : null; t.lpvRate = t.clicks ? t.lpv / t.clicks : null; t.outsideTarget = t.spend ? 1 - t.target / t.spend : null;
    return t;
  }

  // event ideas that follow from the numbers (each says why)
  function eventIdeas(state, agg, snap) {
    const out = []; const cur = mk(agg.today);
    const full = agg.months.filter((m) => m.m < cur && m.sales.gross > 0);
    const last = full[full.length - 1];
    const conv = trialConversion(state);
    const cm = Object.keys(conv).filter((m) => m < cur && conv[m].trials >= 20).sort();
    const lc = cm.length ? conv[cm[cm.length - 1]] : null;
    const f = snap && snap.funnel && snap.funnel.byMonth.filter((x) => x.conv30Pct !== null).slice(-1)[0];
    const convPct = f ? f.conv30Pct / 100 : lc ? lc.converted / lc.trials : null;
    if (convPct !== null && convPct < 0.3) out.push({ id: 'x-friend', title: 'Bring-a-friend Saturday', why: `Only ${Math.round(convPct * 100)}% of trial clients buy again. People who come with a friend come back more often, and every regular brings a new trial.` });
    const wb = snap && snap.retention && snap.retention.winBack;
    if (wb && wb.count) out.push({ id: 'x-winback', title: 'Welcome-back class', why: `${wb.count} people came at least twice but not this month. A personal invite to one free "welcome back" class is the cheapest way to win them back (the list is on Growth).` });
    const promoBest = Math.max(0, ...full.map((m) => ((m.sales.byGroup.Promotions || {}).gross || 0)));
    if (promoBest > 100000 && last && !((last.sales.byGroup.Promotions || {}).gross)) out.push({ id: 'x-winter', title: 'Winter challenge (e.g. 12 classes in 6 weeks)', why: `Your summer offer brought in up to €${Math.round(promoBest / 100).toLocaleString('de-AT')} a month, and nothing is running now. A challenge with a finish-line event gives people a reason to book every week.` });
    const mem = last ? ((last.sales.byGroup.Memberships || {}).gross || 0) / (last.sales.gross || 1) : 1;

<script>
/*
 * Lab Ledger – Growth KPIs
 * ------------------------------------------------------------
 * Turns raw Eversports CSV exports into the monthly growth numbers
 * for The Lagree Lab. No dependencies; runs in the browser (drop into
 * the Lab Ledger single-file app) and in Node (for testing).
 *
 * Supported exports (auto-detected from their header row):
 *   products     Products > Analysis > "Export activity & booking data"
 *                (one row per sold product, incl. "Number of participations")
 *   utilization  Analytics > Reports > "Utilization report" (one row per class)
 *   customers    Analytics > Reports > "Customers with bookings" (bookings per month)
 *   revenue      Financials > "Revenue report (based on income & expenses)"
 *
 * Main entry point:  GrowthKPIs.buildSnapshot({ products, utilization, customers, revenue }, { asOf })
 * Each input is the raw CSV text (any may be omitted).
 */
(function (root) {
  'use strict';

  // ---------- config: tweak here, not in the logic ----------
  const CONFIG = {
    trialProduct: 'First Lagree Class',
    // products that are not a "real" purchase after the trial
    nonPaidProducts: ['First Lagree Class', 'Opening Day Mini Burn', '824 Get-Together – Free Session', 'The Lagree Lab - Gift Card'],
    // a purchase counts as a commitment (pack or membership) if its name matches
    commitmentPattern: /^(5|10|20) |Membership/i,
    conversionWindowDays: 30,
    regularClassTitles: ['Lagree Burn', 'Latino Burn'], // used for occupancy; specials/events excluded
    recentWeeks: 8, // window for time-slot and trainer tables
    regularThreshold: 4, // bookings in a month to count as a "regular"
  };

  // ---------- CSV ----------
  function parseCSV(text) {
    text = String(text || '').replace(/^﻿/, '');
    const firstLine = text.split(/\r?\n/, 1)[0];
    const delim = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ';' : ',';
    const rows = [];
    let row = [], field = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(field); field = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else field += ch;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    const head = rows.shift().map(h => h.trim());
    return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
  }

  function detectReport(rows) {
    const h = rows.length ? Object.keys(rows[0]) : [];
    if (h.includes('Number of participations')) return 'products';
    if (h.includes('Max. participants')) return 'utilization';
    if (h.includes('Total bookings in timeframe')) return 'customers';
    if (h.includes('Paid Gross')) return 'revenue';
    return 'unknown';
  }

  // ---------- helpers ----------
  const num = s => { const n = parseFloat(String(s).replace(/,/g, '')); return isNaN(n) ? 0 : n; };
  const pad = n => String(n).padStart(2, '0');
