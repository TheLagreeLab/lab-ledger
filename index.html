    const m = String(s).match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);
    return m ? new Date(Date.UTC(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0))) : null;
  }
  const ym = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}`;
  const days = (a, b) => (b - a) / 86400000;
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const round = (x, d = 1) => Math.round(x * 10 ** d) / 10 ** d;
  const pct = (a, b) => (b ? round((100 * a) / b, 1) : null);
  function groupBy(arr, key) { const m = new Map(); for (const x of arr) { const k = key(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }

  // ---------- 1. Trial funnel (products export) ----------
  function trialFunnel(rows, asOf) {
    const items = rows.map(r => ({
      name: r['Name'].trim(), email: (r['E-mail'] || '').toLowerCase().trim(),
      ts: dmy(r['Purchased on']), used: num(r['Number of participations']),
    })).filter(x => x.email && x.ts);
    const trials = items.filter(x => x.name === CONFIG.trialProduct);
    const paid = items.filter(x => !CONFIG.nonPaidProducts.includes(x.name));
    const paidBy = groupBy(paid, x => x.email);
    const trialBy = groupBy(trials, x => x.email);

    const people = [...trialBy].map(([email, ts]) => {
      const first = ts.reduce((a, b) => (a.ts <= b.ts ? a : b));
      const later = (paidBy.get(email) || []).filter(p => p.ts >= first.ts).sort((a, b) => a.ts - b.ts);
      const next = later[0];
      const d = next ? days(first.ts, next.ts) : null;
      return {
        email, month: ym(first.ts), trialDate: first.ts,
        attended: ts.some(t => t.used > 0),
        convertedEver: !!next,
        converted30: !!next && d <= CONFIG.conversionWindowDays,
        committed30: later.some(p => CONFIG.commitmentPattern.test(p.name) && days(first.ts, p.ts) <= CONFIG.conversionWindowDays),
        nextProduct: next ? next.name : null, daysToNext: d,
      };
    });

    // a cohort is "mature" once every trial in it is older than the window
    const byMonth = [...groupBy(people, p => p.month)].sort().map(([month, ps]) => {
      const matured = ps.filter(p => days(p.trialDate, asOf) >= CONFIG.conversionWindowDays);
      return {
        month, trials: ps.length,
        attendedPct: pct(ps.filter(p => p.attended).length, ps.length),
        conv30Pct: pct(matured.filter(p => p.converted30).length, matured.length),
        commit30Pct: pct(matured.filter(p => p.committed30).length, matured.length),
        maturedTrials: matured.length,
      };
    });
    const nextProducts = {};
    people.filter(p => p.converted30).forEach(p => { nextProducts[p.nextProduct] = (nextProducts[p.nextProduct] || 0) + 1; });
    const conv = people.filter(p => p.convertedEver).map(p => p.daysToNext).sort((a, b) => a - b);
    return {
      totalTrials: people.length,
      attendedPct: pct(people.filter(p => p.attended).length, people.length),
      convertedEverPct: pct(conv.length, people.length),
      medianDaysToSecondPurchase: conv.length ? round(conv[Math.floor(conv.length / 2)], 0) : null,
      byMonth, nextProducts,
    };
  }

  // ---------- 2. Pack usage + intro promos (products export) ----------
  function productUsage(rows) {
    const g = groupBy(rows.map(r => ({ name: r['Name'].trim(), used: num(r['Number of participations']), left: num(r['Remaining units']), status: r['Status'] })), x => x.name);
    return [...g].map(([name, xs]) => ({
      name, sold: xs.length, avgUsed: round(xs.reduce((s, x) => s + x.used, 0) / xs.length, 2),
      unitsOutstanding: xs.filter(x => /^active$/i.test(x.status)).reduce((s, x) => s + x.left, 0),
    })).sort((a, b) => b.sold - a.sold);
  }

  // ---------- 3. Occupancy (utilization export) ----------
  function occupancy(rows, asOf) {
    const cls = rows.map(r => ({
      date: dmy(r['Date']), time: (r['Start time'] || '').slice(0, 5), title: r['Title'].trim(),
      trainer: r['Trainer'].replace(/\s*-\s*(ENG|DE)$/i, '').trim(), lang: (r['Trainer'].match(/(ENG|DE)$/) || [''])[0],
      reg: num(r['Registered']), present: num(r['Present']), cap: num(r['Max. participants']),
    })).filter(c => c.date && c.cap > 1 && CONFIG.regularClassTitles.includes(c.title));
    const summarise = cs => ({
      classes: cs.length,
      avgBooked: round(cs.reduce((s, c) => s + c.reg, 0) / (cs.length || 1), 1),
      occupancyPct: pct(cs.reduce((s, c) => s + c.reg, 0), cs.reduce((s, c) => s + c.cap, 0)),
      nearlyEmptyPct: pct(cs.filter(c => c.reg <= 2).length, cs.length),
    });
    const since = new Date(asOf - CONFIG.recentWeeks * 7 * 86400000);
    const recent = cls.filter(c => c.date >= since);
    const table = (cs, key) => [...groupBy(cs, key)].map(([k, v]) => ({ key: k, ...summarise(v) })).sort((a, b) => b.avgBooked - a.avgBooked);
    const reg = cls.reduce((s, c) => s + c.reg, 0);
    return {
      overall: summarise(cls),
      noShowPct: pct(reg - cls.reduce((s, c) => s + c.present, 0), reg),
      classesPerWeekRecent: round(recent.length / CONFIG.recentWeeks, 1),
      byMonth: table(cls, c => ym(c.date)).sort((a, b) => a.key.localeCompare(b.key)),
      recentBySlot: table(recent, c => `${WD[c.date.getUTCDay()]} ${c.time}`),
      recentByTime: table(recent, c => c.time),
      recentByWeekday: table(recent, c => WD[c.date.getUTCDay()]),
      recentByTrainer: table(recent, c => c.trainer),
      recentByFormat: table(recent, c => c.title),
    };
  }

  // ---------- 4. Customers & retention (customers export) ----------
  function retention(rows, asOf) {
    // bookings in future months are pre-bookings, so only months up to asOf count
    const months = MONTHS.filter((m, i) => rows.length && (m + ' Bookings') in rows[0] && i <= asOf.getUTCMonth());
    const cs = rows.map(r => ({
      name: `${r['First Name']} ${r['Last Name']}`.replace(/\s+/g, ' ').trim(), email: (r['Email'] || '').toLowerCase(),
      newsletter: /^yes$/i.test(r['Accepts Newsletter']),
      total: num(r['Total bookings in timeframe']),
      m: Object.fromEntries(months.map(m => [m, num(r[m + ' Bookings'])])),
    })).filter(c => c.total > 0);
    const active = months.filter(m => cs.some(c => c.m[m] > 0));
    cs.forEach(c => { c.first = active.find(m => c.m[m] > 0); c.last = [...active].reverse().find(m => c.m[m] > 0); });
    const byMonth = active.map(m => {
      const act = cs.filter(c => c.m[m] > 0), nw = act.filter(c => c.first === m);
      return {
        month: m, activeCustomers: act.length, newCustomers: nw.length, returningCustomers: act.length - nw.length,
        bookings: act.reduce((s, c) => s + c.m[m], 0), regulars: act.filter(c => c.m[m] >= CONFIG.regularThreshold).length,
      };
    });
    const cohorts = active.map((m, i) => {
      const co = cs.filter(c => c.first === m);
      return { cohort: m, size: co.length, activePctByMonth: active.slice(i).map(x => pct(co.filter(c => c.m[x] > 0).length, co.length)) };
    });

    const lapsed = cs.filter(c => c.total >= 2 && c.m[lastM] === 0).sort((a, b) => b.total - a.total);
    return {
      customersWithBookings: cs.length,
      oneVisitOnlyPct: pct(cs.filter(c => c.total === 1).length, cs.length),
      newsletterOptInPct: pct(cs.filter(c => c.newsletter).length, cs.length),
      byMonth, cohorts,
      winBack: {
        note: `2+ bookings overall, none in ${lastM}`,
        count: lapsed.length,
        strongCount: lapsed.filter(c => c.total >= 3 && c.m[prevM] === 0).length, // 3+ bookings, silent for 2 months
        list: lapsed.map(c => ({ name: c.name, email: c.email, totalBookings: c.total, lastActive: c.last, newsletter: c.newsletter })),
      },
    };
  }

  // ---------- 5. Revenue mix (revenue export) ----------
  function categorise(p) {
    if (p === CONFIG.trialProduct) return 'Trial';
    if (/Summer Burn/i.test(p)) return 'Intro promo';
    if (/Membership/i.test(p)) return 'Membership';
    if (/^(3|5|10|20) /.test(p)) return 'Pack';
    if (/^1 |Yoga with|Minis/i.test(p)) return 'Drop-in';
    if (/Gift/i.test(p)) return 'Gift card';
    return 'Other';
  }
  function revenueMix(rows) {
    const rs = rows.filter(r => /^\d{4}-\d{2}/.test(r['Paid At'])).map(r => ({
      month: r['Paid At'].slice(0, 7), product: r['Product Name'].trim(), gross: num(r['Paid Gross']), net: num(r['Paid Net']),
    }));
    const byMonth = [...groupBy(rs, r => r.month)].sort().map(([month, xs]) => {
      const cats = {};
      xs.forEach(x => { const c = categorise(x.product); cats[c] = round((cats[c] || 0) + x.gross, 2); });
      return { month, gross: round(xs.reduce((s, x) => s + x.gross, 0), 0), net: round(xs.reduce((s, x) => s + x.net, 0), 0), byCategory: cats };
    });
    // how often packs are sold below list price (list = most expensive price seen)
    const packs = rs.filter(r => /^(5|10|20) /.test(r.product) && r.gross > 0);
    const list = {};
    packs.forEach(p => { list[p.product] = Math.max(list[p.product] || 0, p.gross); });
    return { byMonth, packsSoldBelowListPct: pct(packs.filter(p => p.gross < list[p.product] - 0.01).length, packs.length) };
  }

  // ---------- snapshot ----------
  function buildSnapshot(csv, opts = {}) {
    const asOf = opts.asOf ? new Date(opts.asOf) : new Date();
    const out = { asOf: asOf.toISOString().slice(0, 10) };

      if (!text) continue;
      const rows = parseCSV(text);

  const api = { CONFIG, parseCSV, detectReport, trialFunnel, productUsage, occupancy, retention, revenueMix, buildSnapshot };

  else root.GrowthKPIs = api;
})(typeof window !== 'undefined' ? window : globalThis);

(function (G) {

  const rangeOf = (t) => { const m = String(t).match(/(\d{1,2})(?:[:.](\d{2}))?\s*[-–]\s*(\d{1,2})(?:[:.](\d{2}))?/); if (!m) return null; const a = +m[1] * 60 + +(m[2] || 0), b = +m[3] * 60 + +(m[4] || 0); return b > a ? a + '-' + b : null; };

  // ---------- Google Form answers ----------

  // ---------- the Google Form, built from the current timetable ----------

/* Lab Ledger — end-to-end encrypted sync through a private GitHub Gist.
   Data is gzipped and encrypted (AES-256-GCM, key from passphrase via PBKDF2) on the device. GitHub only ever sees ciphertext. */
(function (G) {
  'use strict';
  const KEY = 'labledger:sync:v1';
  const FILE = 'labledger.json';
  const API = 'https://api.github.com/gists';
  const b64 = (buf) => { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function gzip(str) {
    if (typeof CompressionStream === 'undefined') return { z: false, data: new TextEncoder().encode(str) };
    const cs = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
    return { z: true, data: new Uint8Array(await new Response(cs).arrayBuffer()) };
  }
  async function gunzip(bytes) {
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(ds).text();
  }
  async function deriveKey(pass, salt) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  }

  const saveCfg = (c) => { try { c ? localStorage.setItem(KEY, JSON.stringify(c)) : localStorage.removeItem(KEY); } catch (e) {} };
  async function keyFromCfg(c) { return crypto.subtle.importKey('raw', unb64(c.key), 'AES-GCM', false, ['encrypt', 'decrypt']); }

  async function encrypt(obj, key, saltB64) {
    const { z, data } = await gzip(JSON.stringify(obj));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
    return JSON.stringify({ app: 'lab-ledger', v: 1, z, salt: saltB64, iv: b64(iv), ct: b64(ct) });
  }
  async function decrypt(text, key) {
    const f = JSON.parse(text);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(f.iv) }, key, unb64(f.ct));
    return JSON.parse(f.z ? await gunzip(new Uint8Array(pt)) : new TextDecoder().decode(pt));
  }
  async function gh(token, url, opts = {}) {
    const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }, opts.headers || {}) }));
    if (!r.ok) {
      const msg = r.status === 401 ? 'GitHub refused the token (check it, and that it has the "gist" permission).'
        : r.status === 404 ? 'Sync file not found. Check the Sync ID and that the token belongs to the studio GitHub account.'
        : r.status === 403 ? 'GitHub says slow down (rate limit). Try again in a few minutes.' : 'GitHub error ' + r.status;
      throw new Error(msg);
    }
    return r.json();
  }
  async function readFile(token, gist) {
    const f = gist.files && gist.files[FILE];
    if (!f) throw new Error('This gist is not a Lab Ledger sync file.');
    if (!f.truncated) return f.content;
    const r = await fetch(f.raw_url); return r.text();
  }

  const Sync = {
    cfg, FILE,
    on: () => !!cfg(),
    async create(token, pass, state) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveKey(pass, salt);
      const content = await encrypt(state, key, b64(salt));
      const g = await gh(token, API, { method: 'POST', body: JSON.stringify({ description: 'Lab Ledger (encrypted)', public: false, files: { [FILE]: { content } } }) });
      saveCfg({ token, gistId: g.id, salt: b64(salt), key: b64(await crypto.subtle.exportKey('raw', key)), last: Date.now() });
      return g.id;
    },
    async connect(token, gistId, pass) {
      const g = await gh(token, API + '/' + gistId.trim());
      const text = await readFile(token, g);
      const f = JSON.parse(text);
      const key = await deriveKey(pass, unb64(f.salt));
      let remote;
      try { remote = await decrypt(text, key); } catch (e) { throw new Error('Wrong passphrase.'); }
      saveCfg({ token, gistId: g.id, salt: f.salt, key: b64(await crypto.subtle.exportKey('raw', key)), last: Date.now() });
      return remote;
    },
    async pull() {
      const c = cfg(); if (!c) return null;
      const g = await gh(c.token, API + '/' + c.gistId);
      return decrypt(await readFile(c.token, g), await keyFromCfg(c));
    },
    async push(state) {
      const c = cfg(); if (!c) return;
      const content = await encrypt(state, await keyFromCfg(c), c.salt);
      await gh(c.token, API + '/' + c.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [FILE]: { content } } }) });
      c.last = Date.now(); saveCfg(c);
    },
    disconnect() { saveCfg(null); },
    // merge two states: per record, the newer edit wins
    merge(a, b) {
      if (!b) return a;
      const out = JSON.parse(JSON.stringify(a));
      for (const k of LL.COLLS) {
        out[k] = out[k] || {};
        for (const [id, r] of Object.entries(b[k] || {})) {
          const l = out[k][id];
          if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) out[k][id] = r;
        }

      if (b.settings && (b.settings.updatedAt || 0) > ((out.settings && out.settings.updatedAt) || 0)) out.settings = b.settings;

    },

    const runTxt = runway === Infinity ? 'Cash positive' : runway < 1 ? 'Under 1 month' : `≈ ${runway < 10 ? runway.toFixed(1).replace('.', ',') : Math.round(runway)} months`;
    const bufGap = agg.cash - kf.buffer;
    const lowPoint = fc.months.find((m) => m.end < 0);
    const attn = attention(kf);
    return `
    <div class="tiles">
      <div class="tile hero">
        <div class="label">Cash in the bank${help('Balance of the business account on the last day you have bank data for. Import the latest statement to update it.')}</div>
        <div class="big">${eur(agg.cash)}</div>
        <div class="sub">on ${dmy(agg.lastBankDate)}${agg.statementsOk ? ` · <span class="okc">✓ matches ${agg.statementCount} statements</span>` : ' · <span class="negc">check statements</span>'}</div>
      </div>
      <div class="tile">
        <div class="label">${last ? mName(last.m, true) : 'Last month'} result${help('Money in (Eversports payouts, card terminal, other income) minus running costs. Build-out, tax office and loan money are left out so you see how the studio itself is doing.')}</div>
        <div class="big ${cls(last ? last.op : 0)}">${last ? eurS(last.op) : '—'}</div>
        <div class="sub">${last ? `${eur(last.groups.in)} in · ${eur(-last.groups.out)} out` : ''}${prev && prev.tx ? ` · ${mName(prev.m)}: ${eurS(prev.op)}` : ''}</div>
      </div>
      <div class="tile">
        <div class="label">Runway${help('How long the cash lasts at the pace expected for the next months: running costs, instructor pay from the Eversports schedule, and the loan repayment, against average income.')}</div>
        <div class="big ${runway < 3 ? 'negc' : runway < 6 ? 'warnc' : ''}">${runTxt}</div>
        <div class="sub">${fc.avgNet < 0 ? `expected ${eur(fc.avgNet)} a month incl. loan` : 'income covers costs and loan'}</div>
      </div>
      <div class="tile">
        <div class="label">Safety buffer${help(`Target: ${state.settings.bufferMonths} months of running costs in the bank (change it in Settings).`)}</div>
        <div class="big ${bufGap < 0 ? 'warnc' : 'okc'}">${bufGap < 0 ? eur(bufGap) : 'Covered'}</div>
        <div class="sub">target ${eur(kf.buffer)} (${state.settings.bufferMonths} × ${eur(kf.fixed)})</div>
      </div>
    </div>

    ${attn.length ? `<div class="card attn"><h2>Needs a look</h2><ul>${attn.map((a) => `<li>${a}</li>`).join('')}</ul></div>` : ''}
    ${openMoneyCard()}
    ${insightsCard(LL.insights(state, agg), true)}

    <div class="grid2">
      <div class="card">
        <h2>Money in vs running costs${help('Per month since opening. Running costs include rent, instructors, social security, fees and supplies. Build-out, VAT refunds and loan money are not included.')}</h2>
        <div class="legend"><span><i class="sw sw-in"></i>Money in</span><span><i class="sw sw-out"></i>Running costs</span></div>
        ${barsInOut(opMonths().filter((m) => m.tx > 0))}
      </div>
      <div class="card">
        <h2>Cash in the bank${help('Month-end balance from shortly before opening, then the forecast (dashed). The full history since the account was opened is under Cash flow → Whole history.')}</h2>
        ${lineCash(agg.months.filter((m) => m.m <= LL.mk(agg.lastBankDate || today()) && m.m >= LL.addMonths(LL.mk(state.settings.openingDate), -2)), fc.months)}
      </div>
    </div>

    <div class="card">
      <h2>Next months${help('Sales: your Eversports sales pace of the last 6 weeks, paid out after the Eversports fee. Fixed costs (rent, insurance, loan, software …) at their real amount in the month they are usually due; yearly bills only in their month. Variable costs: average of recent months. Instructors: last month\'s pay plus social security. VAT: estimated from sales minus VAT on costs, due on the 15th of the second month after. Events and room rentals: their agreed payments. The range shows sales 15% lower or higher.')}</h2>
      <div class="tablewrap"><table class="t">
        <thead><tr><th>Month</th><th class="r">In</th><th class="r">Out</th><th class="r hide-sm">Result</th><th class="r">Cash at end</th><th class="r hide-sm">Range</th></tr></thead>
        <tbody>${fc.months.map((f) => `<tr><td class="nw">${mName(f.m)}${f.partial ? ' <span class="muted small">(partly actual)</span>' : ''}</td><td class="r">${eur(f.inc)}</td><td class="r">${eur(f.cost)}</td><td class="r hide-sm ${cls(f.net)}">${eurS(f.net)}</td><td class="r ${f.end < 0 ? 'negc b' : ''}">${eur(f.end)}</td><td class="r hide-sm muted small nw">${eur(f.endLow)} to ${eur(f.endHigh)}</td></tr>`).join('')}</tbody>
      </table></div>
      <p class="muted small">Sales pace: ${eur(Math.round(fc.daily || 0))} a day (last 6 weeks). Includes the loan repayment of ${eur(-fc.loan)} a month${fc.loan ? '' : ' (none seen yet)'}, instructor social security at ${pct(fc.ratio - 1)} on top of class pay${state.settings.vatMode === 'off' ? '' : ', and VAT filed monthly'}. ${lowPoint ? `<b class="negc">At this pace the account goes below zero in ${mName(lowPoint.m, true)}.</b>` : ''}</p>
      ${fcDetails(fc)}
    </div>`;
  }
  function fcDetails(fc) {
    const rec = (fc.recurring || []).filter((r) => r.amount).slice().sort((a, b) => a.amount - b.amount);
    if (!rec.length) return '';
    const every = (n) => ({ 0: 'irregular, averaged', 1: 'monthly', 3: 'every 3 months', 6: 'every 6 months', 12: 'yearly' }[n] || `every ${n} months`);
    return `<details class="mt"><summary class="small"><b>Regular payments the forecast uses (${rec.length})</b></summary><div class="tablewrap"><table class="t"><tbody>${rec.map((r) => `<tr><td>${esc(r.label || r.party || r.cat)}<div class="muted small">${esc((LL.CATS[r.cat] || {}).label || r.cat)} · ${every(r.every)}</div></td><td class="r nw">${eur(r.amount)}</td></tr>`).join('')}</tbody></table></div></details>`;
  }
  function openMoneyCard() {
    const t = today();
    const bills = LL.live(state.bills);
    const owe = bills.filter((b) => b.dir !== 'in' && !b.paidOn).sort((a, b) => (a.due || '9') < (b.due || '9') ? -1 : 1);
    const inBills = bills.filter((b) => b.dir === 'in' && !b.paidOn);
    const tenants = LL.live(state.tenants).filter((x) => x.from && x.monthly).map((x) => ({ x, st: LL.tenantStatus(state, x, t) })).filter((y) => y.st.owed > 0);
    const paid = bills.filter((b) => b.paidOn).sort((a, b) => (a.paidOn < b.paidOn ? 1 : -1)).slice(0, 6);
    const due = (b) => (b.due ? (b.due < t ? `<span class="negc">overdue since ${dmy(b.due)}</span>` : `due ${dmy(b.due)}`) : 'no due date (counted this month)');
    const sumOwe = owe.reduce((a, b) => a + b.amount, 0), sumIn = inBills.reduce((a, b) => a + b.amount, 0) + tenants.reduce((a, y) => a + y.st.owed, 0);
    const row = (b) => `<button class="omrow" data-act="editBill" data-id="${b.id}"><span><b>${esc(b.party || 'Invoice')}</b>${b.note ? ` <span class="muted small">· ${esc(b.note)}</span>` : ''}<br><span class="small muted">${due(b)} · ${esc((CATS[b.cat] || {}).label || '')}</span></span><span class="b">${eur(b.amount)}</span></button>`;
    return `<div class="card" data-box="openmoney">
      <div class="row between wrap"><h2>Open money${help('Invoices you still have to pay, and money others owe you. Open invoices go into the forecast in the month they are due (overdue ones this month). When the payment shows up in a bank statement, it is ticked off automatically.')}</h2>
        <div class="row gap"><button class="btn sm primary" data-act="newBill" data-v="out">+ Invoice to pay</button><button class="btn sm" data-act="newBill" data-v="in">+ Money owed to us</button></div></div>
      <div class="grid2 inner">
        <div><h3>We owe · ${eur(sumOwe)}</h3>${owe.map(row).join('') || '<p class="muted small">No open invoices.</p>'}</div>
        <div><h3>Owed to us · ${eur(sumIn)}</h3>
          ${tenants.map(({ x, st }) => `<button class="omrow" data-act="editTenant" data-id="${x.id}"><span><b>${esc(x.name)} · rent</b><br><span class="small muted">${eur(x.monthly)} a month since ${dmy(x.from)} · received ${eur(st.received)}${x.payFrom ? ` · pays from ${dmy(x.payFrom)}` : ' · <span class="warnc">no payment date agreed yet (not in forecast)</span>'}</span></span><span class="b warnc">${eur(st.owed)}</span></button>`).join('')}
          ${inBills.map(row).join('')}${!tenants.length && !inBills.length ? '<p class="muted small">Nothing open.</p>' : ''}</div>
      </div>
      ${paid.length ? `<details class="mt"><summary class="small muted">Paid recently (${paid.length})</summary>${paid.map((b) => `<button class="omrow dim" data-act="editBill" data-id="${b.id}"><span>${esc(b.party)}<br><span class="small okc">✓ ${b.dir === 'in' ? 'received' : 'paid'} ${dmy(b.paidOn)}</span></span><span>${eur(b.amount)}</span></button>`).join('')}</details>` : ''}
    </div>`;
  }
  const money = (v) => Math.round(parseFloat(String(v || '').replace(/\s|€/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')) * 100) || 0;
  const money2 = (c) => (c ? nf2.format(c / 100) : '');
  function billEditor(b, dir) {
    const isNew = !b; b = b || { dir: dir || 'out', party: '', note: '', amount: 0, due: '', cat: dir === 'in' ? 'other_in' : 'other_out', match: '' };
    const cats = Object.entries(CATS).filter(([k, c]) => (b.dir === 'in' ? c.group === 'in' : ['out', 'setup', 'tax', 'fin'].includes(c.group)) && k !== 'uncat');
    return `<h2>${isNew ? (b.dir === 'in' ? 'Money owed to us' : 'Invoice to pay') : b.dir === 'in' ? 'Money owed to us' : 'Invoice'}</h2>
      <label class="fld">${b.dir === 'in' ? 'From' : 'To (supplier)'}<input class="in" id="biParty" value="${esc(b.party)}" placeholder="${b.dir === 'in' ? 'e.g. a partner' : 'e.g. Steuerberater'}"></label>
      <label class="fld">What for <span class="muted small">(optional)</span><input class="in" id="biNote" value="${esc(b.note || '')}" placeholder="e.g. invoice 2026-114"></label>
      <div class="row gap"><label class="fld grow">Amount €<input class="in" id="biAmt" inputmode="decimal" value="${money2(b.amount)}"></label><label class="fld grow">Due date<input class="in" type="date" id="biDue" value="${b.due || ''}"></label></div>
      <label class="fld">Category<select class="in" id="biCat">${cats.map(([k, c]) => `<option value="${k}"${b.cat === k ? ' selected' : ''}>${c.label}</option>`).join('')}</select></label>
      <label class="fld">Name on the bank statement <span class="muted small">(optional, helps the automatic tick-off)</span><input class="in" id="biMatch" value="${esc(b.match || '')}"></label>
      ${b.paidOn ? `<p class="okc small">✓ ${b.dir === 'in' ? 'Received' : 'Paid'} on ${dmy(b.paidOn)}. <a data-act="unpayBill" data-id="${b.id}">Not paid after all</a></p>` : isNew ? '' : `<p><button class="btn sm" data-act="payBill" data-id="${b.id}">Mark as ${b.dir === 'in' ? 'received' : 'paid'}</button></p>`}
      <p id="biErr" class="negc small"></p>
      <div class="row between wrap mt">${isNew ? '<span></span>' : `<button class="btn ghost danger" data-act="delBill" data-id="${b.id}">Delete</button>`}<div class="row gap"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveBill" data-id="${isNew ? '' : b.id}" data-v="${b.dir}">Save</button></div></div>`;
  }
  function tenantEditor(x) {
    const isNew = !x; x = x || { name: '', match: '', monthly: 0, from: '', payFrom: '', backPlan: 'lump', backMonths: 1, backFrom: '', notes: '' };
    const st = isNew ? null : LL.tenantStatus(state, x, today());
    return `<h2>${isNew ? 'New tenant' : esc(x.name)}</h2>
      <label class="fld">Name<input class="in" id="tnName" value="${esc(x.name)}" placeholder="e.g. the coffee bar"></label>
      <div class="row gap"><label class="fld grow">Rent per month €<input class="in" id="tnMonthly" inputmode="decimal" value="${money2(x.monthly)}"></label><label class="fld grow">Rent due since<input class="in" type="date" id="tnFrom" value="${x.from || ''}"></label></div>
      <label class="fld">Regular payments start<input class="in" type="date" id="tnPayFrom" value="${x.payFrom || ''}"><span class="muted small">Leave empty until it's agreed. Then the rent goes into the forecast from this date.</span></label>
      <fieldset class="scope"><legend>Back rent (everything due before that)</legend>
        <label><input type="radio" name="tnBack" value="lump"${x.backPlan !== 'split' && x.backPlan !== 'none' ? ' checked' : ''}> Paid in one go</label>
        <label><input type="radio" name="tnBack" value="split"${x.backPlan === 'split' ? ' checked' : ''}> In <input class="in num" id="tnBackMonths" inputmode="numeric" value="${x.backMonths || 3}" style="width:56px"> monthly instalments</label>
        <label><input type="radio" name="tnBack" value="none"${x.backPlan === 'none' ? ' checked' : ''}> Not agreed yet (not in forecast)</label>
        <label class="fld">First back-rent payment on<input class="in" type="date" id="tnBackFrom" value="${x.backFrom || ''}"></label></fieldset>
      <label class="fld">Name on their bank transfers<input class="in" id="tnMatch" value="${esc(x.match || '')}" placeholder="as it appears in the bank"><span class="muted small">Payments with this name count as rent received.</span></label>
      <label class="fld">Notes<textarea class="in" id="tnNotes" rows="2">${esc(x.notes || '')}</textarea></label>
      ${st ? `<p class="small">Due so far ${eur(st.due)} · received ${eur(st.received)} · <b class="${st.owed ? 'warnc' : 'okc'}">owed ${eur(st.owed)}</b></p>` : ''}
      <div class="row between wrap mt">${isNew ? '<span></span>' : `<button class="btn ghost danger" data-act="delTenant" data-id="${x.id}">Delete</button>`}<div class="row gap"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveTenant" data-id="${isNew ? '' : x.id}">Save</button></div></div>`;
  }
  function attention(kf) {
    const out = [];
    const u = unsorted();
    if (u.length) out.push(`<a data-act="page" data-v="tx" data-cat="uncat">${u.length} payment${u.length > 1 ? 's' : ''} not sorted yet</a> (e.g. ${esc(u[0].party)} ${eur(u[0].amount)})`);
    const unk = state.settings.instructors.filter((i) => !i.deleted && i.status === 'unknown');
    if (unk.length) out.push(`New in the schedule: ${unk.map((i) => esc(i.name)).join(', ')}. <a data-act="page" data-v="settings">Paid or not?</a>`);
    if (agg.lastBankDate) {
      const age = (new Date(today()) - new Date(agg.lastBankDate)) / 864e5;
      if (age > 20) out.push(`Bank data ends ${dmy(agg.lastBankDate)}. <a data-act="page" data-v="import">Import the latest statement</a>.`);
    }
    const lastSale = LL.live(state.sales).reduce((a, s) => (s.date > a ? s.date : a), '');
    if (lastSale && (new Date(today()) - new Date(lastSale)) / 864e5 > 20) out.push(`Eversports sales end ${dmy(lastSale)}. <a data-act="page" data-v="import">Import the revenue report</a>.`);
    if (!agg.statementsOk) out.push('A bank statement doesn\'t add up. Re-import it as PDF.');
    return out;
  }

  // ---------- charts (SVG, hand-made) ----------
  function chartW(full) {
    const vw = Math.min(window.innerWidth, 1180);
    if (full || window.innerWidth < 760) return Math.max(300, vw - 32 - (window.innerWidth < 520 ? 26 : 38));
    return Math.max(300, (vw - 32 - 16) / 2 - 38);
  }
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
  function kfmt(c) { const v = c / 100; return Math.abs(v) >= 1000 ? nf0.format(Math.round(v / 1000)) + 'k' : nf0.format(v); }
  function barsInOut(ms) {
    if (!ms.length) return '<p class="muted">No months yet.</p>';
    const W = chartW(), H = 230, L = 44, B = 26, T = 10;
    const max = niceMax(Math.max(...ms.map((m) => Math.max(m.groups.in, -m.groups.out))));
    const cw = (W - L - 6) / ms.length, bw = Math.min(26, (cw - 10) / 2);
    const y = (v) => T + (H - T - B) * (1 - v / max);
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = (max * i) / 4; g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
    ms.forEach((m, i) => {
      const cx = L + cw * i + cw / 2;
      const hi = y(0) - y(m.groups.in), ho = y(0) - y(-m.groups.out);
      g += `<g class="hov" data-tip="${esc(`<b>${mName(m.m, true)}</b><br>Money in ${eur(m.groups.in)}<br>Running costs ${eur(-m.groups.out)}<br>Result ${eurS(m.op)}`)}">
        <rect class="hit" x="${cx - cw / 2}" y="${T}" width="${cw}" height="${H - T - B}"/>
        ${bar(cx - bw - 1, y(0), bw, hi, 'in')}${bar(cx + 1, y(0), bw, ho, 'out')}
        <text class="ax" x="${cx}" y="${H - 8}" text-anchor="middle">${MON[+m.m.slice(5) - 1]}</text></g>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Money in and running costs per month">${g}<line class="base" x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
  }
  function bar(x, base, w, h, c) {
    if (h <= 0) return '';
    const r = Math.min(4, h, w / 2);
    return `<path class="b-${c}" d="M${x},${base} V${base - h + r} Q${x},${base - h} ${x + r},${base - h} H${x + w - r} Q${x + w},${base - h} ${x + w},${base - h + r} V${base} Z"/>`;
  }
  function lineCash(ms, fc) {
    if (!ms.length) return '<p class="muted">No bank data yet.</p>';
    const pts = ms.map((m) => ({ m: m.m, v: m.end, f: false }));
    const all = [...pts, ...fc.filter((f) => f.m > pts[pts.length - 1].m).map((f) => ({ m: f.m, v: f.end, f: true }))];
    const W = chartW(), H = 230, L = 50, B = 26, T = 10, R = 8;
    const hiV = Math.max(...all.map((p) => p.v), 1), loV = Math.min(0, ...all.map((p) => p.v));
    const stepV = niceMax((hiV - loV) / 4);
    const lo = Math.floor(loV / stepV) * stepV, maxV = Math.max(lo + stepV, Math.ceil(hiV / stepV) * stepV);
    const x = (i) => L + ((W - L - R) * i) / Math.max(1, all.length - 1);
    const y = (v) => T + (H - T - B) * (1 - (v - lo) / (maxV - lo));
    let g = '';
    for (let v = lo; v <= maxV + 1; v += stepV) { g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
    if (lo < 0) g += `<line class="zero" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
    const real = all.filter((p) => !p.f);
    g += `<path class="ln" d="${real.map((p, i) => (i ? 'L' : 'M') + x(i) + ',' + y(p.v)).join(' ')}"/>`;
    const fi = all.findIndex((p) => p.f);
    if (fi > 0) g += `<path class="ln dash" d="${all.slice(fi - 1).map((p, j) => (j ? 'L' : 'M') + x(fi - 1 + j) + ',' + y(p.v)).join(' ')}"/>`;
    const step = Math.ceil(all.length / Math.max(3, Math.floor(W / 70)));
    all.forEach((p, i) => {
      if (i % step === 0 || i === all.length - 1) g += `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${MON[+p.m.slice(5) - 1]}${p.m.slice(5) === '01' || i === 0 ? " '" + p.m.slice(2, 4) : ''}</text>`;
      const cw = (W - L - R) / Math.max(1, all.length - 1);
      g += `<g class="hov" data-tip="${esc(`<b>${mName(p.m, true)}</b><br>${p.f ? 'Forecast ' : 'Month end '}${eur(p.v)}`)}"><rect class="hit" x="${x(i) - cw / 2}" y="${T}" width="${cw}" height="${H - T - B}"/><circle class="pt${p.f ? ' f' : ''}" cx="${x(i)}" cy="${y(p.v)}" r="4"/></g>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Cash in the bank per month">${g}</svg>`;
  }
  function barsSingle(ms, val, tip) {
    if (!ms.length) return '<p class="muted">No data yet.</p>';
    const W = chartW(true), H = 220, L = 44, B = 26, T = 10;
    const max = niceMax(Math.max(...ms.map(val), 1));
    const cw = (W - L - 6) / ms.length, bw = Math.min(34, cw - 12);
    const y = (v) => T + (H - T - B) * (1 - v / max);
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = (max * i) / 4; g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
    ms.forEach((m, i) => {
      const cx = L + cw * i + cw / 2;
      g += `<g class="hov" data-tip="${esc(tip(m))}"><rect class="hit" x="${cx - cw / 2}" y="${T}" width="${cw}" height="${H - T - B}"/>${bar(cx - bw / 2, y(0), bw, y(0) - y(Math.max(0, val(m))), 'in')}<text class="ax" x="${cx}" y="${H - 8}" text-anchor="middle">${MON[+m.m.slice(5) - 1]}</text></g>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}<line class="base" x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
  }
  const help = (t) => ` <button class="q" data-act="help" data-tip="${esc(t)}" aria-label="What is this?">?</button>`;

  // ---------- Cash flow ----------
  const CAT_HELP = {
    events_out: 'Catering, drinks, decoration and other costs of events and workshops.',
    sales: 'Money Eversports (via Stripe) pays into the bank, usually once a week. Eversports bills its own fee separately.',
    terminal: 'Card payments taken in the studio with the SumUp reader.',
    other_in: 'Anything else coming in that isn\'t a sale, a loan or a tax refund (e.g. a supplier refund).',
    rent: 'Monthly rent incl. service charges and VAT.',
    instructors: 'Pay that reaches the instructors (net pay or their invoices).',
    payroll: 'Social security (ÖGK), payroll tax and municipal tax on instructor pay.',
    platform: 'The monthly Eversports invoice.',
    utilities: 'Electricity and similar.', insurance: 'Studio insurance policies.',
    software: 'Google Workspace, website hosting, Canva and other tools.',
    marketing: 'Ads (Instagram/Facebook), flyers, printing.',
    accounting: 'Tax advisor, notary, court fees.', bank: 'Account fees, card fees, interest.',
    loan_fees: 'Fees for the bank loan guarantee.', supplies: 'Things for the studio after opening: cleaning, decoration, small equipment.',
    license: 'The yearly Lagree licence fee.', memberships: 'Chamber of commerce (WKO) and similar fees.', travel: 'Train, hotel and travel costs.',
    other_out: 'Costs that fit nowhere else.', uncat: 'Payments the app couldn\'t sort. Pick a category in Transactions.',
    setup: 'One-off costs to build the studio: equipment, construction, design. Not part of the running result.',
    certification: 'Lagree certification and training. One-off, not part of the running result.',
    vat: 'VAT refunds from (or payments to) the tax office.',
    owner: 'Money you and your co-owner put in (capital, shareholder loans, deposits).',
    bank_loan: 'Money drawn from the bank loan.', loan_repay: 'Monthly loan repayment to the bank.', deposit: 'The security deposit for the loan.',
  };
  function viewCashflow() {
    const lastBank = LL.mk(agg.lastBankDate || today());
    const fcAll = LL.forecast(state, agg).months;
    const partialM = fcAll[0] && fcAll[0].partial ? fcAll[0].m : null;
    let ms = agg.months.filter((m) => m.m <= lastBank && m.m !== partialM);
    if (!ui.cfAll) ms = ms.filter((m) => m.m >= LL.addMonths(LL.mk(state.settings.openingDate), -1));
    const cols = [
      ...ms.map((m) => ({ m: m.m, cats: m.cats, groups: m.groups, op: m.op, net: m.net, end: m.end, fc: false })),
      ...fcAll.map((f) => ({ m: f.m, cats: f.cats, groups: f.groups, op: f.op, net: f.net, end: f.end, fc: true, partial: f.partial })),
    ];
    const act = cols.filter((c) => !c.fc);
    const catsBy = (grp) => Object.keys(CATS).filter((k) => CATS[k].group === grp && cols.some((m) => Math.round(m.cats[k] || 0)));
    const cell = (c, k) => { const v = Math.round(c.cats[k] || 0); return `<td class="r ${cls(v)}${c.fc ? ' fc' : ''}">${v ? (c.fc ? eur(v) : `<a data-act="drill" data-m="${c.m}" data-cat="${k}">${eur(v)}</a>`) : '<span class="muted">·</span>'}</td>`; };
    const tot = (f) => act.reduce((a, c) => a + f(c), 0);
    const rows = (grp) => catsBy(grp).map((k) => `<tr><th class="rl">${CATS[k].label}${help(CAT_HELP[k] || '')}</th>${cols.map((c) => cell(c, k)).join('')}<td class="r tot ${cls(tot((c) => c.cats[k] || 0))}">${eur(tot((c) => c.cats[k] || 0))}</td></tr>`).join('');
    const sum = (label, f, cl = '') => `<tr class="sum ${cl}"><th class="rl">${label}</th>${cols.map((c) => `<td class="r ${cls(f(c))}${c.fc ? ' fc' : ''}">${eur(f(c))}</td>`).join('')}<td class="r tot ${cls(tot(f))}">${eur(tot(f))}</td></tr>`;
    const head = (t) => `<tr class="gh"><th class="rl" colspan="${cols.length + 2}">${t}</th></tr>`;
    return `<div class="card">
      <div class="row between wrap"><h2>Cash flow by month${help('Every euro that moved on the business account, sorted. Tap an amount to see the payments behind it. The shaded columns on the right are the forecast for the next 3 months.')}</h2>
      <div class="seg"><button class="${!ui.cfAll ? 'on' : ''}" data-act="cfAll" data-v="0">Since opening</button><button class="${ui.cfAll ? 'on' : ''}" data-act="cfAll" data-v="1">Whole history</button></div></div>
      <div class="tablewrap sticky"><table class="t cf">
        <thead><tr><th class="rl"></th>${cols.map((c) => `<th class="r${c.fc ? ' fc' : ''}">${mName(c.m)}${c.fc ? `<div class="fct">${c.partial ? 'actual + forecast' : 'forecast'}</div>` : ''}</th>`).join('')}<th class="r">Total<div class="fct">so far</div></th></tr></thead>
        <tbody>
          ${head('Money in')}${rows('in')}${sum('Total money in', (c) => c.groups.in)}
          ${head('Running costs')}${rows('out')}${sum('Total running costs', (c) => c.groups.out)}
          ${sum('Operating result', (c) => c.op, 'strong')}
          ${catsBy('setup').length ? head('One-off') + rows('setup') : ''}
          ${catsBy('tax').length ? head('Tax office') + rows('tax') : ''}
          ${catsBy('fin').length ? head('Financing') + rows('fin') : ''}
          ${sum('Net change', (c) => c.net, 'strong')}
          <tr class="sum strong"><th class="rl">Cash at month end</th>${cols.map((c) => `<td class="r${c.fc ? ' fc' : ''} ${c.end < 0 ? 'neg' : ''}">${eur(c.end)}</td>`).join('')}<td></td></tr>
          ${LL.live(state.tenants).filter((t) => t.from && t.monthly).map((t) => { let run = 0; const rec = (m) => LL.tenantStatus(state, t, today()).payments.filter((x) => LL.mk(x.date) === m).reduce((a, x) => a + x.amount, 0); const owedTo = (m) => { run = 0; for (const mm of LL.monthRange(LL.mk(t.from), m)) run += LL.tenantDue(t, mm) - rec(mm); return run; }; return `<tr class="memo"><th class="rl">${esc(t.name)} rent owed to us${help('Not cash: rent that was due but hasn\'t arrived yet (cumulative, at month end). It turns into money in when they pay.')}</th>${cols.map((c) => { const v = c.fc || c.m < LL.mk(t.from) ? null : owedTo(c.m); return `<td class="r${c.fc ? ' fc' : ''}">${v ? `<span class="warnc">${eur(v)}</span>` : '<span class="muted">·</span>'}</td>`; }).join('')}<td></td></tr>`; }).join('')}
        </tbody></table></div>
      <p class="muted small">Actual months up to ${dmy(agg.lastBankDate)}, the last day with bank data. Forecast: sales at the pace of the last 6 weeks; fixed costs when they are due; instructor pay from the planned classes; events, rentals, rent from tenants and open bills when they are due. Details: Help → Result, runway, buffer.</p>
    </div>`;
  }

  // ---------- Sales ----------
  function viewSales() {
    const ms = agg.months.filter((m) => m.sales.gross || m.sales.count || m.vouchers.count);
    const conv = LL.trialConversion(state);
    const groups = LL.PRODUCT_GROUPS.filter((g) => ms.some((m) => m.sales.byGroup[g]));
    const v = (o) => (o ? (ui.salesNet ? o.net : o.gross) : 0);
    const last = ms.filter((m) => m.m < LL.mk(today())).slice(-1)[0];
    const totalNow = ms.find((m) => m.m === LL.mk(today()));
    return `<div class="tiles">
        <div class="tile"><div class="label">${last ? mName(last.m, true) : ''} sales</div><div class="big">${last ? eur(v(last.sales)) : '—'}</div><div class="sub">${ui.salesNet ? 'net of VAT' : 'incl. VAT'}</div></div>
        <div class="tile"><div class="label">${mName(LL.mk(today()), true)} so far</div><div class="big">${totalNow ? eur(v(totalNow.sales)) : '—'}</div><div class="sub">until ${dmy(LL.live(state.sales).reduce((a, s) => (s.date > a ? s.date : a), ''))}</div></div>
        
      </div>
      <div class="card">
        <div class="row between wrap"><h2>Sales per month${help('From the Eversports revenue report plus gift voucher sales. Payments made with a studio gift voucher are left out, because the voucher sale already counted.')}</h2>
        <div class="seg"><button class="${!ui.salesNet ? 'on' : ''}" data-act="salesNet" data-v="0">Incl. VAT</button><button class="${ui.salesNet ? 'on' : ''}" data-act="salesNet" data-v="1">Net of VAT</button></div></div>
        ${barsSingle(ms, (m) => v(m.sales), (m) => `<b>${mName(m.m, true)}</b><br>Sales ${eur(v(m.sales))}`)}
        <div class="tablewrap sticky"><table class="t cf">
          <thead><tr><th class="rl"></th>${ms.map((m) => `<th class="r">${mName(m.m)}</th>`).join('')}</tr></thead>
          <tbody>
          ${groups.map((g) => `<tr><th class="rl">${g}</th>${ms.map((m) => { const o = m.sales.byGroup[g]; return `<td class="r">${o ? eur(v(o)) + `<div class="muted small">${o.count}×</div>` : '<span class="muted">·</span>'}</td>`; }).join('')}</tr>`).join('')}
          <tr class="sum strong"><th class="rl">Total sales</th>${ms.map((m) => `<td class="r">${eur(v(m.sales))}</td>`).join('')}</tr>
          <tr><th class="rl">of which refunds</th>${ms.map((m) => `<td class="r ${cls(m.sales.refunds)}">${m.sales.refunds ? eur(m.sales.refunds) : '<span class="muted">·</span>'}</td>`).join('')}</tr>
          <tr><th class="rl">Paid with gift voucher${help('Classes paid with a studio voucher. Not new money: shown for information.')}</th>${ms.map((m) => `<td class="r muted">${m.sales.voucherRedeemed ? eur(m.sales.voucherRedeemed) : '·'}</td>`).join('')}</tr>
          <tr class="gh"><th class="rl" colspan="${ms.length + 1}">Compared with the bank</th></tr>
          <tr><th class="rl">Eversports payouts${help('What Stripe/Eversports actually paid into the bank that month. It differs from sales by timing (payouts run weekly) and by in-studio card payments, which arrive through SumUp.')}</th>${ms.map((m) => `<td class="r">${m.cats.sales ? eur(m.cats.sales) : '<span class="muted">·</span>'}</td>`).join('')}</tr>
          <tr><th class="rl">Card terminal (SumUp)</th>${ms.map((m) => `<td class="r">${m.cats.terminal ? eur(m.cats.terminal) : '<span class="muted">·</span>'}</td>`).join('')}</tr>
          <tr><th class="rl">Eversports fees</th>${ms.map((m) => `<td class="r ${cls(m.cats.platform || 0)}">${m.cats.platform ? eur(m.cats.platform) : '<span class="muted">·</span>'}</td>`).join('')}</tr>
          <tr><th class="rl">Fees as % of sales</th>${ms.map((m) => `<td class="r muted">${m.cats.platform && m.sales.gross ? pct(-m.cats.platform / m.sales.gross) : '·'}</td>`).join('')}</tr>

          </tbody></table></div>
      </div>`;
  }

  function insightsCard(list, short) {
    if (!list.length) return '';
    const items = short ? list.filter((x) => x.tone === 'bad').slice(0, 2) : list;
    if (!items.length) return '';
    const icon = { bad: '↓', good: '↑', info: '→' };
    return `<div class="card ideas"><div class="row between"><h2>What to work on${help('Suggestions from your own numbers: sales pace, trial follow-up, product mix and how full each class time is. They update every time you import.')}</h2>${short ? '<a data-act="page" data-v="growth">All ideas</a>' : ''}</div>
      <ul class="idea-list">${items.map((x) => `<li class="idea ${x.tone}"><span class="ic">${icon[x.tone]}</span><div><b>${esc(x.title)}</b><p>${esc(x.text)}</p></div></li>`).join('')}</ul></div>`;
  }

  // ---------- Team & classes ----------
  function viewTeam() {
    const ins = state.settings.instructors.filter((i) => !i.deleted);
    const byId = Object.fromEntries(ins.map((i) => [i.id, i]));
    const next4 = [0, 1, 2, 3].map((k) => LL.addMonths(LL.mk(today()), k));
    const cm = agg.months.filter((m) => m.classes.taught || m.classes.planned || m.classes.estimated || m.ins.expected || m.ins.paidNet || next4.includes(m.m));
    const exp = (m) => m.ins.expected + (m.ins.est || 0);
    if (!cm.length) return `<div class="card"><h2>Team</h2><p class="muted">Import the Eversports “Activity overview of all appointments” to see classes and instructor pay.</p></div>`;
    const cur = LL.mk(today());
    if (!ui.teamMonth || !cm.find((m) => m.m === ui.teamMonth)) ui.teamMonth = cm.filter((m) => m.m <= cur).slice(-1)[0]?.m || cm[0].m;
    const M = agg.byMonth[ui.teamMonth];
    const ratio = LL.onCostRatio(agg);
    const ids = new Set([...Object.keys(M.classes.byIns), ...Object.keys(M.ins.byIns)]);
    const rows = [...ids].map((id) => {
      const i = byId[id]; const c = M.classes.byIns[id] || { classes: 0, attendees: 0, capacity: 0 }; const p = M.ins.byIns[id] || { classes: 0, expected: 0, paid: 0 };
      const st = i ? (LL.paidIn(i, M.m) ? 'paid' : i.status === 'paid' ? 'unpaid' : i.status) : 'unknown';
      return { id, name: i ? i.name : id.replace(/^x/, ''), status: st, classes: Math.max(c.classes + (c.planned || 0), p.classes) + (c.est || 0), est: c.est || 0, taught: c.classes, att: c.attendees, cap: c.capacity, expected: p.expected + (p.est || 0), paid: p.paid };
    }).sort((a, b) => (a.status === 'paid') === (b.status === 'paid') ? b.classes - a.classes : a.status === 'paid' ? -1 : 1);
    const stLabel = { paid: 'paid', unpaid: 'unpaid', unknown: 'not set', excluded: '' };
    // one bar per instructor: length = classes, colour = how full their classes were
    const bars = rows.filter((r) => r.classes > 0).sort((a, b) => b.classes - a.classes);
    const totalC = bars.reduce((a, r) => a + r.classes, 0) || 1, maxC = bars[0] ? bars[0].classes : 1;
    const step = (f) => (f < 0.2 ? 1 : f < 0.35 ? 2 : f < 0.5 ? 3 : f < 0.65 ? 4 : 5);
    const barsHtml = `<div class="ibars">${bars.map((r) => { const f = r.cap ? r.att / r.cap : null; return `<div class="ibar hov" data-tip="${esc(`<b>${esc(r.name)}</b><br>${r.classes} classes (${pct(r.classes / totalC)} of all)${r.taught < r.classes ? `<br>${r.classes - r.taught} still planned` : ''}${f !== null ? `<br>${pct(f)} full, ${nf2.format(r.att / r.taught)} guests per class` : ''}`)}"><span class="iname">${esc(r.name)}</span><span class="itrack"><span class="ifill ${f === null ? 'seq0' : 'seq' + step(f)}" style="width:${Math.max(3, (r.classes / maxC) * 100)}%"></span></span><span class="ival"><b>${r.classes}</b> <span class="muted">${pct(r.classes / totalC)}</span>${f !== null ? ` · ${pct(f)} full` : ' · planned'}</span></div>`; }).join('')}</div>
      <div class="seqlegend"><span class="muted small">How full:</span>${['under 20%', '20–35%', '35–50%', '50–65%', '65%+'].map((l, i) => `<span><i class="sw seq${i + 1}"></i>${l}</span>`).join('')}<span><i class="sw seq0"></i>planned</span></div>`;
    const fut = M.m > cur || (M.m === cur && (M.classes.planned || M.classes.estimated));
    return `<div class="card">
      <div class="row between wrap"><h2>Instructors${help('Classes from the Eversports activity export. Expected pay = classes × rate (Settings). Paid = what left the bank for that month (payroll is paid early the following month).')}</h2>
        <div class="chips">${cm.map((m) => `<button class="chip${m.m === ui.teamMonth ? ' on' : ''}" data-act="teamMonth" data-v="${m.m}">${mName(m.m)}${m.m > cur ? ' · plan' : ''}</button>`).join('')}</div></div>
      ${barsHtml}
      <div class="tablewrap mt"><table class="t">
        <thead><tr><th>Instructor</th><th class="r">Classes</th><th class="r">Avg. guests</th><th class="r">Full</th><th class="r">Expected pay</th><th class="r">Paid (bank)</th></tr></thead>
        <tbody>${rows.map((r) => `<tr class="${r.status !== 'paid' ? 'dim' : ''}"><td>${esc(r.name)} ${r.status !== 'paid' ? `<span class="tag">${stLabel[r.status] || ''}</span>` : ''}</td><td class="r">${r.classes}${r.taught < r.classes - r.est ? ` <span class="muted small">(${r.classes - r.taught - r.est} planned)</span>` : ''}${r.est ? ` <span class="muted small">(${r.est} estimated)</span>` : ''}</td><td class="r">${r.taught ? nf2.format(r.att / r.taught).replace(/,0+$/, '') : '·'}</td><td class="r">${r.cap ? pct(r.att / r.cap) : '·'}</td><td class="r">${r.status === 'paid' ? eur(r.expected) : '·'}</td><td class="r">${r.paid ? eur(r.paid, true) : '<span class="muted">·</span>'}</td></tr>`).join('')}</tbody>
        <tfoot><tr class="sum"><th>Total</th><th class="r">${M.classes.taught + M.classes.planned + (M.classes.estimated || 0)}</th><th class="r">${M.classes.taught ? nf2.format(M.classes.attendees / M.classes.taught) : '·'}</th><th class="r">${M.classes.capacity ? pct(M.classes.attendees / M.classes.capacity) : '·'}</th><th class="r">${eur(exp(M))}</th><th class="r">${M.ins.paidNet ? eur(M.ins.paidNet, true) : '·'}</th></tr>
        <tr><td colspan="5">Social security & payroll tax for ${mName(M.m)}</td><td class="r">${M.ins.payroll ? eur(M.ins.payroll, true) : fut || !M.ins.paidNet ? `<span class="muted">≈ ${eur(exp(M) * (ratio - 1))}</span>` : '·'}</td></tr>
        <tr class="sum strong"><td colspan="4">Instructor cost${fut || !M.ins.paidNet ? ' (expected)' : ''}</td><td class="r">${eur(exp(M) * ratio)}</td><td class="r">${M.ins.paidNet ? eur(M.ins.paidNet + M.ins.payroll) : '·'}</td></tr></tfoot>
      </table></div>
      ${M.classes.estimated ? `<p class="small attn-in">${M.classes.estimated} classes in ${mName(M.m)} have no instructor yet. They're estimated with whoever usually teaches that slot${M.classes.open ? `; ${M.classes.open} have no usual instructor and aren't counted` : ''}. Assign instructors in the Schedule to make it exact.</p>` : ''}
      <p class="muted small">“Paid” is net pay; payroll tax and social security come on top (recently ${pct(ratio - 1)} of class pay). ${M.m >= LL.addMonths(LL.mk(agg.lastBankDate || today()), 0) ? `Pay for ${mName(M.m)} shows once the bank statement for ${mName(LL.addMonths(M.m, 1))} is imported.` : ''}</p>
    </div>
    <div class="card">
      <h2>Classes per month</h2>
      <div class="tablewrap"><table class="t">
        <thead><tr><th>Month</th><th class="r">Classes</th><th class="r">by paid team</th><th class="r">Guests</th><th class="r">Avg. per class</th><th class="r">Full</th><th class="r">Instructor cost</th><th class="r">Cost per guest</th></tr></thead>
        <tbody>${cm.map((m) => { const cost = m.ins.paidNet ? m.ins.paidNet + m.ins.payroll : exp(m) * ratio; const est = !m.ins.paidNet; return `<tr><td>${mName(m.m, true)}</td><td class="r">${m.classes.taught}${m.classes.planned + (m.classes.estimated || 0) ? ` <span class="muted small">+${m.classes.planned + (m.classes.estimated || 0)} planned</span>` : ''}</td><td class="r">${m.classes.paidTaught}</td><td class="r">${m.classes.attendees || '·'}</td><td class="r">${m.classes.taught ? nf2.format(m.classes.attendees / m.classes.taught) : '·'}</td><td class="r">${m.classes.capacity ? pct(m.classes.attendees / m.classes.capacity) : '·'}</td><td class="r">${est ? '≈ ' : ''}${eur(cost)}</td><td class="r">${m.classes.attendees && !m.classes.planned ? (est ? '≈ ' : '') + eur(cost / m.classes.attendees, true) : '·'}</td></tr>`; }).join('')}</tbody>
      </table></div>
    </div>`;
  }

  // ---------- Transactions ----------
  function viewTx() {
    const months = [...new Set(agg.bank.map((t) => LL.mk(t.date)))].sort().reverse();
    const q = (ui.txQ || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    let list = agg.bank.slice().reverse();
    if (ui.txMonth) list = list.filter((t) => LL.mk(t.date) === ui.txMonth);
    if (ui.txCat) list = list.filter((t) => t._c.cat === ui.txCat);
    if (q) list = list.filter((t) => (t.party + ' ' + t.text + ' ' + (CATS[t._c.cat] || {}).label).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q));
    const total = list.reduce((a, t) => a + t.amount, 0);
    const paid = state.settings.instructors.filter((i) => !i.deleted && i.status === 'paid');
    const opts = (sel) => Object.entries(GROUPS).map(([g, gl]) => `<optgroup label="${gl}">${Object.entries(CATS).filter(([, c]) => c.group === g).map(([k, c]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${c.label}</option>`).join('')}</optgroup>`).join('');
    const shown = list.slice(0, 400);
    return `<div class="card">
      <div class="filters">
        <div class="search"><input id="txQ" type="search" placeholder="Search name, reference, category" value="${esc(ui.txQ)}"><button class="x" data-act="txClear" aria-label="Clear">×</button></div>
        <select data-act="txMonth"><option value="">All months</option>${months.map((m) => `<option value="${m}"${m === ui.txMonth ? ' selected' : ''}>${mName(m, true)}</option>`).join('')}</select>
        <select data-act="txCat"><option value="">All categories</option>${opts(ui.txCat)}</select>
      </div>
      <p class="muted small">${list.length} payments · total ${eur(total, true)}${list.length > shown.length ? ` · showing the latest ${shown.length}` : ''}</p>
      <div class="txlist">${shown.map((t) => `
        <div class="tx${t._c.cat === 'uncat' ? ' warn' : ''}">
          <div class="tx-main"><div class="tx-name">${esc(t.party || t.ref)}</div><div class="tx-meta">${dmy(t.date)} · ${esc((t.ref || '').slice(0, 60))}${t.note ? ' · ' + esc(t.note) : ''}</div></div>
          <div class="tx-amt ${cls(t.amount)}">${eur(t.amount, true)}</div>
          <div class="tx-cat"><select data-act="setCat" data-id="${t.id}" aria-label="Category">${opts(t._c.cat)}</select>
          ${t._c.cat === 'instructors' ? `<select data-act="setWho" data-id="${t.id}" aria-label="Instructor"><option value="">Who?</option>${paid.map((i) => `<option value="${i.id}"${i.id === t._c.who ? ' selected' : ''}>${esc(i.name)}</option>`).join('')}</select>` : ''}
          ${t._c.manual ? '<span class="tag">set by you</span>' : ''}</div>
        </div>`).join('') || '<p class="muted">Nothing found.</p>'}</div>
    </div>`;
  }

  // ---------- Import ----------
  function viewImport() {
    const log = (state.importLog || []).slice(0, 12);
    return `<div class="card">
      <h2>Import files</h2>
      <label class="drop" id="drop">
        <input type="file" id="file" multiple accept=".pdf,.csv,.json">
        <b>Drop files here or tap to choose</b>
        <span class="muted small">Several at once is fine. Anything already imported is skipped. Files are read on this device and never uploaded.</span>
      </label>
      <div id="importResult"></div>
    </div>
    <div class="card">
      <h2>Once a month (about 5 minutes)</h2>
      <ol class="steps">
        <li><b>Bank: George Business</b> → account → <i>Kontoauszüge</i> → download the statement PDF of the month. Statements are checked against their opening and closing balance.</li>
        <li><b>Eversports → Financials → Reports → Revenue report (based on income & expenses)</b>, period: the month (or the whole year; duplicates are skipped).</li>
        <li><b>Eversports → Financials → Reports → Voucher sales report</b>, same period.</li>

  async function importOne(f) {

    }

          <label class="fld">GitHub token<input class="in mono" id="sTok" type="password" autocomplete="off" placeholder="ghp_…"></label>

      </div>

        ${LL.live(state.tenants).map((x) => { const st = LL.tenantStatus(state, x, today()); return `<button class="omrow" data-act="editTenant" data-id="${x.id}"><span><b>${esc(x.name)}</b><br><span class="small muted">${eur(x.monthly)} a month${x.from ? ' since ' + dmy(x.from) : ''}${x.payFrom ? ' · pays from ' + dmy(x.payFrom) : ''}</span></span><span class="${st.owed ? 'warnc' : 'okc'} b">${st.owed ? 'owes ' + eur(st.owed) : 'paid up'}</span></button>`; }).join('') || '<p class="muted small">None yet.</p>'}
